<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sketchy">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F8F6F1"/>

  <!-- Title Area -->
  <text x="600" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#1A2B4A">
    时区计算的复杂性
  </text>
  <text x="600" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#6B7B8C">
    香港期货K线周期实战案例
  </text>

  <!-- Multiple Clocks Representing Time Zones -->
  <g transform="translate(150, 180)">
    <!-- Clock 1: Shanghai -->
    <circle cx="80" cy="80" r="70" fill="none" stroke="#1A2B4A" stroke-width="3" filter="url(#sketchy)"/>
    <circle cx="80" cy="80" r="65" fill="#E8E4DC"/>
    <text x="80" y="30" text-anchor="middle" font-family="Georgia" font-size="14" fill="#1A2B4A">Shanghai</text>
    <!-- Clock hands -->
    <line x1="80" y1="80" x2="80" y2="40" stroke="#1A2B4A" stroke-width="3"/>
    <line x1="80" y1="80" x2="110" y2="80" stroke="#C4786A" stroke-width="2"/>
    <!-- Hour markers -->
    <circle cx="80" cy="25" r="2" fill="#1A2B4A"/>
    <circle cx="135" cy="80" r="2" fill="#1A2B4A"/>
    <circle cx="80" cy="135" r="2" fill="#1A2B4A"/>
    <circle cx="25" cy="80" r="2" fill="#1A2B4A"/>

    <!-- Clock 2: Hong Kong (overlapping, different time) -->
    <g transform="translate(200, 0)">
      <circle cx="80" cy="80" r="70" fill="none" stroke="#C4786A" stroke-width="3" filter="url(#sketchy)"/>
      <circle cx="80" cy="80" r="65" fill="#F5F2ED" opacity="0.9"/>
      <text x="80" y="30" text-anchor="middle" font-family="Georgia" font-size="14" fill="#C4786A">HKFE</text>
      <line x1="80" y1="80" x2="95" y2="50" stroke="#C4786A" stroke-width="3"/>
      <line x1="80" y1="80" x2="115" y2="95" stroke="#1A2B4A" stroke-width="2"/>
    </g>

    <!-- Clock 3: UTC -->
    <g transform="translate(100, 140)">
      <circle cx="80" cy="80" r="55" fill="none" stroke="#6B7B8C" stroke-width="2" filter="url(#sketchy)"/>
      <text x="80" y="50" text-anchor="middle" font-family="Georgia" font-size="12" fill="#6B7B8C">UTC</text>
      <line x1="80" y1="80" x2="60" y2="60" stroke="#6B7B8C" stroke-width="2"/>
    </g>
  </g>

  <!-- K-line Chart Representation -->
  <g transform="translate(550, 180)">
    <!-- Chart background -->
    <rect x="0" y="0" width="500" height="280" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="2" rx="10"/>

    <!-- Grid lines -->
    <line x1="0" y1="70" x2="500" y2="70" stroke="#E8E4DC" stroke-width="1"/>
    <line x1="0" y1="140" x2="500" y2="140" stroke="#E8E4DC" stroke-width="1"/>
    <line x1="0" y1="210" x2="500" y2="210" stroke="#E8E4DC" stroke-width="1"/>

    <!-- Candlesticks -->
    <!-- Green candle (up) -->
    <rect x="30" y="120" width="20" height="40" fill="#5A8A6E" stroke="#1A2B4A" stroke-width="1"/>
    <line x1="40" y1="100" x2="40" y2="120" stroke="#1A2B4A" stroke-width="1"/>
    <line x1="40" y1="160" x2="40" y2="180" stroke="#1A2B4A" stroke-width="1"/>

    <!-- Red candle (down) -->
    <rect x="80" y="80" width="20" height="60" fill="#C4786A" stroke="#1A2B4A" stroke-width="1"/>
    <line x1="90" y1="60" x2="90" y2="80" stroke="#1A2B4A" stroke-width="1"/>
    <line x1="90" y1="140" x2="90" y2="160" stroke="#1A2B4A" stroke-width="1"/>

    <!-- More candles -->
    <rect x="130" y="100" width="20" height="50" fill="#5A8A6E" stroke="#1A2B4A" stroke-width="1"/>
    <line x1="140" y1="80" x2="140" y2="100" stroke="#1A2B4A" stroke-width="1"/>
    <line x1="140" y1="150" x2="140" y2="170" stroke="#1A2B4A" stroke-width="1"/>

    <rect x="180" y="140" width="20" height="30" fill="#C4786A" stroke="#1A2B4A" stroke-width="1"/>
    <line x1="190" y1="120" x2="190" y2="140" stroke="#1A2B4A" stroke-width="1"/>
    <line x1="190" y1="170" x2="190" y2="190" stroke="#1A2B4A" stroke-width="1"/>

    <!-- Gap area (cross-session) -->
    <rect x="220" y="20" width="80" height="240" fill="#C4786A" opacity="0.1" stroke="#C4786A" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="260" y="140" text-anchor="middle" font-family="Georgia" font-size="14" fill="#C4786A" transform="rotate(-90, 260, 140)">跨市场等待期</text>

    <!-- More candles after gap -->
    <rect x="330" y="90" width="20" height="45" fill="#5A8A6E" stroke="#1A2B4A" stroke-width="1"/>
    <line x1="340" y1="70" x2="340" y2="90" stroke="#1A2B4A" stroke-width="1"/>
    <line x1="340" y1="135" x2="340" y2="155" stroke="#1A2B4A" stroke-width="1"/>

    <rect x="380" y="110" width="20" height="35" fill="#C4786A" stroke="#1A2B4A" stroke-width="1"/>
    <rect x="430" y="85" width="20" height="55" fill="#5A8A6E" stroke="#1A2B4A" stroke-width="1"/>

    <!-- X-axis labels -->
    <text x="40" y="260" text-anchor="middle" font-family="Georgia" font-size="10" fill="#6B7B8C">17:15</text>
    <text x="140" y="260" text-anchor="middle" font-family="Georgia" font-size="10" fill="#6B7B8C">23:00</text>
    <text x="340" y="260" text-anchor="middle" font-family="Georgia" font-size="10" fill="#6B7B8C">09:15</text>
    <text x="440" y="260" text-anchor="middle" font-family="Georgia" font-size="10" fill="#6B7B8C">12:00</text>

    <!-- Arrow showing cross-session -->
    <path d="M 220 40 Q 180 40 140 70" fill="none" stroke="#C4786A" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="100" cy="550" r="30" fill="none" stroke="#E8E4DC" stroke-width="2"/>
  <circle cx="1100" cy="100" r="50" fill="none" stroke="#E8E4DC" stroke-width="2"/>
  <line x1="50" y1="50" x2="100" y2="100" stroke="#E8E4DC" stroke-width="1"/>
  <line x1="1150" y1="580" x2="1100" y2="530" stroke="#E8E4DC" stroke-width="1"/>

  <!-- Bottom info -->
  <text x="600" y="580" text-anchor="middle" font-family="Georgia" font-size="14" fill="#6B7B8C">
    AI工程实践专题 · 米仓
  </text>
</svg>
