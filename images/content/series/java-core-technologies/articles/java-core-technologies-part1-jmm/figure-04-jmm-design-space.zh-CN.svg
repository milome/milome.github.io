<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400">
  <title>JMM 设计约束空间</title>
  <desc>JMM 设计约束空间 static diagram for Java Memory Model Part 1.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="400" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1f2937">JMM 设计约束空间</text>

  <!-- Left axis label -->
  <text x="80" y="100" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#166534">顺序一致性</text>

  <!-- Right axis label -->
  <text x="620" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e40af">最大性能优化</text>

  <!-- Horizontal line -->
  <line x1="100" y1="120" x2="600" y2="120" stroke="#d1d5db" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Arrow heads -->
  <polygon points="95,120 105,115 105,125" fill="#166534"/>
  <polygon points="605,120 595,115 595,125" fill="#1e40af"/>

  <!-- Balance Box -->
  <rect x="200" y="160" width="300" height="150" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#6d28d9">JMM 平衡点</text>

  <!-- Bullet points -->
  <text x="220" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4c1d95">• 保证数据竞争自由程序的顺序一致性</text>
  <text x="220" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4c1d95">• 允许编译器和处理器的合理优化</text>
  <text x="220" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4c1d95">• 提供显式同步原语（volatile、</text>
  <text x="235" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#4c1d95">  synchronized）</text>

  <!-- Legend -->
  <rect x="150" y="340" width="400" height="40" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="350" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4b5563">JMM在顺序一致性和性能之间找到平衡点</text>
</svg>