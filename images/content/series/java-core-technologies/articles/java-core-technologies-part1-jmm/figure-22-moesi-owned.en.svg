<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <title>MOESI Owned-state optimization</title>
  <desc>MOESI Owned-state optimization static diagram for Java Memory Model Part 1.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">MOESI Owned-state optimization</text>

  <!-- Scenario -->
  <text x="400" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4b5563">Scenario: Core 0 modified x and Core 1 needs to read x</text>

  <!-- MESI Handling -->
  <rect x="50" y="80" width="340" height="280" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="220" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">MESI handling</text>

  <text x="70" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">1. Core 0(M) write back to memory</text>
  <text x="70" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">2. Core 0 becomes S</text>
  <text x="70" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">3. Core 1 reads from memory</text>

  <rect x="70" y="195" width="300" height="50" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="5"/>
  <text x="220" y="215" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#92400e">Problem: extra memory write and read</text>
  <text x="220" y="235" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#78350f">(writeback plus memory read)</text>

  <!-- MOESI Handling -->
  <rect x="410" y="80" width="340" height="280" fill="#dcfce7" stroke="#22c55e" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="580" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#166534">MOESI handling</text>

  <text x="430" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">1. Core 0 (M) forwards directly to Core 1</text>
  <text x="430" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">2. Core 0 becomes Owned</text>
  <text x="430" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">3. Core 1 becomes S</text>

  <rect x="430" y="195" width="300" height="50" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="5"/>
  <text x="580" y="215" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e40af">Optimization: avoid immediate writeback</text>
  <text x="580" y="235" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1d4ed8">(defer writeback until necessary)</text>

  <!-- O State description -->
  <rect x="200" y="290" width="400" height="90" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" rx="8" filter="url(#shadow)"/>
  <text x="400" y="315" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#374151">Owned state</text>
  <text x="400" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4b5563">data is modified but need not be written back immediately</text>
  <text x="400" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4b5563">can directly respond to read requests from other cores</text>
</svg>
