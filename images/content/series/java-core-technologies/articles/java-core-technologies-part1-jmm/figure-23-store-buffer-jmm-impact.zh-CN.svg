<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <title>Store Buffer对JMM的影响</title>
  <desc>Store Buffer对JMM的影响 static diagram for Java Memory Model Part 1.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">Store Buffer对JMM的影响</text>

  <!-- Core 0 -->
  <rect x="50" y="60" width="340" height="200" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="220" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">Core 0</text>

  <!-- Store Buffer -->
  <rect x="70" y="110" width="140" height="60" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="5"/>
  <text x="140" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#92400e">Store Buffer</text>
  <text x="140" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#78350f">(FIFO队列)</text>

  <!-- x = 1 -->
  <text x="230" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">x = 1;</text>
  <line x1="210" y1="145" x2="250" y2="145" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- flag = true -->
  <text x="230" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">flag = true;</text>
  <line x1="210" y1="180" x2="250" y2="180" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- L1 Cache -->
  <rect x="70" y="200" width="140" height="50" fill="#dcfce7" stroke="#22c55e" stroke-width="2" rx="5"/>
  <text x="140" y="225" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#166534">L1 Cache</text>
  <text x="140" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#15803d">(异步刷新)</text>

  <!-- Arrow from Store Buffer to L1 -->
  <line x1="140" y1="170" x2="140" y2="200" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>

  <!-- Bus -->
  <rect x="260" y="180" width="100" height="40" fill="#e0e7ff" stroke="#6366f1" stroke-width="1" rx="5"/>
  <text x="310" y="205" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4338ca">总线</text>

  <!-- Core 1 -->
  <rect x="450" y="60" width="300" height="150" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="600" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Core 1</text>

  <!-- L1 Cache Core 1 -->
  <rect x="480" y="110" width="100" height="80" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" rx="5"/>
  <text x="530" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#374151">L1 Cache</text>
  <text x="530" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">flag可能先到达</text>
  <text x="530" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#dc2626">x仍为旧值</text>

  <!-- Bus to Core 1 -->
  <line x1="360" y1="200" x2="480" y2="150" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Problem description -->
  <rect x="50" y="280" width="700" height="100" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="10" filter="url(#shadow)"/>
  <text x="400" y="305" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#92400e">问题与解决方案</text>

  <text x="70" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#78350f">问题：flag可能在x之前到达Core 1（Store Buffer异步刷新导致顺序问题）</text>
  <text x="70" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#78350f">解决：在flag=1之后插入StoreLoad屏障（x86: mfence/lock；ARM: dmb ish）</text>
</svg>
