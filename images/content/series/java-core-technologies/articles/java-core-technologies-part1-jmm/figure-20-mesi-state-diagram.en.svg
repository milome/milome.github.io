<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <title>MESI cache-coherence state transition diagram</title>
  <desc>MESI cache-coherence state transition diagram static diagram for Java Memory Model Part 1.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">MESI cache-coherence state transition diagram</text>

  <!-- I State (Invalid) -->
  <circle cx="400" cy="100" r="40" fill="#fee2e2" stroke="#dc2626" stroke-width="3" filter="url(#shadow)"/>
  <text x="400" y="95" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#991b1b">I</text>
  <text x="400" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">Invalid</text>

  <!-- M State (Modified) -->
  <circle cx="200" cy="250" r="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
  <text x="200" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#92400e">M</text>
  <text x="200" y="265" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">Modified</text>

  <!-- E State (Exclusive) -->
  <circle cx="400" cy="250" r="40" fill="#dcfce7" stroke="#22c55e" stroke-width="3" filter="url(#shadow)"/>
  <text x="400" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#166534">E</text>
  <text x="400" y="265" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">Exclusive</text>

  <!-- S State (Shared) -->
  <circle cx="600" cy="250" r="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="3" filter="url(#shadow)"/>
  <text x="600" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">S</text>
  <text x="600" y="265" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">Shared</text>

  <!-- Arrows -->
  <!-- I to M -->
  <path d="M 370 120 Q 300 150 230 210" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="300" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">local write</text>

  <!-- I to E -->
  <line x1="400" y1="140" x2="400" y2="210" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">local read (exclusive)</text>

  <!-- I to S -->
  <path d="M 430 120 Q 500 150 570 210" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="500" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">local read (shared)</text>

  <!-- M to I -->
  <path d="M 180 210 Q 350 150 380 100" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="280" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">other core write hit</text>

  <!-- M to E -->
  <path d="M 240 250 Q 320 250 360 250" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="300" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">write back to memory</text>

  <!-- E to I -->
  <path d="M 390 210 Q 395 150 395 140" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="410" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">other core write</text>

  <!-- E to S -->
  <path d="M 440 250 Q 520 250 560 250" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="500" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">other core read</text>

  <!-- S to I -->
  <path d="M 610 210 Q 500 150 420 120" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="520" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">other core write hit</text>

  <!-- S to E -->
  <path d="M 560 270 Q 480 290 440 270" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="500" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">invalidate other copies</text>

  <!-- Description box -->
  <rect x="50" y="330" width="700" height="150" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" rx="10" filter="url(#shadow)"/>
  <text x="400" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#374151">MESI state notes</text>

  <text x="70" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4b5563">• I (Invalid): cache line is invalid and must be reloaded</text>
  <text x="400" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4b5563">• M (Modified): cache line is dirty and differs from memory</text>
  <text x="70" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4b5563">• E (Exclusive): clean exclusive copy, cheap to modify</text>
  <text x="400" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4b5563">• S (Shared): clean copy shared by multiple cores</text>

  <text x="70" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">When Core 0 writes, it sends invalidations so other cores mark the line Invalid and Core 0 gains ownership.</text>
  <text x="70" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">After modification, other cores must fetch a valid line again.</text>
</svg>
