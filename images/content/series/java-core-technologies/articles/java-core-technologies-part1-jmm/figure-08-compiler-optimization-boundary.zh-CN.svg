<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <title>编译器优化边界</title>
  <desc>编译器优化边界 static diagram for Java Memory Model Part 1.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">编译器优化边界</text>

  <!-- Allowed Optimizations -->
  <rect x="50" y="60" width="340" height="170" fill="#dcfce7" stroke="#22c55e" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="220" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#166534">允许的重排序</text>

  <text x="70" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">• 无关的普通读写之间</text>
  <text x="70" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">• 同一个线程内的局部变量操作</text>
  <text x="70" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">• 循环优化、常量传播等</text>
  <text x="70" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">• 死代码消除</text>
  <text x="70" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">• 指令调度</text>

  <!-- Forbidden Optimizations -->
  <rect x="410" y="60" width="340" height="170" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="580" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">禁止的重排序</text>

  <text x="430" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">• 跨越同步操作的重排序</text>
  <text x="430" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">• volatile写之前的操作不能</text>
  <text x="445" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">重排到后面</text>
  <text x="430" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">• volatile读之后的操作不能</text>
  <text x="445" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">重排到前面</text>
  <text x="430" y="231" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">• final字段初始化不能重排</text>

  <!-- Java Version Timeline -->
  <rect x="50" y="260" width="700" height="160" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="10" filter="url(#shadow)"/>
  <text x="400" y="285" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">JMM对后续Java版本的影响</text>

  <!-- Timeline -->
  <line x1="100" y1="320" x2="700" y2="320" stroke="#6b7280" stroke-width="2"/>

  <!-- Java 5 -->
  <circle cx="150" cy="320" r="8" fill="#22c55e"/>
  <text x="150" y="345" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4b5563">Java 5 (2004)</text>
  <text x="150" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">JSR-133发布</text>
  <text x="150" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">新并发包</text>

  <!-- Java 6 -->
  <circle cx="300" cy="320" r="8" fill="#3b82f6"/>
  <text x="300" y="345" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4b5563">Java 6 (2006)</text>
  <text x="300" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">Fork/Join框架</text>
  <text x="300" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">并行流</text>

  <!-- Java 7 -->
  <circle cx="450" cy="320" r="8" fill="#8b5cf6"/>
  <text x="450" y="345" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4b5563">Java 7 (2011)</text>
  <text x="450" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">Fork/Join增强</text>
  <text x="450" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">CompletableFuture</text>

  <!-- Java 9 -->
  <circle cx="600" cy="320" r="8" fill="#f59e0b"/>
  <text x="600" y="345" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4b5563">Java 9 (2017)</text>
  <text x="600" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">JEP 188</text>
  <text x="600" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">VarHandle</text>

  <text x="400" y="400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">所有JVM实现 (HotSpot, OpenJ9, Zing, GraalVM) 必须遵循相同内存模型</text>
</svg>
