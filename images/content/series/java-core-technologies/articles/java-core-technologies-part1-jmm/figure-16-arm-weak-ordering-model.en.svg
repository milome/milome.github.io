<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340">
  <title>ARM weak memory ordering model</title>
  <desc>ARM weak memory ordering model static diagram for Java Memory Model Part 1.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="340" fill="#f8f6f3"/>

  <!-- Main Box -->
  <rect x="50" y="20" width="600" height="300" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2" filter="url(#shadow)"/>

  <!-- Title -->
  <rect x="50" y="20" width="600" height="45" rx="8" fill="#fce7f3" stroke="#374151" stroke-width="2"/>
  <text x="350" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#be185d">ARM weak memory ordering model</text>

  <!-- Content -->
  <text x="350" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4b5563">Load → Load:</text>
  <text x="480" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#dc2626" font-weight="600">reordering allowed</text>

  <text x="350" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4b5563">Load → Store:</text>
  <text x="480" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#dc2626" font-weight="600">reordering allowed</text>

  <text x="350" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4b5563">Store → Store:</text>
  <text x="480" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#dc2626" font-weight="600">reordering allowed</text>

  <text x="350" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4b5563">Store → Load:</text>
  <text x="480" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#dc2626" font-weight="600">reordering allowed</text>

  <!-- Warning box -->
  <rect x="150" y="220" width="400" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="350" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#92400e" font-weight="600">explicit barriers are needed to guarantee order</text>
  <text x="350" y="275" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#b45309">Weak Ordering Model</text>
</svg>
