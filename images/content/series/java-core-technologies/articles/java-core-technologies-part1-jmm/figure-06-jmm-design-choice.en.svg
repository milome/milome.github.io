<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <title>Memory model design choice</title>
  <desc>Memory model design choice static diagram for Java Memory Model Part 1.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#1f2937">Memory model design choice</text>

  <!-- Sequential Consistency Box (Left) -->
  <rect x="40" y="70" width="340" height="320" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="210" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#991b1b">Sequential consistency (Sequential Consistency)</text>

  <!-- SC Pros -->
  <text x="60" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#166534">Pros:</text>
  <text x="60" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• Simple and intuitive</text>
  <text x="60" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• Easy to understand</text>
  <text x="60" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• Simple formal model</text>

  <!-- SC Cons -->
  <text x="60" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">Cons:</text>
  <text x="60" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• High performance cost</text>
  <text x="60" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• Restricts optimization</text>
  <text x="60" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• Hard to fit existing code</text>

  <!-- VS Circle -->
  <circle cx="400" cy="230" r="35" fill="#f59e0b" filter="url(#shadow)"/>
  <text x="400" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">vs</text>

  <!-- Happens-Before Box (Right) -->
  <rect x="420" y="70" width="340" height="320" fill="#dcfce7" stroke="#22c55e" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="590" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#166534">happens-before model</text>

  <!-- HB Pros -->
  <text x="440" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#166534">Pros:</text>
  <text x="440" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• Better performance</text>
  <text x="440" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• Compatible with existing code</text>
  <text x="440" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• Platform-independent</text>

  <!-- HB Cons -->
  <text x="440" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">Cons:</text>
  <text x="440" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• More complex</text>
  <text x="440" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• Requires explicit synchronization</text>

  <!-- Decision -->
  <rect x="150" y="410" width="500" height="70" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="400" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">JSR-133 decision: use happens-before model</text>
  <text x="400" y="465" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1d4ed8">Balances performance and usability</text>
</svg>
