<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <title>Cache coherence visibility problem</title>
  <desc>Cache coherence visibility problem static diagram for Java Memory Model Part 1.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">Cache coherence visibility problem</text>

  <!-- Core 0 -->
  <rect x="50" y="60" width="300" height="150" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="200" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">Core 0</text>

  <rect x="70" y="110" width="120" height="80" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" rx="5"/>
  <text x="130" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#374151">L1 Cache</text>
  <text x="130" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#22c55e" font-weight="bold">x = 1</text>
  <text x="130" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">(modified)</text>

  <text x="220" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">write(x, 1)</text>

  <!-- Core 1 -->
  <rect x="450" y="60" width="300" height="150" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="600" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Core 1</text>

  <rect x="470" y="110" width="120" height="80" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" rx="5"/>
  <text x="530" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#374151">L1 Cache</text>
  <text x="530" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#dc2626" font-weight="bold">x = 0?</text>
  <text x="530" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">(stale data)</text>

  <text x="620" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">read(x)</text>

  <!-- Problem description -->
  <rect x="50" y="230" width="700" height="150" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="10" filter="url(#shadow)"/>
  <text x="400" y="260" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#92400e">Problem analysis</text>

  <text x="70" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#78350f">1. Core 0 writes x = 1, but the change is still local to its L1 cache</text>
  <text x="70" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#78350f">2. Coherence protocols such as MESI need time to propagate the change</text>
  <text x="70" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#78350f">3. Core 1 may read old x = 0 before its cache line is invalidated</text>
  <text x="70" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#78350f" font-weight="bold">4. This is a visibility problem: Core 1 cannot yet see Core 0's write</text>
</svg>
