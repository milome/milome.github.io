<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <title>Modern CPU cache hierarchy</title>
  <desc>Modern CPU cache hierarchy static diagram for Java Memory Model Part 1.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1f2937">Modern CPU cache hierarchy</text>

  <!-- CPU Core 0 -->
  <rect x="50" y="60" width="340" height="140" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1e40af">CPU Core 0</text>

  <!-- Register -->
  <rect x="70" y="100" width="90" height="80" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="115" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1e40af">Register</text>
  <text x="115" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#3b82f6">64B</text>

  <!-- L1 Cache -->
  <rect x="175" y="100" width="90" height="80" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="220" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1e40af">L1 Cache</text>
  <text x="220" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#3b82f6">32KB</text>

  <!-- L2 Cache -->
  <rect x="280" y="100" width="90" height="80" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="325" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1e40af">L2 Cache</text>
  <text x="325" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#3b82f6">256KB</text>

  <!-- Arrows in Core -->
  <line x1="160" y1="140" x2="170" y2="140" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="265" y1="140" x2="275" y2="140" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow to L3 -->
  <line x1="220" y1="200" x2="220" y2="240" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">4 cycles</text>

  <!-- CPU Core 1 (implied, similar structure) -->
  <rect x="410" y="60" width="340" height="140" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="580" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#92400e">CPU Core 1</text>

  <!-- Register -->
  <rect x="430" y="100" width="90" height="80" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <text x="475" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#92400e">Register</text>
  <text x="475" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#f59e0b">64B</text>

  <!-- L1 Cache -->
  <rect x="535" y="100" width="90" height="80" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <text x="580" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#92400e">L1 Cache</text>
  <text x="580" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#f59e0b">32KB</text>

  <!-- L2 Cache -->
  <rect x="640" y="100" width="90" height="80" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <text x="685" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#92400e">L2 Cache</text>
  <text x="685" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#f59e0b">256KB</text>

  <!-- Arrows in Core -->
  <line x1="520" y1="140" x2="530" y2="140" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="625" y1="140" x2="635" y2="140" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow to L3 -->
  <line x1="580" y1="200" x2="580" y2="240" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="595" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">4 cycles</text>

  <!-- L3 Cache -->
  <rect x="200" y="250" width="400" height="80" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="285" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#166534">L3 Cache</text>
  <text x="400" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#166534">16MB (shared by cores)</text>

  <!-- Arrow to Memory -->
  <line x1="400" y1="330" x2="400" y2="370" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="415" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">40 cycles</text>

  <!-- Main Memory -->
  <rect x="150" y="380" width="500" height="80" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="415" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#9d174d">Main Memory</text>
  <text x="400" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#9d174d">64GB（DRAM，200+ cycles）</text>

  <!-- Legend -->
  <rect x="50" y="470" width="700" height="20" fill="none"/>
  <text x="400" y="485" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">Latency rises: Register(1) -> L1(4) -> L2(12) -> L3(40) -> Memory(200+ cycles)</text>
</svg>