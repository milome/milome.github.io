<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <title>synchronized as a happens-before bridge</title>
  <desc>synchronized as a happens-before bridge static diagram for Java Memory Model Part 1.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">synchronized as a happens-before bridge</text>

  <!-- Thread A -->
  <rect x="50" y="70" width="700" height="90" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="80" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">Thread A:</text>

  <rect x="120" y="105" width="100" height="45" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="5"/>
  <text x="170" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#92400e">write(a, 1)</text>
  <text x="170" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#78350f">(1)</text>

  <rect x="250" y="105" width="120" height="45" fill="#dcfce7" stroke="#22c55e" stroke-width="2" rx="5"/>
  <text x="310" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#166534">synchronized(m)</text>
  <text x="310" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#15803d">(2) exit</text>

  <rect x="400" y="105" width="100" height="45" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="5"/>
  <text x="450" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#92400e">write(b, 2)</text>
  <text x="450" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#78350f">(3)</text>

  <!-- Arrows in Thread A -->
  <line x1="220" y1="127" x2="250" y2="127" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="370" y1="127" x2="400" y2="127" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Thread B -->
  <rect x="50" y="190" width="700" height="90" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="80" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">Thread B:</text>

  <rect x="120" y="230" width="100" height="45" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="5"/>
  <text x="170" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#92400e">read(b)</text>
  <text x="170" y="265" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#78350f">(4)</text>

  <rect x="250" y="230" width="120" height="45" fill="#dcfce7" stroke="#22c55e" stroke-width="2" rx="5"/>
  <text x="310" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#166534">synchronized(m)</text>
  <text x="310" y="265" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#15803d">(5) enter</text>

  <rect x="400" y="230" width="100" height="45" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="5"/>
  <text x="450" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#92400e">read(a)</text>
  <text x="450" y="265" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#78350f">(6)</text>

  <!-- Arrows in Thread B -->
  <line x1="220" y1="252" x2="250" y2="252" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="370" y1="252" x2="400" y2="252" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- sync bridge arrow -->
  <line x1="310" y1="150" x2="310" y2="230" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="350" y="195" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7c3aed" font-weight="bold">monitor lock rule</text>
  <text x="350" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#8b5cf6">(2) to (5) establishes an hb edge</text>

  <!-- Explanation -->
  <rect x="50" y="300" width="700" height="85" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" rx="8" filter="url(#shadow)"/>
  <text x="400" y="325" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#374151">Derivation</text>

  <text x="70" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4b5563">(1) to (2): program order | (2) to (5): monitor rule | (5) to (6): program order</text>
  <text x="70" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937" font-weight="bold">Transitivity guarantees (1) to (6); this lock does not order (3) and (4)</text>
</svg>
