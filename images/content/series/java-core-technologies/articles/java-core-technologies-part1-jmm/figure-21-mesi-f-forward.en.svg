<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <title>MESIF (Modified-Exclusive-Shared-Invalid-Forward) optimization</title>
  <desc>MESIF (Modified-Exclusive-Shared-Invalid-Forward) optimization static diagram for Java Memory Model Part 1.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">MESIF (Modified-Exclusive-Shared-Invalid-Forward) optimization</text>

  <!-- MESI Problem -->
  <text x="200" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">MESI issue</text>

  <!-- Core boxes -->
  <rect x="50" y="90" width="150" height="80" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="5" filter="url(#shadow)"/>
  <text x="125" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">Core 0</text>
  <text x="125" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">M state</text>
  <text x="125" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">(modified)</text>

  <rect x="220" y="90" width="150" height="80" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="5" filter="url(#shadow)"/>
  <text x="295" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Core 1</text>
  <text x="295" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">S state</text>
  <text x="295" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">(shared)</text>

  <rect x="390" y="90" width="150" height="80" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="5" filter="url(#shadow)"/>
  <text x="465" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Core 2</text>
  <text x="465" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">S state</text>
  <text x="465" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">(shared)</text>

  <rect x="560" y="90" width="150" height="80" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="5" filter="url(#shadow)"/>
  <text x="635" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#92400e">Core 3</text>
  <text x="635" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">read request</text>
  <text x="635" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">(Read Request)</text>

  <!-- Arrows showing problem -->
  <line x1="200" y1="130" x2="560" y2="130" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="295" y1="130" x2="560" y2="130" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="465" y1="130" x2="560" y2="130" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,5"/>

  <text x="380" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#dc2626">multiple responders can create bus contention</text>

  <!-- MESIF Solution -->
  <text x="200" y="220" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#166534">MESIF solution</text>

  <rect x="50" y="240" width="150" height="80" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="5" filter="url(#shadow)"/>
  <text x="125" y="265" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">Core 0</text>
  <text x="125" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">M state</text>
  <text x="125" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">(modified)</text>

  <rect x="220" y="240" width="150" height="80" fill="#dcfce7" stroke="#22c55e" stroke-width="3" rx="5" filter="url(#shadow)"/>
  <text x="295" y="265" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#166534">Core 1</text>
  <text x="295" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">F state</text>
  <text x="295" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#166534" font-weight="bold">(Forward)</text>

  <rect x="390" y="240" width="150" height="80" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="5" filter="url(#shadow)"/>
  <text x="465" y="265" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">Core 2</text>
  <text x="465" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">S state</text>
  <text x="465" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">(shared)</text>

  <rect x="560" y="240" width="150" height="80" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="5" filter="url(#shadow)"/>
  <text x="635" y="265" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#92400e">Core 3</text>
  <text x="635" y="290" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">read request</text>
  <text x="635" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">(Read Request)</text>

  <!-- Arrow from F to requester -->
  <line x1="370" y1="280" x2="560" y2="280" stroke="#22c55e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="465" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#22c55e" font-weight="bold">designated responder</text>

  <text x="380" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#166534">only the F-state core responds, reducing bus traffic</text>
</svg>
