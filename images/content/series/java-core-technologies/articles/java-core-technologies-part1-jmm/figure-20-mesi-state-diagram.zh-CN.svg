<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <title>MESI缓存一致性协议状态转换图</title>
  <desc>MESI缓存一致性协议状态转换图 static diagram for Java Memory Model Part 1.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">MESI缓存一致性协议状态转换图</text>

  <!-- I State (Invalid) -->
  <circle cx="400" cy="100" r="40" fill="#fee2e2" stroke="#dc2626" stroke-width="3" filter="url(#shadow)"/>
  <text x="400" y="95" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#991b1b">I</text>
  <text x="400" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">Invalid</text>

  <!-- M State (Modified) -->
  <circle cx="200" cy="250" r="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
  <text x="200" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#92400e">M</text>
  <text x="200" y="265" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">Modified</text>

  <!-- E State (Exclusive) -->
  <circle cx="400" cy="250" r="40" fill="#dcfce7" stroke="#22c55e" stroke-width="3" filter="url(#shadow)"/>
  <text x="400" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#166534">E</text>
  <text x="400" y="265" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">Exclusive</text>

  <!-- S State (Shared) -->
  <circle cx="600" cy="250" r="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="3" filter="url(#shadow)"/>
  <text x="600" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">S</text>
  <text x="600" y="265" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">Shared</text>

  <!-- Arrows -->
  <!-- I to M -->
  <path d="M 370 120 Q 300 150 230 210" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="300" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">本地写</text>

  <!-- I to E -->
  <line x1="400" y1="140" x2="400" y2="210" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">本地读(独占)</text>

  <!-- I to S -->
  <path d="M 430 120 Q 500 150 570 210" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="500" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">本地读(共享)</text>

  <!-- M to I -->
  <path d="M 180 210 Q 350 150 380 100" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="280" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">其他核写命中</text>

  <!-- M to E -->
  <path d="M 240 250 Q 320 250 360 250" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="300" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">写回内存</text>

  <!-- E to I -->
  <path d="M 390 210 Q 395 150 395 140" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="410" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">其他核写</text>

  <!-- E to S -->
  <path d="M 440 250 Q 520 250 560 250" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="500" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">其他核读</text>

  <!-- S to I -->
  <path d="M 610 210 Q 500 150 420 120" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="520" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">其他核写命中</text>

  <!-- S to E -->
  <path d="M 560 270 Q 480 290 440 270" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="500" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">无效化其他副本</text>

  <!-- Description box -->
  <rect x="50" y="330" width="700" height="150" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" rx="10" filter="url(#shadow)"/>
  <text x="400" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#374151">MESI状态说明</text>

  <text x="70" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4b5563">• I (Invalid): 缓存行无效，需要重新从内存加载</text>
  <text x="400" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4b5563">• M (Modified): 缓存行已被修改，与主内存不一致</text>
  <text x="70" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4b5563">• E (Exclusive): 缓存行独占，与主内存一致，可安全修改</text>
  <text x="400" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4b5563">• S (Shared): 缓存行被多个核心共享，与主内存一致</text>

  <text x="70" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">当Core 0修改数据时，发送Invalidate消息给其他核心，其他核心将对应缓存行标记为Invalid，Core 0获得独占访问权。</text>
  <text x="70" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">修改后，其他核心需要重新从主内存加载该缓存行。</text>
</svg>
