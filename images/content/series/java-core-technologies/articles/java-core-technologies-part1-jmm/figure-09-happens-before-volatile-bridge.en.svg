<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <title>volatile as a happens-before bridge</title>
  <desc>volatile as a happens-before bridge static diagram for Java Memory Model Part 1.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">volatile as a happens-before bridge</text>

  <!-- Thread A -->
  <rect x="50" y="70" width="300" height="120" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="200" y="95" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">Thread A</text>

  <rect x="70" y="110" width="120" height="60" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="5"/>
  <text x="130" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#92400e">write(x, 1)</text>
  <text x="130" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#78350f">(1) ordinary write</text>

  <rect x="210" y="110" width="120" height="60" fill="#dcfce7" stroke="#22c55e" stroke-width="2" rx="5"/>
  <text x="270" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#166534">write(v, 1)</text>
  <text x="270" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#15803d">(2) volatile write</text>

  <!-- Arrow A -->
  <line x1="130" y1="140" x2="210" y2="140" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">program order</text>

  <!-- Thread B -->
  <rect x="450" y="70" width="300" height="120" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="600" y="95" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Thread B</text>

  <rect x="470" y="110" width="120" height="60" fill="#dcfce7" stroke="#22c55e" stroke-width="2" rx="5"/>
  <text x="530" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#166534">read(v)</text>
  <text x="530" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#15803d">(3) volatile read</text>

  <rect x="610" y="110" width="120" height="60" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="5"/>
  <text x="670" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#92400e">read(x)</text>
  <text x="670" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#78350f">(4) ordinary read</text>

  <!-- Arrow B -->
  <line x1="590" y1="140" x2="610" y2="140" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">program order</text>

  <!-- volatile bridge arrow -->
  <path d="M 330 140 Q 400 80 470 140" stroke="#22c55e" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#15803d" font-weight="bold">volatile rule</text>
  <text x="400" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#22c55e">(2) and (3) establish an hb edge</text>

  <!-- Derivation box -->
  <rect x="50" y="220" width="700" height="150" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" rx="10" filter="url(#shadow)"/>
  <text x="400" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#374151">happens-before derivation</text>

  <text x="70" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">1. (1) to (2): program-order rule in Thread A</text>
  <text x="70" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">2. (2) to (3): volatile write happens-before volatile read of v</text>
  <text x="70" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">3. (3) to (4): program-order rule in Thread B</text>
  <text x="70" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937" font-weight="bold">4. By transitivity, (1) hb (4); Thread B is guaranteed to see x = 1</text>
</svg>
