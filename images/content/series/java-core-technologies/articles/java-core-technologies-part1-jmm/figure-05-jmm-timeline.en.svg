<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <title>JMM evolution timeline (1995-2017)</title>
  <desc>JMM evolution timeline (1995-2017) static diagram for Java Memory Model Part 1.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="380" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1f2937">JMM evolution timeline (1995-2017)</text>

  <!-- Timeline Axis -->
  <line x1="80" y1="70" x2="720" y2="70" stroke="#374151" stroke-width="3"/>
  <polygon points="725,70 715,65 715,75" fill="#374151"/>
  <text x="740" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6b7280">→</text>

  <!-- 1995 Label -->
  <text x="80" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">1995</text>

  <!-- Era 1: JDK 1.0 (1996) -->
  <circle cx="130" cy="70" r="6" fill="#3b82f6"/>
  <line x1="130" y1="76" x2="130" y2="110" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="70" y="115" width="120" height="70" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e40af">JDK 1.0</text>
  <text x="130" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#3b82f6">1996</text>
  <text x="130" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">Original JMM</text>

  <!-- Era 2: JDK 1.2 (1998) -->
  <circle cx="250" cy="70" r="6" fill="#3b82f6"/>
  <line x1="250" y1="76" x2="250" y2="110" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="190" y="115" width="120" height="70" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e40af">JDK 1.2</text>
  <text x="250" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#3b82f6">1998</text>
  <text x="250" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">Original JMM</text>

  <!-- Era 3: JDK 1.4 (2002) -->
  <circle cx="370" cy="70" r="6" fill="#3b82f6"/>
  <line x1="370" y1="76" x2="370" y2="110" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="310" y="115" width="120" height="70" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e40af">JDK 1.4</text>
  <text x="370" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#3b82f6">2002</text>
  <text x="370" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">Original JMM</text>

  <!-- Era 4: JDK 5 (2004) - JSR-133 -->
  <circle cx="490" cy="70" r="8" fill="#dc2626"/>
  <line x1="490" y1="78" x2="490" y2="110" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="430" y="115" width="120" height="90" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#991b1b">JDK 5</text>
  <text x="490" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#dc2626">2004 (JSR-133)</text>
  <text x="490" y="178" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">New JMM</text>
  <text x="490" y="195" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#991b1b">Fixed DCL/volatile semantics</text>

  <!-- Era 5: JDK 9 (2017) - JEP 188 -->
  <circle cx="610" cy="70" r="8" fill="#16a34a"/>
  <line x1="610" y1="78" x2="610" y2="110" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="550" y="115" width="120" height="90" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="610" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#166534">JDK 9</text>
  <text x="610" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#16a34a">2017 (JEP 188)</text>
  <text x="610" y="178" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">Enhanced access modes</text>
  <text x="610" y="195" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#166534">Explicit memory fences</text>

  <!-- Milestone box -->
  <rect x="150" y="230" width="500" height="120" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="400" y="255" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#374151">Key milestones</text>

  <text x="170" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4b5563">JSR-133 (2004):</text>
  <text x="170" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">• Fixed double-checked locking (DCL)</text>
  <text x="170" y="313" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">• Established volatile happens-before semantics</text>
  <text x="170" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">• Introduced java.util.concurrent</text>

  <text x="420" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4b5563">JEP 188 (2017):</text>
  <text x="420" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">• Explicit memory fences (VarHandle)</text>
  <text x="420" y="313" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">• Strengthened final-field reasoning</text>
  <text x="420" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">• Expanded field access semantics</text>
</svg>
