<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320">
  <title>x86 TSO memory model</title>
  <desc>x86 TSO memory model static diagram for Java Memory Model Part 1.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="320" fill="#f8f6f3"/>

  <!-- Main Box -->
  <rect x="50" y="20" width="600" height="280" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2" filter="url(#shadow)"/>

  <!-- Title -->
  <rect x="50" y="20" width="600" height="45" rx="8" fill="#dbeafe" stroke="#374151" stroke-width="2"/>
  <text x="350" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1e40af">x86 TSO memory model</text>

  <!-- Content -->
  <text x="350" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4b5563">Load → Load:</text>
  <text x="480" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#16a34a" font-weight="600">reordering forbidden</text>

  <text x="350" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4b5563">Load → Store:</text>
  <text x="480" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#16a34a" font-weight="600">reordering forbidden</text>

  <text x="350" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4b5563">Store → Store:</text>
  <text x="480" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#16a34a" font-weight="600">reordering forbidden</text>

  <text x="350" y="195" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#4b5563">Store → Load:</text>
  <text x="480" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#dc2626" font-weight="600">reordering allowed</text>
  <text x="560" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6b7280"><- only common reorder case</text>

  <!-- Highlight box for Store → Load -->
  <rect x="120" y="180" width="460" height="28" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>

  <!-- Bottom note -->
  <text x="350" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280">TSO (Total Store Order)</text>
  <text x="350" y="275" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9ca3af">x86/x64 provides relatively strong memory ordering</text>
</svg>
