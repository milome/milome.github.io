<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520">
  <title>DAG representation of happens-before</title>
  <desc>DAG representation of happens-before static diagram for Java Memory Model Part 1.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="sync-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="520" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1f2937">DAG representation of happens-before</text>

  <!-- Thread.start Node -->
  <rect x="300" y="60" width="100" height="45" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1e40af">Thread.start</text>
  <text x="350" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#3b82f6">T</text>

  <!-- Thread A nodes -->
  <rect x="100" y="140" width="90" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <text x="145" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#92400e">A1</text>

  <rect x="100" y="210" width="90" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <text x="145" y="235" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#92400e">A2</text>

  <!-- Thread B nodes -->
  <rect x="510" y="140" width="90" height="40" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1" filter="url(#shadow)"/>
  <text x="555" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#166534">B1</text>

  <rect x="510" y="210" width="90" height="40" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1" filter="url(#shadow)"/>
  <text x="555" y="235" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#166534">B2</text>

  <!-- Volatile node -->
  <rect x="300" y="280" width="100" height="45" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="350" y="302" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#991b1b">V = 1</text>
  <text x="350" y="318" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#dc2626">volatile variable</text>

  <!-- Arrows: T -> A -->
  <path d="M 320 105 Q 230 120 145 140" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="200" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">start</text>

  <!-- Arrows: T -> B -->
  <path d="M 380 105 Q 470 120 555 140" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="470" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">start</text>

  <!-- Arrows: A1 -> A2 (Program Order) -->
  <line x1="145" y1="180" x2="145" y2="210" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="155" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">PO</text>

  <!-- Arrows: A2 -> V (volatile write) -->
  <path d="M 190 250 Q 240 280 300 302" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#sync-arrow)"/>
  <text x="230" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#16a34a">volatile write</text>

  <!-- Arrows: V -> B1 (volatile read) -->
  <path d="M 400 302 Q 480 270 510 170" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#sync-arrow)"/>
  <text x="470" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#16a34a">volatile read</text>

  <!-- Arrows: B1 -> B2 (Program Order) -->
  <line x1="555" y1="180" x2="555" y2="210" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="565" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">PO</text>

  <!-- Thread labels -->
  <text x="40" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#d97706">Thread A:</text>
  <text x="40" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#16a34a">Thread B:</text>

  <!-- Legend -->
  <rect x="100" y="360" width="500" height="130" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="350" y="385" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#374151">DAG structure notes</text>

  <text x="120" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4b5563">• nodes: program actions such as memory and sync actions</text>
  <text x="120" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4b5563">• edges: happens-before relation, directed and acyclic</text>
  <text x="120" y="446" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4b5563">• Thread.start -> A1/B1: start happens-before first actions</text>
  <text x="120" y="464" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4b5563">• A2 -> V: volatile write happens-before later volatile read</text>

  <line x1="380" y1="410" x2="420" y2="410" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="430" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">program order (PO)</text>

  <line x1="380" y1="432" x2="420" y2="432" stroke="#16a34a" stroke-width="2" marker-end="url(#sync-arrow)"/>
  <text x="430" y="437" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#16a34a">synchronization relation (volatile)</text>
</svg>
