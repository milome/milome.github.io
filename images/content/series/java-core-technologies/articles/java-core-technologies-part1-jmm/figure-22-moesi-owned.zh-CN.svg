<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <title>MOESI Owned状态优化</title>
  <desc>MOESI Owned状态优化 static diagram for Java Memory Model Part 1.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">MOESI Owned状态优化</text>

  <!-- Scenario -->
  <text x="400" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#4b5563">场景：Core 0修改了x，Core 1需要读取x</text>

  <!-- MESI Handling -->
  <rect x="50" y="80" width="340" height="280" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="220" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">MESI的处理</text>

  <text x="70" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">1. Core 0(M) 写回内存</text>
  <text x="70" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">2. Core 0状态变为S</text>
  <text x="70" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">3. Core 1从内存读取</text>

  <rect x="70" y="195" width="300" height="50" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="5"/>
  <text x="220" y="215" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#92400e">问题：额外的内存写和读</text>
  <text x="220" y="235" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#78350f">(写回内存 + 从内存读取)</text>

  <!-- MOESI Handling -->
  <rect x="410" y="80" width="340" height="280" fill="#dcfce7" stroke="#22c55e" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="580" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#166534">MOESI的处理</text>

  <text x="430" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">1. Core 0(M) 直接转发给Core 1</text>
  <text x="430" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">2. Core 0状态变为 Owned</text>
  <text x="430" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">3. Core 1状态变为S</text>

  <rect x="430" y="195" width="300" height="50" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="5"/>
  <text x="580" y="215" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e40af">优化：避免立即写回内存</text>
  <text x="580" y="235" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1d4ed8">(延迟写回，直到必要)</text>

  <!-- O State description -->
  <rect x="200" y="290" width="400" height="90" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" rx="8" filter="url(#shadow)"/>
  <text x="400" y="315" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#374151">Owned 状态</text>
  <text x="400" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4b5563">数据已被修改，但不需要立即写回内存</text>
  <text x="400" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4b5563">可以直接响应其他核心的读取请求</text>
</svg>
