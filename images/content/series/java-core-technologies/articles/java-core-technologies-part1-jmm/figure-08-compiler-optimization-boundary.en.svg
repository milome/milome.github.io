<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <title>Compiler optimization boundary</title>
  <desc>Compiler optimization boundary static diagram for Java Memory Model Part 1.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">Compiler optimization boundary</text>

  <!-- Allowed Optimizations -->
  <rect x="50" y="60" width="340" height="170" fill="#dcfce7" stroke="#22c55e" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="220" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#166534">Allowed reordering</text>

  <text x="70" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">• unrelated ordinary reads/writes</text>
  <text x="70" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">• local operations within one thread</text>
  <text x="70" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">• loop optimization and constant propagation</text>
  <text x="70" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">• dead-code elimination</text>
  <text x="70" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">• instruction scheduling</text>

  <!-- Forbidden Optimizations -->
  <rect x="410" y="60" width="340" height="170" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="580" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Forbidden reordering</text>

  <text x="430" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">• across synchronization operations</text>
  <text x="430" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">• operations before volatile write must not</text>
  <text x="445" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">move after it</text>
  <text x="430" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">• operations after volatile read must not</text>
  <text x="445" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">move before it</text>
  <text x="430" y="231" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1f2937">• final-field initialization must not move</text>

  <!-- Java Version Timeline -->
  <rect x="50" y="260" width="700" height="160" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="10" filter="url(#shadow)"/>
  <text x="400" y="285" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">JMM impact on later Java versions</text>

  <!-- Timeline -->
  <line x1="100" y1="320" x2="700" y2="320" stroke="#6b7280" stroke-width="2"/>

  <!-- Java 5 -->
  <circle cx="150" cy="320" r="8" fill="#22c55e"/>
  <text x="150" y="345" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4b5563">Java 5 (2004)</text>
  <text x="150" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">JSR-133 released</text>
  <text x="150" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">new concurrency package</text>

  <!-- Java 6 -->
  <circle cx="300" cy="320" r="8" fill="#3b82f6"/>
  <text x="300" y="345" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4b5563">Java 6 (2006)</text>
  <text x="300" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">Fork/Join framework</text>
  <text x="300" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">parallel streams</text>

  <!-- Java 7 -->
  <circle cx="450" cy="320" r="8" fill="#8b5cf6"/>
  <text x="450" y="345" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4b5563">Java 7 (2011)</text>
  <text x="450" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">Fork/Join improvements</text>
  <text x="450" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">CompletableFuture</text>

  <!-- Java 9 -->
  <circle cx="600" cy="320" r="8" fill="#f59e0b"/>
  <text x="600" y="345" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4b5563">Java 9 (2017)</text>
  <text x="600" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">JEP 188</text>
  <text x="600" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">VarHandle</text>

  <text x="400" y="400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">All JVM implementations (HotSpot, OpenJ9, Zing, GraalVM) must obey the same memory model</text>
</svg>
