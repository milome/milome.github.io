<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>happens-before 关系的 Hasse 图示例</title>
  <desc>happens-before 关系的 Hasse 图示例 static diagram for Java Memory Model Part 1.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="hb-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="sync-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1f2937">happens-before 关系的 Hasse 图示例</text>

  <!-- Thread A Section -->
  <rect x="50" y="60" width="200" height="200" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e40af">Thread A</text>

  <!-- Thread A nodes -->
  <rect x="80" y="105" width="60" height="35" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="110" y="127" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e40af">A1</text>

  <rect x="80" y="155" width="60" height="35" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="110" y="177" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1e40af">A2</text>

  <rect x="160" y="155" width="60" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="190" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#92400e">V=1</text>
  <text x="190" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#d97706">volatile写</text>

  <!-- Thread A arrows -->
  <line x1="110" y1="140" x2="110" y2="155" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="140" y1="172" x2="160" y2="172" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="125" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">PO</text>

  <!-- Thread B Section -->
  <rect x="550" y="60" width="200" height="200" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#166534">Thread B</text>

  <!-- Thread B nodes -->
  <rect x="580" y="155" width="60" height="35" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="610" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#92400e">V=?</text>
  <text x="610" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#d97706">volatile读</text>

  <rect x="660" y="105" width="60" height="35" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="690" y="127" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#166534">B1</text>

  <rect x="660" y="155" width="60" height="35" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="690" y="177" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#166534">B2</text>

  <!-- Thread B arrows -->
  <line x1="640" y1="172" x2="660" y2="122" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="690" y1="140" x2="690" y2="155" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="665" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">PO</text>

  <!-- Thread C Section -->
  <rect x="300" y="280" width="200" height="140" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="305" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#92400e">Thread C</text>

  <!-- Thread C nodes -->
  <rect x="320" y="330" width="50" height="30" rx="4" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <text x="345" y="349" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#92400e">C1</text>

  <rect x="390" y="330" width="50" height="30" rx="4" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <text x="415" y="349" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#92400e">C2</text>

  <rect x="460" y="330" width="50" height="30" rx="4" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <text x="485" y="349" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#92400e">C3</text>

  <!-- Thread C arrows -->
  <line x1="370" y1="345" x2="390" y2="345" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="440" y1="345" x2="460" y2="345" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Cross-thread happens-before (volatile) -->
  <path d="M 220 172 Q 400 172 580 172" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#hb-arrow)" stroke-dasharray="5,3"/>
  <text x="400" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#dc2626" font-weight="600">hb (volatile)</text>

  <!-- Cross-thread happens-before (transitivity) -->
  <path d="M 110 210 Q 110 280 320 345" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="5,3"/>
  <text x="180" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#7c3aed">hb (传递性)</text>

  <!-- Legend -->
  <rect x="50" y="450" width="700" height="120" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="400" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#374151">happens-before 关系说明</text>

  <!-- Legend items -->
  <line x1="80" y1="495" x2="110" y2="495" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="120" y="500" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4b5563">PO: 程序顺序 (同一线程内)</text>

  <line x1="80" y1="515" x2="110" y2="515" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#hb-arrow)"/>
  <text x="120" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4b5563">hb: happens-before (跨线程)</text>

  <text x="80" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4b5563">• A1 →hb A2 →hb V=1 (程序顺序)</text>
  <text x="80" y="555" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4b5563">• V=1 →hb V=? (volatile规则)</text>
</svg>
