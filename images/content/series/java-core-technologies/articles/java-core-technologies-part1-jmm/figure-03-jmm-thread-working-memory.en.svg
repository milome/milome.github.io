<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="title desc">
  <title id="title">JMM abstraction of thread working memory and main memory</title>
  <desc id="desc">Shows how two Java threads interact with shared objects through working memory, local caches, registers, and store buffers, explaining visibility, races, and synchronization boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#334155" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="900" height="520" rx="24" fill="url(#bg)"/>
  <text x="450" y="38" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#111827">JMM thread view: working memory is an access path, not an object copy</text>
  <text x="450" y="66" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#64748b">A thread may observe local shared-variable state through registers, CPU caches, or store buffers; JMM uses synchronization actions to establish cross-thread visibility.</text>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" filter="url(#shadow)">
    <rect x="58" y="104" width="292" height="250" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="204" y="134" text-anchor="middle" font-size="18" font-weight="800" fill="#1e3a8a">Thread A</text>
    <rect x="84" y="156" width="240" height="56" rx="14" fill="#ffffff" stroke="#93c5fd"/>
    <text x="204" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Working memory / local working set</text>
    <text x="204" y="200" text-anchor="middle" font-size="12" fill="#475569">Registers · L1/L2 Cache · Store Buffer</text>
    <rect x="84" y="232" width="240" height="78" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="110" y="258" font-size="13" fill="#0f172a">read(shared.count)</text>
    <text x="110" y="282" font-size="13" fill="#0f172a">count = count + 1</text>
    <text x="110" y="302" font-size="12" fill="#64748b">may stay local before publication</text>

    <rect x="550" y="104" width="292" height="250" rx="22" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="696" y="134" text-anchor="middle" font-size="18" font-weight="800" fill="#991b1b">Thread B</text>
    <rect x="576" y="156" width="240" height="56" rx="14" fill="#ffffff" stroke="#fca5a5"/>
    <text x="696" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Working memory / local working set</text>
    <text x="696" y="200" text-anchor="middle" font-size="12" fill="#475569">Registers · L1/L2 Cache · Invalidate Queue</text>
    <rect x="576" y="232" width="240" height="78" rx="14" fill="#fee2e2" stroke="#f87171"/>
    <text x="602" y="258" font-size="13" fill="#0f172a">read(shared.count)</text>
    <text x="602" y="282" font-size="13" fill="#0f172a">count = count + 1</text>
    <text x="602" y="302" font-size="12" fill="#64748b">may read stale values or overwrite writes</text>

    <rect x="308" y="386" width="284" height="86" rx="20" fill="#111827" stroke="#475569"/>
    <text x="450" y="416" text-anchor="middle" font-size="17" font-weight="800" fill="#f8fafc">Shared object in main memory</text>
    <text x="450" y="443" text-anchor="middle" font-size="14" fill="#fef3c7">shared.count = ?</text>
    <text x="450" y="462" text-anchor="middle" font-size="12" fill="#cbd5e1">heap fields, array elements, static fields, and other shared state</text>
  </g>

  <path d="M 205 310 C 205 372, 322 382, 394 386" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 695 310 C 695 372, 578 382, 506 386" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#redArrow)"/>
  <path d="M 396 386 C 324 360, 238 340, 204 310" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 8" marker-end="url(#arrow)"/>
  <path d="M 504 386 C 576 360, 662 340, 696 310" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 8" marker-end="url(#arrow)"/>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="82" y="370" width="202" height="92" rx="16" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="102" y="398" font-size="13" font-weight="800" fill="#1e40af">Without synchronization</text>
    <text x="102" y="424" font-size="12" fill="#334155">No happens-before edge between threads</text>
    <text x="102" y="444" font-size="12" fill="#334155">read-modify-write steps can interleave unpredictably</text>

    <rect x="616" y="370" width="202" height="92" rx="16" fill="#ffffff" stroke="#fecaca"/>
    <text x="636" y="398" font-size="13" font-weight="800" fill="#991b1b">With synchronization</text>
    <text x="636" y="424" font-size="12" fill="#334155">volatile / lock / start / join</text>
    <text x="636" y="444" font-size="12" fill="#334155">establishes a visibility edge from publication to read</text>
  </g>
</svg>
