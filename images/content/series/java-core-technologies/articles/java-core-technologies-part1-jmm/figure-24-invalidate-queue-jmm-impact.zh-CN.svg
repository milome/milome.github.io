<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 380">
  <title>Invalidate Queue对JMM的影响</title>
  <desc>Invalidate Queue对JMM的影响 static diagram for Java Memory Model Part 1.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="750" height="380" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="375" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1f2937">Invalidate Queue对JMM的影响</text>

  <!-- Core 0 -->
  <text x="150" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#374151">Core 0</text>
  <text x="150" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#3b82f6">x = 1;</text>
  <text x="150" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">发送Invalidate</text>

  <!-- Arrow from Core 0 -->
  <line x1="180" y1="85" x2="280" y2="150" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Core 1 -->
  <text x="600" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#374151">Core 1</text>
  <text x="600" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#dc2626">read(x)</text>

  <!-- Arrow from Core 1 -->
  <line x1="570" y1="85" x2="470" y2="150" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Invalidate Queue -->
  <rect x="280" y="130" width="190" height="80" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="375" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#92400e">Invalidate Queue</text>
  <text x="375" y="175" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#b45309">(延迟处理)</text>
  <text x="375" y="195" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">使无效请求队列</text>

  <!-- L1 Cache Core 1 -->
  <rect x="500" y="240" width="200" height="70" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#991b1b">L1 Cache (Core 1)</text>
  <text x="600" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#dc2626">可能仍是旧值!</text>

  <!-- Arrow from Queue to Cache -->
  <line x1="375" y1="210" x2="375" y2="230" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="405" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">异步</text>

  <!-- Horizontal arrow -->
  <line x1="470" y1="170" x2="500" y2="240" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>

  <!-- Problem box -->
  <rect x="50" y="320" width="650" height="45" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="375" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#dc2626">问题：Core 1可能读取到旧值</text>
  <text x="375" y="358" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#991b1b">解决：读操作前插入LoadLoad屏障</text>
</svg>
