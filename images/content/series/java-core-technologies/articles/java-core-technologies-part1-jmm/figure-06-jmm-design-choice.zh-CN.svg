<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <title>内存模型设计选择</title>
  <desc>内存模型设计选择 static diagram for Java Memory Model Part 1.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#1f2937">内存模型设计选择</text>

  <!-- Sequential Consistency Box (Left) -->
  <rect x="40" y="70" width="340" height="320" fill="#fee2e2" stroke="#dc2626" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="210" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#991b1b">顺序一致性 (Sequential Consistency)</text>

  <!-- SC Pros -->
  <text x="60" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#166534">优点：</text>
  <text x="60" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• 简单直观</text>
  <text x="60" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• 易于理解</text>
  <text x="60" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• 形式化简单</text>

  <!-- SC Cons -->
  <text x="60" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">缺点：</text>
  <text x="60" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• 性能开销大</text>
  <text x="60" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• 限制优化空间</text>
  <text x="60" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• 不兼容现有代码</text>

  <!-- VS Circle -->
  <circle cx="400" cy="230" r="35" fill="#f59e0b" filter="url(#shadow)"/>
  <text x="400" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">vs</text>

  <!-- Happens-Before Box (Right) -->
  <rect x="420" y="70" width="340" height="320" fill="#dcfce7" stroke="#22c55e" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="590" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#166534">happens-before 模型</text>

  <!-- HB Pros -->
  <text x="440" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#166534">优点：</text>
  <text x="440" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• 性能更好</text>
  <text x="440" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• 兼容现有代码</text>
  <text x="440" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• 平台无关</text>

  <!-- HB Cons -->
  <text x="440" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">缺点：</text>
  <text x="440" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• 更复杂</text>
  <text x="440" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#1f2937">• 需要显式同步</text>

  <!-- Decision -->
  <rect x="150" y="410" width="500" height="70" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="10" filter="url(#shadow)"/>
  <text x="400" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">JSR-133 决策：采用 happens-before 模型</text>
  <text x="400" y="465" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#1d4ed8">在性能和易用性之间取得平衡</text>
</svg>
