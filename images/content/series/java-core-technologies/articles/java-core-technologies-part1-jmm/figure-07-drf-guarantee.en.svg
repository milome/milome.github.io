<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280">
  <title>Data-race-free (DRF) guarantee</title>
  <desc>Data-race-free (DRF) guarantee static diagram for Java Memory Model Part 1.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="280" fill="#f8f6f3"/>

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1f2937">Data-race-free (DRF) guarantee</text>

  <!-- Step 1 -->
  <rect x="180" y="55" width="240" height="45" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1e40af">Program is data-race-free</text>
  <text x="300" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#3b82f6">(Data-Race-Free)</text>

  <!-- Arrow 1 -->
  <line x1="300" y1="100" x2="300" y2="120" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="310" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">implies</text>

  <!-- Step 2 -->
  <rect x="180" y="130" width="240" height="45" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#166534">Program behaves sequentially consistently</text>
  <text x="300" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#16a34a">(Sequential Consistency)</text>

  <!-- Arrow 2 -->
  <line x1="300" y1="175" x2="300" y2="195" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 3 -->
  <rect x="150" y="205" width="300" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="225" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#92400e">Programmer focuses on synchronization</text>
  <text x="300" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#b45309">No need to reason about low-level model details</text>
</svg>
