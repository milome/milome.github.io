<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">公开基准到团队私有评估的选择路径</title>
  <desc id="desc">展示团队先明确评估问题，再选择公开基准参照，最后通过私有 eval 验证是否适合自己的代码库和交付流程。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>

  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">公开基准到团队私有评估的选择路径</text>
  <text x="450" y="94" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8">不要从榜单开始，要从团队要做的工程决策开始</text>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" filter="url(#shadow)">
    <rect x="78" y="150" width="220" height="260" rx="20" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="188" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#bfdbfe">先问评估问题</text>
    <text x="188" y="222" text-anchor="middle" font-size="13" fill="#cbd5e1">基础生成？</text>
    <text x="188" y="254" text-anchor="middle" font-size="13" fill="#cbd5e1">复杂推理？</text>
    <text x="188" y="286" text-anchor="middle" font-size="13" fill="#cbd5e1">真实仓库修复？</text>
    <text x="188" y="318" text-anchor="middle" font-size="13" fill="#cbd5e1">新题防污染？</text>
    <text x="188" y="350" text-anchor="middle" font-size="13" fill="#cbd5e1">日常代码编辑？</text>

    <rect x="340" y="132" width="220" height="296" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="450" y="168" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc">再选公开参照</text>
    <rect x="372" y="198" width="156" height="32" rx="9" fill="#1e293b" stroke="#60a5fa"/>
    <text x="450" y="219" text-anchor="middle" font-size="12" fill="#bfdbfe">HumanEval / EvalPlus</text>
    <rect x="372" y="242" width="156" height="32" rx="9" fill="#1e293b" stroke="#38bdf8"/>
    <text x="450" y="263" text-anchor="middle" font-size="12" fill="#bae6fd">APPS / CodeContests</text>
    <rect x="372" y="286" width="156" height="32" rx="9" fill="#1e293b" stroke="#10b981"/>
    <text x="450" y="307" text-anchor="middle" font-size="12" fill="#a7f3d0">SWE-bench</text>
    <rect x="372" y="330" width="156" height="32" rx="9" fill="#1e293b" stroke="#f59e0b"/>
    <text x="450" y="351" text-anchor="middle" font-size="12" fill="#fde68a">LiveCodeBench</text>
    <rect x="372" y="374" width="156" height="32" rx="9" fill="#1e293b" stroke="#10b981"/>
    <text x="450" y="395" text-anchor="middle" font-size="12" fill="#a7f3d0">Aider Leaderboards</text>

    <rect x="602" y="150" width="220" height="260" rx="20" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="712" y="186" text-anchor="middle" font-size="18" font-weight="700" fill="#a7f3d0">最后私有复验</text>
    <text x="712" y="226" text-anchor="middle" font-size="13" fill="#cbd5e1">团队语言与框架</text>
    <text x="712" y="258" text-anchor="middle" font-size="13" fill="#cbd5e1">历史 bug 与 review 退回</text>
    <text x="712" y="290" text-anchor="middle" font-size="13" fill="#cbd5e1">安全和权限边界</text>
    <text x="712" y="322" text-anchor="middle" font-size="13" fill="#cbd5e1">成本、延迟、工具链</text>
    <text x="712" y="354" text-anchor="middle" font-size="13" fill="#cbd5e1">能否进入交付流程</text>
  </g>

  <line x1="298" y1="280" x2="332" y2="280" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="280" x2="594" y2="280" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="450" y="470" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">公开榜单回答外部位置，私有 eval 回答生产可信度。</text>
  <text x="450" y="500" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#64748b">Figure 2. 选基准的顺序是工程问题 → 公开参照 → 团队复验，而不是榜单排名 → 采购结论。</text>
</svg>
