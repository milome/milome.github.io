<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Selection path from public benchmarks to team private assessments</title>
  <desc id="desc">The demonstration team first clearly evaluates the problem, then selects a public benchmark reference, and finally uses a private eval to verify whether it is suitable for their code base and delivery process.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>

  <text x="450" y="74" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Benchmark selection to private eval</text>
  <text x="450" y="104" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8"><tspan x="450" y="95.5">Start with the engineering decision,</tspan><tspan x="450" dy="17.1">then choose the benchmark reference.</tspan></text>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" filter="url(#shadow)">
    <rect x="78" y="150" width="220" height="260" rx="20" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="188" y="237.8" text-anchor="middle" font-size="15" font-weight="700" fill="#bfdbfe"><tspan x="188" dy="0">Ask evaluation questions</tspan><tspan x="188" dy="17.7">first</tspan></text>
    <text x="188" y="271.6" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="188" dy="0">Basic generation?</tspan></text>
    <text x="188" y="287.52" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="188" dy="0">Complex reasoning?</tspan></text>
    <text x="188" y="303.44" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="188" dy="0">Real warehouse restoration?</tspan></text>
    <text x="188" y="319.36" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="188" dy="0">New topic: pollution prevention?</tspan></text>
    <text x="188" y="335.28" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="188" dy="0">Daily code editing?</tspan></text>

    <rect x="340" y="132" width="220" height="296" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="450" y="172" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc"><tspan x="450" dy="0">Select Public</tspan><tspan x="450" dy="21.96">Reference again</tspan></text>
    <rect x="372" y="198" width="156" height="32" rx="9" fill="#1e293b" stroke="#60a5fa"/>
    <text x="450" y="219" text-anchor="middle" font-size="12" fill="#bfdbfe">HumanEval / EvalPlus</text>
    <rect x="372" y="242" width="156" height="32" rx="9" fill="#1e293b" stroke="#38bdf8"/>
    <text x="450" y="263" text-anchor="middle" font-size="12" fill="#bae6fd">APPS / CodeContests</text>
    <rect x="372" y="286" width="156" height="32" rx="9" fill="#1e293b" stroke="#10b981"/>
    <text x="450" y="307" text-anchor="middle" font-size="12" fill="#a7f3d0">SWE-bench</text>
    <rect x="372" y="330" width="156" height="32" rx="9" fill="#1e293b" stroke="#f59e0b"/>
    <text x="450" y="351" text-anchor="middle" font-size="12" fill="#fde68a">LiveCodeBench</text>
    <rect x="372" y="374" width="156" height="32" rx="9" fill="#1e293b" stroke="#10b981"/>
    <text x="450" y="395" text-anchor="middle" font-size="12" fill="#a7f3d0">Aider Leaderboards</text>

    <rect x="602" y="150" width="220" height="260" rx="20" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="712" y="222.24" text-anchor="middle" font-size="18" font-weight="700" fill="#a7f3d0"><tspan x="712" dy="0">final private retest</tspan></text>
    <text x="712" y="240.12" text-anchor="middle" font-size="13" fill="#cbd5e1"><tspan x="712" dy="0">Team language and framework</tspan></text>
    <text x="712" y="257.2" text-anchor="middle" font-size="13" fill="#cbd5e1"><tspan x="712" dy="0">Historical bugs and review</tspan><tspan x="712" dy="15.34">returns</tspan></text>
    <text x="712" y="289.36" text-anchor="middle" font-size="13" fill="#cbd5e1"><tspan x="712" dy="0">Security and permission</tspan><tspan x="712" dy="15.34">boundaries</tspan></text>
    <text x="712" y="321.52" text-anchor="middle" font-size="13" fill="#cbd5e1"><tspan x="712" dy="0">Cost, latency, tool chain</tspan></text>
    <text x="712" y="338.6" text-anchor="middle" font-size="13" fill="#cbd5e1"><tspan x="712" dy="0">Can you enter the delivery</tspan><tspan x="712" dy="15.34">process?</tspan></text>
  </g>

  <line x1="298" y1="280" x2="332" y2="280" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="280" x2="594" y2="280" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="450" y="470" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#cbd5e1"><tspan x="450" y="461.4">Public list answers external position, private</tspan><tspan x="450" dy="17.1">eval answers production credibility.</tspan></text>

</svg>
