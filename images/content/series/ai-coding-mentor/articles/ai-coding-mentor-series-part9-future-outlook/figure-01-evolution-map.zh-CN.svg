<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">AI Coding Mentor 演进地图（2026-2030）</title>
  <desc id="desc">展示评估对象、协作关系和治理重心在2026到2030阶段的演进方向。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>

  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">AI Coding Mentor 演进地图（2026-2030）</text>
  <text x="450" y="94" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8">未来变量不止模型能力，关键在评估对象、责任边界与治理机制的同步升级</text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="78" y="136" width="182" height="250" rx="16" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="169" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#bfdbfe">2026 基线期</text>
    <text x="169" y="192" text-anchor="middle" font-size="12" fill="#cbd5e1">公开基准 + 私有试点</text>
    <text x="169" y="212" text-anchor="middle" font-size="12" fill="#cbd5e1">以任务通过率为主</text>
    <text x="169" y="238" text-anchor="middle" font-size="12" fill="#94a3b8">AI 是执行器</text>
    <text x="169" y="256" text-anchor="middle" font-size="12" fill="#94a3b8">人类做终审兜底</text>
    <text x="169" y="282" text-anchor="middle" font-size="12" fill="#94a3b8">治理后置、样本稀疏</text>

    <rect x="292" y="136" width="182" height="250" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="383" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#a7f3d0">2027 扩展期</text>
    <text x="383" y="192" text-anchor="middle" font-size="12" fill="#cbd5e1">私有 eval 常态化</text>
    <text x="383" y="212" text-anchor="middle" font-size="12" fill="#cbd5e1">过程轨迹进入评估</text>
    <text x="383" y="238" text-anchor="middle" font-size="12" fill="#94a3b8">AI 参与计划与修复</text>
    <text x="383" y="256" text-anchor="middle" font-size="12" fill="#94a3b8">Mentor 结构化反馈</text>
    <text x="383" y="282" text-anchor="middle" font-size="12" fill="#94a3b8">门控与路由前置</text>

    <rect x="506" y="136" width="182" height="250" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="597" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#fde68a">2028-2029 稳定期</text>
    <text x="597" y="192" text-anchor="middle" font-size="12" fill="#cbd5e1">评估与交付深度耦合</text>
    <text x="597" y="212" text-anchor="middle" font-size="12" fill="#cbd5e1">指标关注恢复与稳态</text>
    <text x="597" y="238" text-anchor="middle" font-size="12" fill="#94a3b8">人机责任协议化</text>
    <text x="597" y="256" text-anchor="middle" font-size="12" fill="#94a3b8">过程数据持续回流</text>
    <text x="597" y="282" text-anchor="middle" font-size="12" fill="#94a3b8">训练与评估隔离成熟</text>

    <rect x="720" y="136" width="102" height="250" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="771" y="166" text-anchor="middle" font-size="16" font-weight="700" fill="#bae6fd">2030+</text>
    <text x="771" y="192" text-anchor="middle" font-size="12" fill="#cbd5e1">系统竞争</text>
    <text x="771" y="212" text-anchor="middle" font-size="12" fill="#cbd5e1">成为主轴</text>
    <text x="771" y="240" text-anchor="middle" font-size="12" fill="#94a3b8">模型差距缩小</text>
    <text x="771" y="258" text-anchor="middle" font-size="12" fill="#94a3b8">治理差距放大</text>
  </g>

  <line x1="260" y1="262" x2="292" y2="262" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="474" y1="262" x2="506" y2="262" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="688" y1="262" x2="720" y2="262" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="84" y="414" width="732" height="82" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="444" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">主线变化：评估从“看答案”转向“看过程”，协作从“个人经验”转向“组织责任协议”。</text>
  <text x="450" y="468" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#64748b">Figure 1. 未来演进不是单点升级，而是评估、协作与治理三条轴线并行重构。</text>
</svg>
