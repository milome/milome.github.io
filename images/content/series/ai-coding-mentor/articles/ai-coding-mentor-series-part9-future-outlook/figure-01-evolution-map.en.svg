<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">AI Coding Mentor Evolution Map (2026-2030)</title>
  <desc id="desc">Demonstrate the evolution direction of assessment objects, collaborative relationships and governance focus from 2026 to 2030.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>

  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">AI Coding Mentor Evolution Map (2026-2030)</text>
  <text x="450" y="96" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8"><tspan x="450" y="96">Future variables are not only model</tspan><tspan x="450" dy="17.5">capability, but also assessment</tspan><tspan x="450" dy="17.5">objects, responsibility boundaries, and governance.</tspan></text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="78" y="136" width="182" height="250" rx="16" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="169" y="206.62" text-anchor="middle" font-size="15" font-weight="700" fill="#bfdbfe"><tspan x="169" dy="0">2026 baseline period</tspan></text>
    <text x="169" y="223.02" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="169" dy="0">Public benchmark + private</tspan><tspan x="169" dy="14.16">pilot</tspan></text>
    <text x="169" y="252.86" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="169" dy="0">Mainly based on task pass</tspan><tspan x="169" dy="14.16">rate</tspan></text>
    <text x="169" y="282.7" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="169" dy="0">AI is the executor</tspan></text>
    <text x="169" y="298.62" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="169" dy="0">Humanity is the final judge</tspan></text>
    <text x="169" y="314.54" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="169" dy="0">Governance post-processing</tspan><tspan x="169" dy="14.16">and sparse samples</tspan></text>

    <rect x="292" y="136" width="182" height="250" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="383" y="188.85" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0"><tspan x="383" dy="0">2027 expansion</tspan></text>
    <text x="383" y="206.55" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="383" dy="0">Private eval</tspan><tspan x="383" dy="14.16">normalization</tspan></text>
    <text x="383" y="237.87" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="383" dy="0">Process Trajectory Entry</tspan><tspan x="383" dy="14.16">Assessment</tspan></text>
    <text x="383" y="269.19" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="383" dy="0">AI involvement in planning</tspan><tspan x="383" dy="14.16">and remediation</tspan></text>
    <text x="383" y="300.51" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="383" dy="0">Mentor structured</tspan><tspan x="383" dy="14.16">feedback</tspan></text>
    <text x="383" y="331.83" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="383" dy="0">Gating and routing</tspan><tspan x="383" dy="14.16">frontend</tspan></text>

    <rect x="506" y="136" width="182" height="250" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="597" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#fde68a"><tspan x="597" dy="0">2028-2029 Stable</tspan><tspan x="597" dy="17.7">period</tspan></text>
    <text x="597" y="215.4" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="597" dy="0">Deep coupling of</tspan><tspan x="597" dy="14.16">assessment and delivery</tspan></text>
    <text x="597" y="246.72" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="597" dy="0">Indicators focus on</tspan><tspan x="597" dy="14.16">recovery and steady state</tspan></text>
    <text x="597" y="278.04" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="597" dy="0">Human-machine</tspan><tspan x="597" dy="14.16">responsibility agreement</tspan></text>
    <text x="597" y="309.36" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="597" dy="0">Continuous reflow of</tspan><tspan x="597" dy="14.16">process data</tspan></text>
    <text x="597" y="340.68" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="597" dy="0">Training and evaluation</tspan><tspan x="597" dy="14.16">isolation maturation</tspan></text>

    <rect x="720" y="136" width="102" height="250" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="771" y="211.59" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd"><tspan x="771" dy="0">2030+</tspan></text>
    <text x="771" y="229.29" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="771" dy="0">system</tspan><tspan x="771" dy="14.16">competition</tspan></text>
    <text x="771" y="260.61" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="771" dy="0">main axis</tspan></text>
    <text x="771" y="277.77" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="771" dy="0">Model gap</tspan><tspan x="771" dy="14.16">narrows</tspan></text>
    <text x="771" y="309.09" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="771" dy="0">Gov. gap</tspan><tspan x="771" dy="14.16">widens</tspan></text>
  </g>

  <line x1="260" y1="262" x2="292" y2="262" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="474" y1="262" x2="506" y2="262" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="688" y1="262" x2="720" y2="262" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="84" y="414" width="732" height="82" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="109.62" y="442.76" text-anchor="start" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#cbd5e1"><tspan x="109.62" y="442.76">Main line changes: evaluation shifts from “looking at</tspan><tspan x="109.62" dy="16.52">answers” to “looking at processes,” and collaboration</tspan><tspan x="109.62" dy="16.52">shifts from “personal experience” to “organizational</tspan><tspan x="109.62" dy="16.52">responsibility agreement.”</tspan></text>

</svg>
