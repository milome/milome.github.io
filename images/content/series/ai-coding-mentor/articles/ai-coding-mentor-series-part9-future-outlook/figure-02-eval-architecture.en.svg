<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Four-layer structure of organizational-level AI programming evaluation system</title>
  <desc id="desc">Demonstrate how the task, process, results, and governance layers form a reflowable organizational-level evaluation system.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>

  <text x="450" y="72" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#f8fafc">AI coding evaluation layers</text>
  <text x="450" y="100" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8"><tspan x="450" y="100">Assessment spans tasks, evidence, outcomes,</tspan><tspan x="450" dy="17.5">and governance before feedback to delivery.</tspan></text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="104" y="128" width="692" height="72" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="128.22" y="155" text-anchor="start" font-size="13" font-weight="700" fill="#bfdbfe"><tspan x="128.22" y="155">Task Layer·Task layer</tspan></text>
    <text x="128.22" y="176" text-anchor="start" font-size="14" fill="#cbd5e1"><tspan x="128.22" y="176">Task contract, acceptance criteria,</tspan><tspan x="128.22" dy="16.52">risk class, objective limits</tspan></text>

    <rect x="104" y="220" width="692" height="72" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="450" y="248" text-anchor="middle" font-size="16" font-weight="700" fill="#a7f3d0">Process Layer · Process Layer</text>
    <text x="450" y="270" text-anchor="middle" font-size="14" fill="#cbd5e1"><tspan x="450" y="261.4">Context, planning, tool calls, repair,</tspan><tspan x="450" dy="17.1">and verification traces</tspan></text>

    <rect x="104" y="312" width="692" height="72" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="340" text-anchor="middle" font-size="16" font-weight="700" fill="#fde68a">Outcome Layer · Result Layer</text>
    <text x="450" y="362" text-anchor="middle" font-size="14" fill="#cbd5e1"><tspan x="450" y="353.4">Rework, defect escape, cycle time,</tspan><tspan x="450" dy="17.1">review load, online stability</tspan></text>

    <rect x="104" y="404" width="692" height="72" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="128.22" y="431" text-anchor="start" font-size="13" font-weight="700" fill="#bae6fd"><tspan x="128.22" y="431">Governance Layer · Governance Layer</tspan></text>
    <text x="128.22" y="452" text-anchor="start" font-size="14" fill="#cbd5e1"><tspan x="128.22" y="452">train/eval isolation, privacy gates,</tspan><tspan x="128.22" dy="16.52">sample routing, version lifecycle</tspan></text>
  </g>

  <line x1="450" y1="200" x2="450" y2="220" stroke="#64748b" stroke-width="2.5"/>
  <line x1="450" y1="292" x2="450" y2="312" stroke="#64748b" stroke-width="2.5"/>
  <line x1="450" y1="384" x2="450" y2="404" stroke="#64748b" stroke-width="2.5"/>

  <path d="M 796 440 C 840 440, 840 164, 796 164" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="844" y="304" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#94a3b8" transform="rotate(90 844 304)">Reflow loop</text>


</svg>
