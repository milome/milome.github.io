<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">AI Coding Mentor 数据闭环成熟度路线图</title>
  <desc id="desc">展示从个人习惯、团队规范、平台化闭环到模型与工具链优化的四级成熟度路线。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#60a5fa"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">AI Coding Mentor 数据闭环成熟度路线图</text>
  <text x="450" y="94" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8">先让协作可复盘，再让数据可路由，最后才谈模型优化</text>

  <line x1="128" y1="280" x2="772" y2="280" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  <path d="M128 280 L772 280" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <circle cx="170" cy="280" r="19" fill="#1e293b" stroke="#60a5fa" stroke-width="3"/>
    <rect x="80" y="150" width="180" height="100" rx="16" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="170" y="181" text-anchor="middle" font-size="17" font-weight="700" fill="#bfdbfe">1. 个人习惯</text>
    <text x="170" y="207" text-anchor="middle" font-size="12" fill="#cbd5e1">记录 AI 参与范围</text>
    <text x="170" y="228" text-anchor="middle" font-size="12" fill="#cbd5e1">保留失败与修正理由</text>
  </g>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <circle cx="356" cy="280" r="19" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
    <rect x="266" y="312" width="180" height="100" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="356" y="343" text-anchor="middle" font-size="17" font-weight="700" fill="#a7f3d0">2. 团队规范</text>
    <text x="356" y="369" text-anchor="middle" font-size="12" fill="#cbd5e1">统一 PR 模板</text>
    <text x="356" y="390" text-anchor="middle" font-size="12" fill="#cbd5e1">沉淀 review 标签</text>
  </g>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <circle cx="542" cy="280" r="19" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <rect x="452" y="150" width="180" height="100" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="542" y="181" text-anchor="middle" font-size="17" font-weight="700" fill="#fde68a">3. 平台化闭环</text>
    <text x="542" y="207" text-anchor="middle" font-size="12" fill="#cbd5e1">Trace Store · 门控</text>
    <text x="542" y="228" text-anchor="middle" font-size="12" fill="#cbd5e1">Eval Runner · 数据路由</text>
  </g>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <circle cx="728" cy="280" r="19" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <rect x="638" y="312" width="180" height="100" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="728" y="343" text-anchor="middle" font-size="17" font-weight="700" fill="#bae6fd">4. 模型优化</text>
    <text x="728" y="369" text-anchor="middle" font-size="12" fill="#cbd5e1">私有 Eval 回归</text>
    <text x="728" y="390" text-anchor="middle" font-size="12" fill="#cbd5e1">SFT/RFT 与工具链迭代</text>
  </g>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#94a3b8">
    <text x="170" y="292" text-anchor="middle">可复盘</text>
    <text x="356" y="292" text-anchor="middle">可比较</text>
    <text x="542" y="292" text-anchor="middle">可路由</text>
    <text x="728" y="292" text-anchor="middle">可改进</text>
  </g>

  <text x="450" y="492" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#64748b">Figure 3. 成熟度的关键不是平台复杂度，而是每一级都能独立提升工程反馈质量。</text>
</svg>
