<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">AI Coding Mentor 数据飞轮</title>
  <desc id="desc">展示从业务需求、AI辅助交付、Mentor反馈、结构化轨迹、数据路由、训练评估到下一轮交付策略调整的闭环。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#10b981"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="900" height="560" fill="url(#bg)"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">AI Coding Mentor 数据飞轮</text>
  <text x="450" y="94" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8">真实交付产生轨迹，人类导师制造信号，评估与训练反向改进下一轮工程协作</text>

  <g filter="url(#shadow)">
    <rect x="84" y="150" width="176" height="78" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="172" y="181" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#bfdbfe">业务需求 / Spec</text>
    <text x="172" y="205" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">目标 · 约束 · 验收标准</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="362" y="120" width="176" height="78" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="450" y="151" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#bfdbfe">AI 辅助交付</text>
    <text x="450" y="175" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">计划 · 代码 · 工具调用</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="150" width="176" height="78" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="728" y="181" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#fde68a">Mentor 反馈</text>
    <text x="728" y="205" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">错误类型 · 根因 · 修正策略</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="332" width="176" height="78" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="728" y="363" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#a7f3d0">结构化轨迹</text>
    <text x="728" y="387" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">Trace · Diff · Test · Review</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="362" y="362" width="176" height="78" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="450" y="393" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#a7f3d0">数据路由</text>
    <text x="450" y="417" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">Eval · SFT · 偏好 · 知识库</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="84" y="332" width="176" height="78" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="172" y="363" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#bae6fd">训练与评估</text>
    <text x="172" y="387" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">私有 Eval · Prompt · SFT/RFT</text>
  </g>

  <path d="M260 184 C300 160, 322 158, 358 158" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M538 158 C588 158, 610 166, 636 184" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M728 228 C752 264, 752 296, 728 328" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M640 371 C594 395, 574 401, 542 401" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M362 401 C318 401, 296 394, 264 374" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M172 332 C126 278, 128 242, 168 229" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <circle cx="450" cy="280" r="78" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="450" y="266" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">核心判断</text>
  <text x="450" y="292" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">交付不是终点</text>
  <text x="450" y="314" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">而是数据生产现场</text>

  <text x="450" y="492" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#64748b">Figure 1. 一次 AI 协作只有进入可观察、可标注、可路由、可评估的链路，才会变成组织能力。</text>
</svg>
