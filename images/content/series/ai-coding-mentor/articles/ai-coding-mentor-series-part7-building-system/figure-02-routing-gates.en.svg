<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Route gating from delivery trace to data assets</title>
  <desc id="desc">Demonstrates that the original delivery trace is gated for safety, permission, contamination, reproducibility, validation, and teaching value before being routed to the evaluation set, SFT candidate set, preference data, team knowledge hub, or drop zone.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Route gating from delivery trace to data assets</text>
  <text x="450" y="96" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8"><tspan x="450" y="96">Gating first checks trustworthiness, then determines</tspan><tspan x="450" dy="17.5">the use of the data.</tspan></text>

  <g filter="url(#shadow)">
    <rect x="62" y="205" width="158" height="118" rx="16" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="141" y="237.94" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#bfdbfe"><tspan x="141" dy="0">Original delivery</tspan><tspan x="141" dy="17.7">track</tspan></text>
    <text x="141" y="272.84" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1"><tspan x="141" dy="0">Requirement · Prompt ·</tspan><tspan x="141" dy="13.57">Diff</tspan></text>
    <text x="141" y="302.98" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1"><tspan x="141" dy="0">Tool call · Test · Review</tspan></text>
  </g>

  <g filter="url(#shadow)">
    <rect x="278" y="138" width="220" height="254" rx="18" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="388" y="168" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#fde68a"><tspan x="388" dy="0">quality gating</tspan></text>
    <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#e2e8f0">
      <rect x="306" y="194" width="164" height="28" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="388" y="213" text-anchor="middle" font-size="12" font-weight="700"><tspan x="388" dy="0">Privacy / Security</tspan></text>
      <rect x="306" y="230" width="164" height="28" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="388" y="249" text-anchor="middle" font-size="12" font-weight="700"><tspan x="388" dy="0">IP / License</tspan></text>
      <rect x="306" y="266" width="164" height="28" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="388" y="285" text-anchor="middle" font-size="12" font-weight="700"><tspan x="388" dy="0">Data pollution</tspan></text>
      <rect x="306" y="302" width="164" height="28" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="388" y="321" text-anchor="middle" font-size="12" font-weight="700"><tspan x="388" dy="0">Reproducible</tspan></text>
      <rect x="306" y="338" width="164" height="28" rx="8" fill="#1e293b" stroke="#475569"/>
      <text x="388" y="357" text-anchor="middle" font-size="12" font-weight="700"><tspan x="388" dy="0">Teaching value</tspan></text>
    </g>
  </g>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="585" y="125" width="124" height="66" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="647" y="156.34" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd"><tspan x="647" dy="0">Private Eval</tspan></text>
    <text x="647" y="172.74" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="647" dy="0">Reproducible tasks</tspan></text>

    <rect x="734" y="125" width="124" height="66" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="796" y="148.49" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0"><tspan x="796" dy="0">SFT candidate</tspan></text>
    <text x="796" y="166.19" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="796" dy="0">high quality</tspan><tspan x="796" dy="14.16">demonstration</tspan></text>

    <rect x="585" y="232" width="124" height="66" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="647" y="263.34" text-anchor="middle" font-size="15" font-weight="700" fill="#fde68a"><tspan x="647" dy="0">Preference data</tspan></text>
    <text x="647" y="279.74" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="647" dy="0">Plan choice</tspan></text>

    <rect x="734" y="232" width="124" height="66" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="796" y="262.11" text-anchor="middle" font-size="12" font-weight="700" fill="#bfdbfe"><tspan x="796" dy="0">Knowledge hub</tspan></text>
    <text x="796" y="277.09" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="796" dy="0">Rules</tspan></text>

    <rect x="659" y="340" width="124" height="66" rx="14" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text x="721" y="363.49" text-anchor="middle" font-size="15" font-weight="700" fill="#fecdd3"><tspan x="721" dy="0">discard area</tspan></text>
    <text x="721" y="381.19" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="721" dy="0">Sensitive or low</tspan><tspan x="721" dy="14.16">value</tspan></text>
  </g>

  <path d="M220 264 L274 264" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M498 264 C536 218, 547 166, 581 158" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M498 264 C564 190, 664 154, 730 158" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M498 264 L581 264" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M498 264 L730 264" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M498 264 C570 324, 608 370, 655 373" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>


</svg>
