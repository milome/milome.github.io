<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Three-tier screening and quality gating</title>
  <desc id="desc">Shows the retention paths of candidate samples after hard gating, quality assessment, and diversity control.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>

  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Three-tier screening and quality gating</text>
  <text x="450" y="94" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8"><tspan x="450" y="85.5">It’s not “keep as many as possible” but “keep</tspan><tspan x="450" dy="17.1">trainable and reproducible samples”</tspan></text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="76" y="156" width="170" height="244" rx="16" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
    <text x="161" y="251.33" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc"><tspan x="161" dy="0">original candidate</tspan></text>
    <text x="161" y="269.03" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="161" dy="0">100%</tspan></text>
    <text x="161" y="286.19" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="161" dy="0">Source: Delivery Track</tspan></text>
    <text x="161" y="303.35" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="161" dy="0">Contains noise and</tspan><tspan x="161" dy="14.16">sensitivity risks</tspan></text>

    <rect x="280" y="136" width="170" height="284" rx="16" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="365" y="170" text-anchor="middle" font-size="17" font-weight="700" fill="#bfdbfe">Layer 1</text>
    <text x="365" y="194" text-anchor="middle" font-size="12" fill="#cbd5e1">Hard Gates</text>
    <text x="365" y="220" text-anchor="middle" font-size="12" fill="#94a3b8">integrity / score floor</text>
    <text x="365" y="238" text-anchor="middle" font-size="12" fill="#94a3b8">veto / redaction blocked</text>
    <text x="365" y="266" text-anchor="middle" font-size="12" fill="#fde68a">Eliminate about 30-40%</text>

    <rect x="484" y="136" width="170" height="284" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="569" y="235.67" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0"><tspan x="569" dy="0">Layer 2</tspan></text>
    <text x="569" y="253.37" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="569" dy="0">Quality Review</tspan></text>
    <text x="569" y="270.53" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="569" dy="0">Number of iterations /</tspan><tspan x="569" dy="14.16">token /</tspan></text>
    <text x="569" y="301.85" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="569" dy="0">code pair/message</tspan><tspan x="569" dy="14.16">structure</tspan></text>
    <text x="569" y="333.17" text-anchor="middle" font-size="12" fill="#fde68a"><tspan x="569" dy="0">accepted / downgraded</tspan></text>

    <rect x="688" y="136" width="136" height="284" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="756" y="221.51" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd"><tspan x="756" dy="0">Layer 3</tspan></text>
    <text x="756" y="239.21" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="756" dy="0">Diversity Split</tspan></text>
    <text x="756" y="256.37" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="756" dy="0">Duplication</tspan><tspan x="756" dy="14.16">removal /</tspan><tspan x="756" dy="14.16">classification</tspan><tspan x="756" dy="14.16">balancing</tspan></text>
    <text x="756" y="316.01" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="756" dy="0">train / val / test</tspan></text>
    <text x="756" y="333.17" text-anchor="middle" font-size="12" fill="#fde68a"><tspan x="756" dy="0">Eventually about</tspan><tspan x="756" dy="14.16">50%</tspan></text>
  </g>

  <line x1="246" y1="278" x2="280" y2="278" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="278" x2="484" y2="278" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="654" y1="278" x2="688" y2="278" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="102" y="434" width="696" height="66" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="126.36" y="462" text-anchor="start" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#cbd5e1"><tspan x="126.36" y="462">Governance conclusion: Rejection samples are equally</tspan><tspan x="126.36" dy="16.52">valuable, they define “which collaborative processes</tspan><tspan x="126.36" dy="16.52">cannot be trained” by the team.</tspan></text>

</svg>
