<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">The total process from project delivery to SFT sample export</title>
  <desc id="desc">Demonstrates the four-stage SFT data pipeline of development delivery, assessment and scoring, sample extraction and multi-format export.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>

  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Overall process from project delivery to SFT sample export</text>
  <text x="450" y="94" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8"><tspan x="450" y="85.5">Manage the delivery track first,</tspan><tspan x="450" dy="17.1">then proceed to sample processing and training export</tspan></text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="72" y="168" width="180" height="176" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="162" y="202" text-anchor="middle" font-size="17" font-weight="700" fill="#bfdbfe">Project delivery</text>
    <text x="162" y="226" text-anchor="middle" font-size="12" fill="#cbd5e1">Specify / Plan</text>
    <text x="162" y="246" text-anchor="middle" font-size="12" fill="#cbd5e1">Implement / Audit</text>
    <text x="162" y="274" text-anchor="middle" font-size="12" fill="#94a3b8">Input: task contract, diff,</text>
    <text x="162" y="292" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="162" dy="0">Testing and review</tspan><tspan x="162" dy="14.64">evidence</tspan></text>

    <rect x="280" y="168" width="180" height="176" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="370" y="232.17" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0"><tspan x="370" y="232.17">Assessment and scoring</tspan></text>
    <text x="370" y="248.17" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="370" y="248.17">Parse / Score / Coach</tspan></text>
    <text x="370" y="264.67" text-anchor="middle" font-size="12.5" fill="#94a3b8"><tspan x="370" y="264.67">Output: error type,</tspan></text>
    <text x="370" y="280.67" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="370" y="280.67">Mentor feedback and quality</tspan><tspan x="370" dy="14.16">scores</tspan></text>

    <rect x="488" y="168" width="180" height="176" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="578" y="232.25" text-anchor="middle" font-size="17" font-weight="700" fill="#fde68a"><tspan x="578" y="232.25">Sample extraction</tspan></text>
    <text x="578" y="248.25" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="578" y="248.25">Candidate Builder</tspan></text>
    <text x="578" y="264.25" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="578" y="264.25">Quality / Redaction / Split</tspan></text>
    <text x="578" y="280.75" text-anchor="middle" font-size="12.5" fill="#94a3b8"><tspan x="578" y="280.75">Output: Canonical</tspan></text>
    <text x="578" y="296.75" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="578" y="296.75">SFT Sample</tspan></text>

    <rect x="696" y="168" width="132" height="176" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="762" y="221.44" text-anchor="middle" font-size="17" font-weight="700" fill="#bae6fd"><tspan x="762" dy="0">Export</tspan><tspan x="762" dy="20.06">training</tspan></text>
    <text x="762" y="257.88" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="762" dy="0">OpenAI Chat</tspan></text>
    <text x="762" y="273.8" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="762" dy="0">HF Conversational</tspan></text>
    <text x="762" y="289.72" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="762" dy="0">HF Tool Calling</tspan></text>
    <text x="762" y="305.64" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="762" dy="0">Versioned dataset</tspan></text>
  </g>

  <line x1="252" y1="256" x2="280" y2="256" stroke="#64748b" stroke-width="2.5"/>
  <line x1="460" y1="256" x2="488" y2="256" stroke="#64748b" stroke-width="2.5"/>
  <line x1="668" y1="256" x2="696" y2="256" stroke="#64748b" stroke-width="2.5"/>

  <rect x="92" y="388" width="716" height="92" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="117.06" y="418.56" text-anchor="start" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#cbd5e1"><tspan x="117.06" y="418.56">Key principles: do data governance (contract,</tspan><tspan x="117.06" dy="16.52">evidence, gate control) first, and then scale training</tspan><tspan x="117.06" dy="16.52">(export, fine-tuning, regression).</tspan></text>

</svg>
