<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="title desc">
  <title id="title">从原始资产到可训练数据集的构建漏斗</title>
  <desc id="desc">展示原始工程资产经过资产登记、样本构建与门控、证据增强、切分与多格式导出后，形成可训练数据集、知识库和拒绝报告的过程。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="#0f172a"/>
  <rect x="32" y="32" width="916" height="556" rx="24" fill="#111827" stroke="#334155" stroke-width="1.5"/>

  <text x="490" y="70" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#f8fafc">数据构建流程：从原始资产到训练数据</text>
  <text x="490" y="98" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#cbd5e1">核心不是“导出 JSONL”，而是保留任务、证据、边界和治理状态</text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="62" y="154" width="172" height="224" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="148" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#bfdbfe">1. 资产登记</text>
    <text x="148" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1">评估题目 / Review</text>
    <text x="148" y="236" text-anchor="middle" font-size="12" fill="#cbd5e1">对话日志 / 代码</text>
    <text x="148" y="266" text-anchor="middle" font-size="12" fill="#94a3b8">记录 source、story</text>
    <text x="148" y="284" text-anchor="middle" font-size="12" fill="#94a3b8">commit、验收证据</text>
    <rect x="86" y="318" width="124" height="34" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="148" y="340" text-anchor="middle" font-size="12" fill="#fde68a">候选资产池</text>

    <rect x="282" y="154" width="172" height="224" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="368" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#a7f3d0">2. 构建与门控</text>
    <text x="368" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1">去重 / 质量评分</text>
    <text x="368" y="236" text-anchor="middle" font-size="12" fill="#cbd5e1">脱敏 / 安全扫描</text>
    <text x="368" y="266" text-anchor="middle" font-size="12" fill="#94a3b8">拒绝无证据样本</text>
    <text x="368" y="284" text-anchor="middle" font-size="12" fill="#94a3b8">降级待补全样本</text>
    <rect x="306" y="318" width="124" height="34" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="368" y="340" text-anchor="middle" font-size="12" fill="#fde68a">可治理样本</text>

    <rect x="502" y="154" width="172" height="224" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="588" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#fde68a">3. 证据增强</text>
    <text x="588" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1">补充错误类型</text>
    <text x="588" y="236" text-anchor="middle" font-size="12" fill="#cbd5e1">验证命令 / 边界</text>
    <text x="588" y="266" text-anchor="middle" font-size="12" fill="#94a3b8">只增强证据</text>
    <text x="588" y="284" text-anchor="middle" font-size="12" fill="#94a3b8">不篡改任务目标</text>
    <rect x="526" y="318" width="124" height="34" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="588" y="340" text-anchor="middle" font-size="12" fill="#fde68a">训练候选集</text>

    <rect x="722" y="154" width="196" height="224" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="820" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#bae6fd">4. 切分与导出</text>
    <text x="820" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1">Canonical Sample</text>
    <text x="820" y="236" text-anchor="middle" font-size="12" fill="#cbd5e1">OpenAI / HF / 内部格式</text>
    <text x="820" y="266" text-anchor="middle" font-size="12" fill="#94a3b8">附带 dataset card</text>
    <text x="820" y="284" text-anchor="middle" font-size="12" fill="#94a3b8">split 与 lineage 报告</text>
    <rect x="748" y="318" width="144" height="34" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="820" y="340" text-anchor="middle" font-size="12" fill="#fde68a">可训练数据版本</text>
  </g>

  <line x1="234" y1="266" x2="282" y2="266" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="454" y1="266" x2="502" y2="266" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="674" y1="266" x2="722" y2="266" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="92" y="430" width="236" height="82" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="210" y="458" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">训练数据集</text>
    <text x="210" y="482" text-anchor="middle" font-size="12" fill="#94a3b8">train / validation / test</text>
    <text x="210" y="500" text-anchor="middle" font-size="12" fill="#94a3b8">只收 accepted 样本</text>

    <rect x="372" y="430" width="236" height="82" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="490" y="458" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">知识库资产</text>
    <text x="490" y="482" text-anchor="middle" font-size="12" fill="#94a3b8">knowledge_only / 复盘材料</text>
    <text x="490" y="500" text-anchor="middle" font-size="12" fill="#94a3b8">可检索但不训练</text>

    <rect x="652" y="430" width="236" height="82" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="770" y="458" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">拒绝与审计报告</text>
    <text x="770" y="482" text-anchor="middle" font-size="12" fill="#94a3b8">rejection / redaction / lineage</text>
    <text x="770" y="500" text-anchor="middle" font-size="12" fill="#94a3b8">解释为什么不能训练</text>

    <line x1="820" y1="378" x2="210" y2="430" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="820" y1="378" x2="490" y2="430" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="820" y1="378" x2="770" y2="430" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="490" y="558" text-anchor="middle" font-size="12" fill="#64748b">Figure 5. 数据构建流程把“材料整理”升级为“训练资产治理”：每个样本都要有来源、证据、处置状态和导出决策。</text>
  </g>
</svg>
