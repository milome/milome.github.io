<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Construction funnel from raw assets to split-aware trainable datasets</title>
  <desc id="desc">Shows how raw engineering assets pass through asset registration, sample construction and gating, evidence enhancement, split assignment, and multi-format export to become trainable datasets, knowledge hub assets, and rejection reports.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="#0f172a"/>
  <rect x="32" y="32" width="916" height="556" rx="24" fill="#111827" stroke="#334155" stroke-width="1.5"/>

  <text x="490" y="70" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Data construction: raw assets to training data</text>
  <text x="490" y="98" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#cbd5e1">The point is not just JSONL export; it is preserving tasks, evidence, boundaries, and governance state</text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="62" y="154" width="172" height="224" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="148" y="188" text-anchor="middle" font-size="16" font-weight="700" fill="#bfdbfe">1. Register</text>
    <text x="148" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1">Eval / Review</text>
    <text x="148" y="236" text-anchor="middle" font-size="12" fill="#cbd5e1">Chat logs / Code</text>
    <text x="148" y="266" text-anchor="middle" font-size="12" fill="#94a3b8">Capture source, story</text>
    <text x="148" y="284" text-anchor="middle" font-size="12" fill="#94a3b8">commit, acceptance</text>
    <rect x="86" y="318" width="124" height="34" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="148" y="340" text-anchor="middle" font-size="12" fill="#fde68a">Candidate assets</text>

    <rect x="282" y="154" width="172" height="224" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="368" y="188" text-anchor="middle" font-size="16" font-weight="700" fill="#a7f3d0">2. Build &amp; Gate</text>
    <text x="368" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1">Dedup / Score</text>
    <text x="368" y="236" text-anchor="middle" font-size="12" fill="#cbd5e1">Redact / Scan</text>
    <text x="368" y="266" text-anchor="middle" font-size="12" fill="#94a3b8">Reject no-evidence</text>
    <text x="368" y="284" text-anchor="middle" font-size="12" fill="#94a3b8">Downgrade incomplete</text>
    <rect x="306" y="318" width="124" height="34" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="368" y="340" text-anchor="middle" font-size="12" fill="#fde68a">Governed samples</text>

    <rect x="502" y="154" width="172" height="224" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="588" y="188" text-anchor="middle" font-size="16" font-weight="700" fill="#fde68a">3. Enhance</text>
    <text x="588" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1">Error class</text>
    <text x="588" y="236" text-anchor="middle" font-size="12" fill="#cbd5e1">Commands / Edges</text>
    <text x="588" y="266" text-anchor="middle" font-size="12" fill="#94a3b8">Add evidence only</text>
    <text x="588" y="284" text-anchor="middle" font-size="12" fill="#94a3b8">Do not alter task goal</text>
    <rect x="526" y="318" width="124" height="34" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="588" y="340" text-anchor="middle" font-size="12" fill="#fde68a">Training candidates</text>

    <rect x="722" y="154" width="196" height="224" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="820" y="188" text-anchor="middle" font-size="16" font-weight="700" fill="#bae6fd">4. Split &amp; Export</text>
    <text x="820" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1">Canonical Sample</text>
    <text x="820" y="236" text-anchor="middle" font-size="12" fill="#cbd5e1">OpenAI / HF / Internal</text>
    <text x="820" y="266" text-anchor="middle" font-size="12" fill="#94a3b8">Attach dataset card</text>
    <text x="820" y="284" text-anchor="middle" font-size="12" fill="#94a3b8">split and lineage reports</text>
    <rect x="748" y="318" width="144" height="34" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="820" y="340" text-anchor="middle" font-size="12" fill="#fde68a">Trainable version</text>
  </g>

  <line x1="234" y1="266" x2="282" y2="266" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="454" y1="266" x2="502" y2="266" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="674" y1="266" x2="722" y2="266" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="92" y="430" width="236" height="82" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="210" y="458" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">Training dataset</text>
    <text x="210" y="482" text-anchor="middle" font-size="12" fill="#94a3b8">train / validation / test</text>
    <text x="210" y="500" text-anchor="middle" font-size="12" fill="#94a3b8">accepted samples only</text>

    <rect x="372" y="430" width="236" height="82" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="490" y="458" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">Knowledge assets</text>
    <text x="490" y="482" text-anchor="middle" font-size="12" fill="#94a3b8">knowledge_only / review notes</text>
    <text x="490" y="500" text-anchor="middle" font-size="12" fill="#94a3b8">searchable, not trained</text>

    <rect x="652" y="430" width="236" height="82" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="770" y="458" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">Rejection reports</text>
    <text x="770" y="482" text-anchor="middle" font-size="12" fill="#94a3b8">rejection / redaction / lineage</text>
    <text x="770" y="500" text-anchor="middle" font-size="12" fill="#94a3b8">explain why not trainable</text>

    <line x1="820" y1="378" x2="210" y2="430" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="820" y1="378" x2="490" y2="430" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="820" y1="378" x2="770" y2="430" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="490" y="558" text-anchor="middle" font-size="12" fill="#64748b">Figure 5. Data construction upgrades material cleanup into training-asset governance: every sample needs provenance, evidence, status, and export decisions.</text>
  </g>
</svg>
