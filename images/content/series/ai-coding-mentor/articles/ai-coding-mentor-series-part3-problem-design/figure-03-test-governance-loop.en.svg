<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Question testing and governance closed loop</title>
  <desc id="desc">Demonstrates the closed loop between question samples, test suites, model runs, failure classification, difficulty calibration, metadata management, and question bank versions.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#10b981"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Question testing and governance closed loop</text>
  <text x="450" y="96" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8"><tspan x="450" y="96">Failure evidence updates the test, difficulty and</tspan><tspan x="450" dy="17.5">metadata.</tspan></text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="76" y="154" width="156" height="82" rx="15" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="154" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#bfdbfe">question sample</text>
    <text x="154" y="201.02" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="154" dy="0">Contract · Constraint ·</tspan><tspan x="154" dy="12.98">Example</tspan></text>

    <rect x="360" y="118" width="180" height="82" rx="15" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="450" y="149" text-anchor="middle" font-size="16" font-weight="700" fill="#bfdbfe">test suite</text>
    <text x="450" y="165.02" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="450" dy="0">Open · Hidden · Pressure ·</tspan><tspan x="450" dy="12.98">Confrontation</tspan></text>

    <rect x="668" y="154" width="156" height="82" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="746" y="194.75" text-anchor="middle" font-size="16" font-weight="700" fill="#bae6fd"><tspan x="746" y="194.75">Model run</tspan></text>
    <text x="746" y="211.25" text-anchor="middle" font-size="12.5" fill="#cbd5e1"><tspan x="746" y="211.25">Output · Log · Trace</tspan></text>

    <rect x="668" y="330" width="156" height="82" rx="15" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="746" y="355" text-anchor="middle" font-size="15" font-weight="700" fill="#fde68a"><tspan x="746" dy="0">Failure</tspan><tspan x="746" dy="17.7">classification</tspan></text>
    <text x="746" y="388.4" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="746" dy="0">Interface · Boundary ·</tspan><tspan x="746" dy="11.8">Complexity</tspan></text>

    <rect x="360" y="366" width="180" height="82" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="450" y="404.57" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0"><tspan x="450" dy="0">Calibration</tspan></text>
    <text x="450" y="422.27" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="450" dy="0">pass rate · budget · rubric</tspan></text>

    <rect x="76" y="330" width="156" height="82" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="154" y="361.96" text-anchor="middle" font-size="14" font-weight="700" fill="#a7f3d0"><tspan x="154" dy="0">question bank</tspan></text>
    <text x="154" y="378.2" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="154" dy="0">Metadata · Leak risk</tspan></text>
  </g>

  <path d="M232 195 C280 165, 315 158, 356 158" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M540 158 C590 158, 626 166, 664 194" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M746 236 C770 274, 770 300, 746 326" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M668 371 C614 398, 584 407, 544 407" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M360 407 C306 407, 270 396, 236 374" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M154 330 C126 278, 126 244, 152 237" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>

  <circle cx="450" cy="278" r="64" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="450" y="268" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Mentor signal</text>
  <text x="450" y="292" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">Failure is not noise</text>
  <text x="450" y="312" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">Instead, the calibration input</text>

  <path d="M686 340 C612 292, 543 278, 518 278" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M382 278 C306 278, 246 306, 214 330" fill="none" stroke="#64748b" stroke-width="2"/>


</svg>
