<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">题目测试与治理闭环</title>
  <desc id="desc">展示题目样本、测试套件、模型运行、失败分类、难度校准、元数据治理和题库版本之间的闭环。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#10b981"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">题目测试与治理闭环</text>
  <text x="450" y="94" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8">题目不是写完即完成，失败证据会反向更新测试、难度和元数据</text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="76" y="154" width="156" height="82" rx="15" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="154" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#bfdbfe">题目样本</text>
    <text x="154" y="209" text-anchor="middle" font-size="12" fill="#cbd5e1">契约 · 约束 · 示例</text>

    <rect x="360" y="118" width="180" height="82" rx="15" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="450" y="149" text-anchor="middle" font-size="16" font-weight="700" fill="#bfdbfe">测试套件</text>
    <text x="450" y="173" text-anchor="middle" font-size="12" fill="#cbd5e1">公开 · 隐藏 · 压力 · 对抗</text>

    <rect x="668" y="154" width="156" height="82" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="746" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#bae6fd">模型运行</text>
    <text x="746" y="209" text-anchor="middle" font-size="12" fill="#cbd5e1">输出 · 日志 · 修复轨迹</text>

    <rect x="668" y="330" width="156" height="82" rx="15" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="746" y="361" text-anchor="middle" font-size="16" font-weight="700" fill="#fde68a">失败分类</text>
    <text x="746" y="385" text-anchor="middle" font-size="12" fill="#cbd5e1">接口 · 边界 · 复杂度</text>

    <rect x="360" y="366" width="180" height="82" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="450" y="397" text-anchor="middle" font-size="16" font-weight="700" fill="#a7f3d0">难度校准</text>
    <text x="450" y="421" text-anchor="middle" font-size="12" fill="#cbd5e1">通过率 · 预算 · rubric</text>

    <rect x="76" y="330" width="156" height="82" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="154" y="361" text-anchor="middle" font-size="16" font-weight="700" fill="#a7f3d0">题库版本</text>
    <text x="154" y="385" text-anchor="middle" font-size="12" fill="#cbd5e1">元数据 · 污染风险</text>
  </g>

  <path d="M232 195 C280 165, 315 158, 356 158" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M540 158 C590 158, 626 166, 664 194" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M746 236 C770 274, 770 300, 746 326" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M668 371 C614 398, 584 407, 544 407" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M360 407 C306 407, 270 396, 236 374" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M154 330 C126 278, 126 244, 152 237" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>

  <circle cx="450" cy="278" r="64" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="450" y="268" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Mentor 信号</text>
  <text x="450" y="292" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">失败不是噪声</text>
  <text x="450" y="312" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">而是校准输入</text>

  <path d="M686 340 C612 292, 543 278, 518 278" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M382 278 C306 278, 246 306, 214 330" fill="none" stroke="#64748b" stroke-width="2"/>

  <text x="450" y="492" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#64748b">Figure 3. 题目治理把测试失败转化为难度校准、元数据更新和下一轮题库版本，而不是停留在单次得分。</text>
</svg>
