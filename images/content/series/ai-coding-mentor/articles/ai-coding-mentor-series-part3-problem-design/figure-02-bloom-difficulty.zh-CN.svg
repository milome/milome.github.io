<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Bloom 层级与 AI 评估难度映射</title>
  <desc id="desc">展示 Bloom 六个认知层级在编程评估中的能力证据、AI 难度区间和 Mentor 介入方式。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#60a5fa"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Bloom 层级与 AI 评估难度映射</text>
  <text x="450" y="94" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8">能力层级越高，越需要从单元测试升级到 rubric、轨迹审查和人工复核</text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="84" y="122" width="120" height="82" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="144" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0">记忆</text>
    <text x="144" y="176" text-anchor="middle" font-size="12" fill="#cbd5e1">语法 · API</text>

    <rect x="220" y="122" width="120" height="82" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="280" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0">理解</text>
    <text x="280" y="176" text-anchor="middle" font-size="12" fill="#cbd5e1">概念差异</text>

    <rect x="356" y="122" width="120" height="82" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="416" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#bfdbfe">应用</text>
    <text x="416" y="176" text-anchor="middle" font-size="12" fill="#cbd5e1">实现逻辑</text>

    <rect x="492" y="122" width="120" height="82" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="552" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd">分析</text>
    <text x="552" y="176" text-anchor="middle" font-size="12" fill="#cbd5e1">拆解边界</text>

    <rect x="628" y="122" width="120" height="82" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="688" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd">评价</text>
    <text x="688" y="176" text-anchor="middle" font-size="12" fill="#cbd5e1">方案取舍</text>

    <rect x="764" y="122" width="72" height="82" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="800" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#fde68a">创造</text>
    <text x="800" y="176" text-anchor="middle" font-size="12" fill="#cbd5e1">新结构</text>

    <rect x="92" y="276" width="218" height="108" rx="18" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="201" y="310" text-anchor="middle" font-size="17" font-weight="700" fill="#a7f3d0">低难度区</text>
    <text x="201" y="337" text-anchor="middle" font-size="12" fill="#cbd5e1">适合基线筛查</text>
    <text x="201" y="359" text-anchor="middle" font-size="12" fill="#cbd5e1">主要用单元测试评分</text>

    <rect x="342" y="276" width="168" height="108" rx="18" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <text x="426" y="310" text-anchor="middle" font-size="17" font-weight="700" fill="#bfdbfe">中难度区</text>
    <text x="426" y="337" text-anchor="middle" font-size="12" fill="#cbd5e1">最适合长期评估</text>
    <text x="426" y="359" text-anchor="middle" font-size="12" fill="#cbd5e1">测试加失败分类</text>

    <rect x="542" y="276" width="190" height="108" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="637" y="310" text-anchor="middle" font-size="17" font-weight="700" fill="#bae6fd">高难度区</text>
    <text x="637" y="337" text-anchor="middle" font-size="12" fill="#cbd5e1">暴露判断边界</text>
    <text x="637" y="359" text-anchor="middle" font-size="12" fill="#cbd5e1">需要 rubric 和证据</text>

    <rect x="752" y="276" width="84" height="108" rx="18" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="794" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#fde68a">人工</text>
    <text x="794" y="336" text-anchor="middle" font-size="12" fill="#cbd5e1">复核</text>
    <text x="794" y="358" text-anchor="middle" font-size="12" fill="#cbd5e1">治理</text>
  </g>

  <path d="M204 163 L216 163" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M340 163 L352 163" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M476 163 L488 163" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M612 163 L624 163" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M748 163 L760 163" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>

  <path d="M144 204 C150 238, 170 254, 194 272" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M280 204 C272 236, 242 254, 214 272" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M416 204 C416 238, 420 254, 424 272" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M552 204 C568 238, 596 254, 626 272" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M688 204 C681 238, 660 254, 642 272" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M800 204 C800 238, 798 254, 796 272" fill="none" stroke="#64748b" stroke-width="2"/>

  <text x="450" y="434" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">题目设计先确定能力层级，再选择测试、rubric 和复核方式。</text>
  <text x="450" y="492" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#64748b">Figure 2. 从记忆到创造，评估重点从答案正确性逐步转向边界识别、方案判断和人类 Mentor 校准。</text>
</svg>
