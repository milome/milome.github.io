<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Risk control in three dialogue modes</title>
  <desc id="desc">Demonstrate guided, collaborative, and adversarial conversations for clarification, delivery, and validation respectively, and together serve the human Mentor's conversational control.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#60a5fa"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Risk control in three dialogue modes</text>
  <text x="450" y="96" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8"><tspan x="450" y="96">Pattern is not about chatting skills,</tspan><tspan x="450" dy="17.5">but about deciding when to clarify,</tspan><tspan x="450" dy="17.5">when to deliver, and when to stress test</tspan></text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="76" y="156" width="210" height="186" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="181" y="225.25" text-anchor="middle" font-size="18" font-weight="700" fill="#bfdbfe"><tspan x="181" y="225.25">guided</tspan></text>
    <text x="181" y="241.25" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="181" y="241.25">for clarification and learning</tspan></text>
    <line x1="112" y1="242" x2="250" y2="242" stroke="#334155" stroke-width="1"/>
    <text x="181" y="257.75" text-anchor="middle" font-size="12.5" fill="#e2e8f0"><tspan x="181" y="257.75">exposure hypothesis</tspan></text>
    <text x="181" y="274.25" text-anchor="middle" font-size="12.5" fill="#e2e8f0"><tspan x="181" y="274.25">Completion constraints</tspan></text>
    <text x="181" y="290.75" text-anchor="middle" font-size="12.5" fill="#94a3b8"><tspan x="181" y="290.75">Risk: early build</tspan></text>

    <rect x="345" y="156" width="210" height="186" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="450" y="225.25" text-anchor="middle" font-size="18" font-weight="700" fill="#bae6fd"><tspan x="450" y="225.25">collaborative</tspan></text>
    <text x="450" y="241.25" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="450" y="241.25">for delivery and integration</tspan></text>
    <line x1="381" y1="242" x2="519" y2="242" stroke="#334155" stroke-width="1"/>
    <text x="450" y="257.75" text-anchor="middle" font-size="12.5" fill="#e2e8f0"><tspan x="450" y="257.75">Division-of-labor plan</tspan></text>
    <text x="450" y="274.25" text-anchor="middle" font-size="12.5" fill="#e2e8f0"><tspan x="450" y="274.25">stage acceptance</tspan></text>
    <text x="450" y="290.75" text-anchor="middle" font-size="12.5" fill="#94a3b8"><tspan x="450" y="290.75">Risk: Scope Divergence</tspan></text>

    <rect x="614" y="156" width="210" height="186" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="719" y="224.25" text-anchor="middle" font-size="15" font-weight="700" fill="#fde68a"><tspan x="719" y="224.25">Confrontational</tspan></text>
    <text x="719" y="240.25" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="719" y="240.25">for validation and stress tests</tspan></text>
    <line x1="650" y1="242" x2="788" y2="242" stroke="#334155" stroke-width="1"/>
    <text x="719" y="256.25" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="719" y="256.25">extreme input</tspan></text>
    <text x="719" y="272.25" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="719" y="272.25">Counterexamples</tspan></text>
    <text x="719" y="288.75" text-anchor="middle" font-size="12.5" fill="#94a3b8"><tspan x="719" y="288.75">Risk: Argument without a goal</tspan></text>

    <rect x="260" y="398" width="380" height="78" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="285" y="425" text-anchor="start" font-size="13" font-weight="700" fill="#f8fafc"><tspan x="285" y="425">Mentor dialogue control</tspan></text>
    <text x="285" y="446" text-anchor="start" font-size="14" fill="#cbd5e1"><tspan x="285" y="446">Switch by phase to avoid premature build,</tspan><tspan x="285" dy="16.52">scope drift, and evidence-free debate.</tspan></text>
  </g>

  <path d="M181 342 C228 390, 246 410, 256 420" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M450 342 L450 394" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M719 342 C672 390, 654 410, 644 420" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>


</svg>
