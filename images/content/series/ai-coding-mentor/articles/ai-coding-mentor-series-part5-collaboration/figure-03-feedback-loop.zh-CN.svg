<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">协作反馈闭环</title>
  <desc id="desc">展示 AI 输出经过人类 Mentor 的证据化反馈、错误分类、修正验证和资产沉淀，形成可复用的协作信号。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#10b981"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">协作反馈闭环</text>
  <text x="450" y="94" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8">有效反馈不是“重写”，而是证据、错误类型、修正方向和验收方式的组合</text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="76" y="154" width="156" height="82" rx="15" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="154" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#bfdbfe">AI 输出</text>
    <text x="154" y="209" text-anchor="middle" font-size="12" fill="#cbd5e1">方案 · 代码 · 测试</text>

    <rect x="360" y="118" width="180" height="82" rx="15" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="149" text-anchor="middle" font-size="16" font-weight="700" fill="#fde68a">证据化反馈</text>
    <text x="450" y="173" text-anchor="middle" font-size="12" fill="#cbd5e1">违反哪条约束</text>

    <rect x="668" y="154" width="156" height="82" rx="15" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="746" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#fde68a">错误分类</text>
    <text x="746" y="209" text-anchor="middle" font-size="12" fill="#cbd5e1">接口 · 边界 · 安全</text>

    <rect x="668" y="330" width="156" height="82" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="746" y="361" text-anchor="middle" font-size="16" font-weight="700" fill="#a7f3d0">修正验证</text>
    <text x="746" y="385" text-anchor="middle" font-size="12" fill="#cbd5e1">测试 · rubric · review</text>

    <rect x="360" y="366" width="180" height="82" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="450" y="397" text-anchor="middle" font-size="16" font-weight="700" fill="#a7f3d0">资产沉淀</text>
    <text x="450" y="421" text-anchor="middle" font-size="12" fill="#cbd5e1">协议 · 示例 · 错误库</text>

    <rect x="76" y="330" width="156" height="82" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="154" y="361" text-anchor="middle" font-size="16" font-weight="700" fill="#bae6fd">下一轮协作</text>
    <text x="154" y="385" text-anchor="middle" font-size="12" fill="#cbd5e1">更清晰的协议</text>

    <circle cx="450" cy="278" r="62" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="450" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">Mentor 信号</text>
    <text x="450" y="290" text-anchor="middle" font-size="12" fill="#cbd5e1">反馈不是评论</text>
    <text x="450" y="310" text-anchor="middle" font-size="12" fill="#cbd5e1">而是训练证据</text>
  </g>

  <path d="M232 195 C280 165, 315 158, 356 158" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M540 158 C590 158, 626 166, 664 194" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M746 236 C770 274, 770 300, 746 326" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M668 371 C614 398, 584 407, 544 407" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M360 407 C306 407, 270 396, 236 374" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M154 330 C126 278, 126 244, 152 237" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M690 338 C612 292, 538 278, 516 278" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M388 278 C316 278, 248 306, 214 330" fill="none" stroke="#64748b" stroke-width="2"/>

  <text x="450" y="492" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#64748b">Figure 3. 结构化反馈让一次协作产生可复用资产，并为后续评估、案例和数据闭环提供输入。</text>
</svg>
