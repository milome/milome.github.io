<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Collaborative feedback closed loop</title>
  <desc id="desc">Demonstrate that the AI output undergoes evidence-based feedback, error classification, correction verification and asset precipitation by human Mentor to form a reusable collaboration signal.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#10b981"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Collaborative feedback closed loop</text>
  <text x="450" y="96" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8"><tspan x="450" y="96">Effective feedback combines evidence,</tspan><tspan x="450" dy="17.5">error type, correction direction, and</tspan><tspan x="450" dy="17.5">acceptance method.</tspan></text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="76" y="154" width="156" height="82" rx="15" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="154" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#bfdbfe">AI output</text>
    <text x="154" y="209" text-anchor="middle" font-size="12" fill="#cbd5e1">Solution · Code · Test</text>

    <rect x="360" y="118" width="180" height="82" rx="15" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="147.72" text-anchor="middle" font-size="15" font-weight="700" fill="#fde68a"><tspan x="450" dy="0">Evidence based</tspan><tspan x="450" dy="17.7">feedback</tspan></text>
    <text x="450" y="183.12" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="450" dy="0">violated constraint</tspan></text>

    <rect x="668" y="154" width="156" height="82" rx="15" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="746" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#fde68a">Misclassification</text>
    <text x="746" y="201.02" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="746" dy="0">Interface ·</tspan><tspan x="746" dy="12.98">Boundary · Security</tspan></text>

    <rect x="668" y="330" width="156" height="82" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="746" y="361" text-anchor="middle" font-size="16" font-weight="700" fill="#a7f3d0">Fix validation</text>
    <text x="746" y="385" text-anchor="middle" font-size="12" fill="#cbd5e1">test · rubric · review</text>

    <rect x="360" y="366" width="180" height="82" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="450" y="397" text-anchor="middle" font-size="16" font-weight="700" fill="#a7f3d0">Asset precipitation</text>
    <text x="450" y="411.36" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="450" dy="0">Protocols · Examples</tspan><tspan x="450" dy="14.64">· Error Library</tspan></text>

    <rect x="76" y="330" width="156" height="82" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="154" y="359.72" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd"><tspan x="154" dy="0">Next round of</tspan><tspan x="154" dy="17.7">collaboration</tspan></text>
    <text x="154" y="395.12" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="154" dy="0">A clearer agreement</tspan></text>

    <circle cx="450" cy="278" r="62" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="450" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">Mentor signal</text>
    <text x="450" y="290" text-anchor="middle" font-size="12" fill="#cbd5e1">Feedback is not a review</text>
    <text x="450" y="310" text-anchor="middle" font-size="12" fill="#cbd5e1">but training evidence</text>
  </g>

  <path d="M232 195 C280 165, 315 158, 356 158" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M540 158 C590 158, 626 166, 664 194" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M746 236 C770 274, 770 300, 746 326" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M668 371 C614 398, 584 407, 544 407" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M360 407 C306 407, 270 396, 236 374" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M154 330 C126 278, 126 244, 152 237" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M690 338 C612 292, 538 278, 516 278" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M388 278 C316 278, 248 306, 214 330" fill="none" stroke="#64748b" stroke-width="2"/>


</svg>
