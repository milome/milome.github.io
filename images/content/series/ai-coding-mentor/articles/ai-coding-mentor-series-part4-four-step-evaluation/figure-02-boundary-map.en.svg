<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">AI capability boundary map</title>
  <desc id="desc">Demonstrate stress testing to classify AI programming tasks into safe, review, and no-go zones, and translate failure evidence into usage strategies.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#60a5fa"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">AI capability boundary map</text>
  <text x="450" y="96" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8"><tspan x="450" y="96">Stress testing turns failure evidence into executable</tspan><tspan x="450" dy="17.5">collaboration strategies</tspan></text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="78" y="140" width="224" height="250" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="190" y="216.52" text-anchor="middle" font-size="18" font-weight="700" fill="#a7f3d0"><tspan x="190" dy="0">safe zone</tspan></text>
    <text x="190" y="233.4" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="190" dy="0">Low risk · Can be automated</tspan></text>
    <line x1="108" y1="224" x2="272" y2="224" stroke="#334155" stroke-width="1"/>
    <text x="190" y="250.32" text-anchor="middle" font-size="13" fill="#e2e8f0"><tspan x="190" dy="0">Single file partial modification</tspan></text>
    <text x="190" y="267.4" text-anchor="middle" font-size="13" fill="#e2e8f0"><tspan x="190" dy="0">Function implementation under</tspan><tspan x="190" dy="15.34">clear contract</tspan></text>
    <text x="190" y="299.56" text-anchor="middle" font-size="13" fill="#e2e8f0"><tspan x="190" dy="0">Test supplement and documentation</tspan></text>
    <text x="190" y="315.64" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="190" dy="0">Strategy: adopted after routine</tspan><tspan x="190" dy="14.16">verification</tspan></text>

    <rect x="338" y="140" width="224" height="250" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#fde68a">censorship area</text>
    <text x="450" y="202" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="450" dy="0">Medium risk · Human-machine</tspan><tspan x="450" dy="14.64">collaboration</tspan></text>
    <line x1="368" y1="224" x2="532" y2="224" stroke="#334155" stroke-width="1"/>
    <text x="450" y="254" text-anchor="middle" font-size="13" fill="#e2e8f0"><tspan x="450" dy="0">Cross-module</tspan><tspan x="450" dy="15.86">functionality changes</tspan></text>
    <text x="450" y="284" text-anchor="middle" font-size="13" fill="#e2e8f0">performance sensitive path</text>
    <text x="450" y="314" text-anchor="middle" font-size="13" fill="#e2e8f0"><tspan x="450" dy="0">Concurrency and complex</tspan><tspan x="450" dy="15.86">business rules</tspan></text>
    <text x="450" y="353.36" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="450" dy="0">Strategy: Manual review and</tspan><tspan x="450" dy="14.64">regression testing</tspan></text>

    <rect x="598" y="140" width="224" height="250" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="710" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#bae6fd">restricted area</text>
    <text x="710" y="202" text-anchor="middle" font-size="12" fill="#cbd5e1">High Risk·Human Dominance</text>
    <line x1="628" y1="224" x2="792" y2="224" stroke="#334155" stroke-width="1"/>
    <text x="710" y="254" text-anchor="middle" font-size="13" fill="#e2e8f0">safety critical logic</text>
    <text x="710" y="284" text-anchor="middle" font-size="13" fill="#e2e8f0">Irreversible data migration</text>
    <text x="710" y="314" text-anchor="middle" font-size="13" fill="#e2e8f0"><tspan x="710" dy="0">Legacy refactoring</tspan><tspan x="710" dy="15.86">without testing</tspan></text>
    <text x="710" y="353.36" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="710" dy="0">Strategy: AI only does</tspan><tspan x="710" dy="14.64">auxiliary analysis</tspan></text>

    <rect x="118" y="428" width="664" height="44" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="141.24" y="456" text-anchor="start" font-size="14" fill="#cbd5e1"><tspan x="141.24" y="456">Stress signals: Complexity, context, ambiguity and</tspan><tspan x="141.24" dy="16.52">adversarial are gradually increasing, and tasks are</tspan><tspan x="141.24" dy="16.52">moving from automation to manual dominance</tspan></text>
  </g>

  <path d="M304 264 L334 264" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M564 264 L594 264" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="320" y="244" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#64748b">Risks rise</text>
  <text x="580" y="244" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#64748b">manual intervention</text>


</svg>
