<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">AI 能力边界地图</title>
  <desc id="desc">展示压力测试后将 AI 编程任务分为安全区、审查区和禁入区，并将失败证据转化为使用策略。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#60a5fa"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">AI 能力边界地图</text>
  <text x="450" y="94" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8">压力测试的目的不是制造失败，而是把失败证据转成可执行的协作策略</text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="78" y="140" width="224" height="250" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="190" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#a7f3d0">安全区</text>
    <text x="190" y="202" text-anchor="middle" font-size="12" fill="#cbd5e1">低风险 · 可自动化</text>
    <line x1="108" y1="224" x2="272" y2="224" stroke="#334155" stroke-width="1"/>
    <text x="190" y="254" text-anchor="middle" font-size="13" fill="#e2e8f0">单文件局部修改</text>
    <text x="190" y="284" text-anchor="middle" font-size="13" fill="#e2e8f0">明确契约下的函数实现</text>
    <text x="190" y="314" text-anchor="middle" font-size="13" fill="#e2e8f0">测试补充和文档整理</text>
    <text x="190" y="354" text-anchor="middle" font-size="12" fill="#94a3b8">策略：常规验证后采用</text>

    <rect x="338" y="140" width="224" height="250" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#fde68a">审查区</text>
    <text x="450" y="202" text-anchor="middle" font-size="12" fill="#cbd5e1">中风险 · 人机协作</text>
    <line x1="368" y1="224" x2="532" y2="224" stroke="#334155" stroke-width="1"/>
    <text x="450" y="254" text-anchor="middle" font-size="13" fill="#e2e8f0">跨模块功能改动</text>
    <text x="450" y="284" text-anchor="middle" font-size="13" fill="#e2e8f0">性能敏感路径</text>
    <text x="450" y="314" text-anchor="middle" font-size="13" fill="#e2e8f0">并发和复杂业务规则</text>
    <text x="450" y="354" text-anchor="middle" font-size="12" fill="#94a3b8">策略：人工 review 和回归测试</text>

    <rect x="598" y="140" width="224" height="250" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="710" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#bae6fd">禁入区</text>
    <text x="710" y="202" text-anchor="middle" font-size="12" fill="#cbd5e1">高风险 · 人类主导</text>
    <line x1="628" y1="224" x2="792" y2="224" stroke="#334155" stroke-width="1"/>
    <text x="710" y="254" text-anchor="middle" font-size="13" fill="#e2e8f0">安全关键逻辑</text>
    <text x="710" y="284" text-anchor="middle" font-size="13" fill="#e2e8f0">不可逆数据迁移</text>
    <text x="710" y="314" text-anchor="middle" font-size="13" fill="#e2e8f0">缺测试的遗留重构</text>
    <text x="710" y="354" text-anchor="middle" font-size="12" fill="#94a3b8">策略：AI 只做辅助分析</text>

    <rect x="118" y="428" width="664" height="44" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="450" y="456" text-anchor="middle" font-size="13" fill="#cbd5e1">压力信号：复杂度、上下文、模糊性和对抗性逐步升高，任务从自动化走向人工主导</text>
  </g>

  <path d="M304 264 L334 264" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M564 264 L594 264" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="320" y="244" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#64748b">风险上升</text>
  <text x="580" y="244" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11" fill="#64748b">人工介入</text>

  <text x="450" y="506" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#64748b">Figure 2. 能力边界地图把评估结论转成任务分配、审查强度和上线门禁，而不是停留在通过率。</text>
</svg>
