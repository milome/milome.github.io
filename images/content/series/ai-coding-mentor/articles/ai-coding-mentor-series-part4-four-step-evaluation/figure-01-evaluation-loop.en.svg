<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">AI capability assessment four-step closed loop</title>
  <desc id="desc">It shows the closed loop between baseline testing, stress testing, special improvement and continuous evaluation, as well as four types of outputs: capability portrait, boundary map, improvement queue and drift warning.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#10b981"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#38bdf8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">AI capability assessment four-step closed loop</text>
  <text x="450" y="96" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8"><tspan x="450" y="96">Continuous loop: profile capability,</tspan><tspan x="450" dy="17.5">find boundaries, improve protocols, track drift.</tspan></text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="92" y="142" width="172" height="86" rx="15" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="178" y="174" text-anchor="middle" font-size="16" font-weight="700" fill="#bfdbfe">Baseline test</text>
    <text x="178" y="191.36" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="178" dy="0">Create a competency</tspan><tspan x="178" dy="14.64">profile</tspan></text>

    <rect x="636" y="142" width="172" height="86" rx="15" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="722" y="174" text-anchor="middle" font-size="16" font-weight="700" fill="#fde68a">stress test</text>
    <text x="722" y="191.36" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="722" dy="0">Identify reliable</tspan><tspan x="722" dy="14.64">boundaries</tspan></text>

    <rect x="636" y="336" width="172" height="86" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="722" y="369.49" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd"><tspan x="722" dy="0">Improvements</tspan></text>
    <text x="722" y="387.19" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="722" dy="0">Repair collaboration</tspan><tspan x="722" dy="14.16">agreement</tspan></text>

    <rect x="92" y="336" width="172" height="86" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="178" y="369.49" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0"><tspan x="178" dy="0">Evaluation</tspan></text>
    <text x="178" y="387.19" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="178" dy="0">Monitoring capability</tspan><tspan x="178" dy="14.16">drift</tspan></text>

    <circle cx="450" cy="280" r="72" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="450" y="267" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">Collaboration system</text>
    <text x="450" y="292" text-anchor="middle" font-size="12" fill="#cbd5e1">Model · Task · Context</text>
    <text x="450" y="313" text-anchor="middle" font-size="12" fill="#cbd5e1">Tools · Feedback</text>

    <rect x="332" y="128" width="236" height="48" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="450" y="158.25" text-anchor="middle" font-size="12.5" fill="#cbd5e1"><tspan x="450" y="158.25">Output: Capability Profile</tspan></text>

    <rect x="684" y="252" width="136" height="48" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="752" y="282.25" text-anchor="middle" font-size="12.5" fill="#cbd5e1"><tspan x="752" y="282.25">Output: Boundary Map</tspan></text>

    <rect x="332" y="430" width="236" height="48" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="352" y="457" text-anchor="start" font-size="13" fill="#cbd5e1" font-weight="700"><tspan x="352" y="457">Output: Improved queue</tspan></text>

    <rect x="80" y="252" width="136" height="48" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="148" y="282.25" text-anchor="middle" font-size="12.5" fill="#cbd5e1"><tspan x="148" y="282.25">Output: Drift warning</tspan></text>
  </g>

  <path d="M264 185 C382 116, 512 116, 632 185" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M722 228 C760 268, 760 318, 724 332" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <path d="M636 379 C512 448, 386 448, 268 379" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-cyan)"/>
  <path d="M178 336 C136 298, 136 244, 176 232" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>


</svg>
