<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">AI 能力评估四步闭环</title>
  <desc id="desc">展示基线测试、压力测试、专项改进和持续评估之间的闭环，以及能力画像、边界地图、改进队列和漂移预警四类产出。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#10b981"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">AI 能力评估四步闭环</text>
  <text x="450" y="94" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8">评估不是一次打分，而是能力画像、边界识别、专项改进和漂移监控的连续系统</text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="92" y="142" width="172" height="86" rx="15" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="178" y="174" text-anchor="middle" font-size="16" font-weight="700" fill="#bfdbfe">基线测试</text>
    <text x="178" y="199" text-anchor="middle" font-size="12" fill="#cbd5e1">建立能力画像</text>

    <rect x="636" y="142" width="172" height="86" rx="15" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="722" y="174" text-anchor="middle" font-size="16" font-weight="700" fill="#fde68a">压力测试</text>
    <text x="722" y="199" text-anchor="middle" font-size="12" fill="#cbd5e1">识别可靠边界</text>

    <rect x="636" y="336" width="172" height="86" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="722" y="368" text-anchor="middle" font-size="16" font-weight="700" fill="#bae6fd">专项改进</text>
    <text x="722" y="393" text-anchor="middle" font-size="12" fill="#cbd5e1">修复协作协议</text>

    <rect x="92" y="336" width="172" height="86" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="178" y="368" text-anchor="middle" font-size="16" font-weight="700" fill="#a7f3d0">持续评估</text>
    <text x="178" y="393" text-anchor="middle" font-size="12" fill="#cbd5e1">监控能力漂移</text>

    <circle cx="450" cy="280" r="72" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="450" y="267" text-anchor="middle" font-size="16" font-weight="700" fill="#f8fafc">协作系统</text>
    <text x="450" y="292" text-anchor="middle" font-size="12" fill="#cbd5e1">模型 · 任务 · 上下文</text>
    <text x="450" y="313" text-anchor="middle" font-size="12" fill="#cbd5e1">工具 · 反馈</text>

    <rect x="332" y="128" width="236" height="48" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="450" y="158" text-anchor="middle" font-size="12" fill="#cbd5e1">产出：能力画像</text>

    <rect x="684" y="252" width="136" height="48" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="752" y="282" text-anchor="middle" font-size="12" fill="#cbd5e1">产出：边界地图</text>

    <rect x="332" y="430" width="236" height="48" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="450" y="460" text-anchor="middle" font-size="12" fill="#cbd5e1">产出：改进队列</text>

    <rect x="80" y="252" width="136" height="48" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="148" y="282" text-anchor="middle" font-size="12" fill="#cbd5e1">产出：漂移预警</text>
  </g>

  <path d="M264 185 C382 116, 512 116, 632 185" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M722 228 C760 268, 760 318, 724 332" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M636 379 C512 448, 386 448, 268 379" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M178 336 C136 298, 136 244, 176 232" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <text x="450" y="506" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#64748b">Figure 1. 四步法把一次测评转化为持续运营：先建立参考线，再找边界，再改进协议，最后监控漂移。</text>
</svg>
