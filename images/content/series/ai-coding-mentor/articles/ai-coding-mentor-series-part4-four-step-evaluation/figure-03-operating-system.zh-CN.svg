<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">持续评估运营系统</title>
  <desc id="desc">展示固定评估集、真实项目反馈、运行记录、失败分类、质量门禁和专项改进之间的数据流和治理闭环。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#10b981"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">持续评估运营系统</text>
  <text x="450" y="94" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8">持续评估要能触发决策：升级、回滚、限流、专项改进或数据路由</text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="74" y="136" width="160" height="82" rx="15" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="154" y="167" text-anchor="middle" font-size="16" font-weight="700" fill="#bfdbfe">固定评估集</text>
    <text x="154" y="191" text-anchor="middle" font-size="12" fill="#cbd5e1">版本 · 难度 · 污染</text>

    <rect x="74" y="330" width="160" height="82" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="154" y="361" text-anchor="middle" font-size="16" font-weight="700" fill="#bae6fd">真实项目反馈</text>
    <text x="154" y="385" text-anchor="middle" font-size="12" fill="#cbd5e1">PR · issue · review</text>

    <rect x="330" y="136" width="160" height="82" rx="15" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="410" y="167" text-anchor="middle" font-size="16" font-weight="700" fill="#bfdbfe">评估运行</text>
    <text x="410" y="191" text-anchor="middle" font-size="12" fill="#cbd5e1">模型 · 工具 · 预算</text>

    <rect x="330" y="330" width="160" height="82" rx="15" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="410" y="361" text-anchor="middle" font-size="16" font-weight="700" fill="#fde68a">失败分类</text>
    <text x="410" y="385" text-anchor="middle" font-size="12" fill="#cbd5e1">契约层 · 根因 · 证据</text>

    <rect x="604" y="136" width="180" height="82" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="694" y="167" text-anchor="middle" font-size="16" font-weight="700" fill="#a7f3d0">质量门禁</text>
    <text x="694" y="191" text-anchor="middle" font-size="12" fill="#cbd5e1">升级 · 回滚 · 灰度</text>

    <rect x="604" y="330" width="180" height="82" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="694" y="361" text-anchor="middle" font-size="16" font-weight="700" fill="#a7f3d0">专项改进队列</text>
    <text x="694" y="385" text-anchor="middle" font-size="12" fill="#cbd5e1">rubric · 测试 · 协议</text>

    <circle cx="510" cy="274" r="58" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="510" y="264" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">结果仓库</text>
    <text x="510" y="288" text-anchor="middle" font-size="12" fill="#cbd5e1">分数 · 日志</text>
    <text x="510" y="308" text-anchor="middle" font-size="12" fill="#cbd5e1">轨迹 · 版本</text>
  </g>

  <path d="M234 177 L326 177" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M490 177 L600 177" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M234 371 L326 371" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M490 371 L600 371" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M410 218 C430 240, 450 252, 456 266" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M410 330 C430 308, 450 296, 456 282" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M604 371 C558 352, 534 326, 520 330" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M694 330 C716 274, 716 234, 696 222" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <text x="450" y="492" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#64748b">Figure 3. 持续评估把固定评估集和真实项目反馈接入同一条证据链，再驱动质量门禁和专项改进。</text>
</svg>
