<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Coding Mentor 能力模型</title>
  <desc id="desc">展示 Coding Mentor 需要任务契约设计、Rubric 与验收设计、错误诊断反馈协议、迭代治理资产沉淀四项能力。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>

  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Coding Mentor 能力模型</text>
  <text x="450" y="94" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8">Mentor 能力不是 prompt 技巧，而是把工程判断转成可评估、可反馈、可复用的信号</text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="84" y="142" width="302" height="132" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="235" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#bfdbfe">任务契约设计</text>
    <text x="235" y="207" text-anchor="middle" font-size="13" fill="#cbd5e1">目标、非目标、上下文边界</text>
    <text x="235" y="232" text-anchor="middle" font-size="12" fill="#94a3b8">产出：任务卡 · 禁止事项 · 验收入口</text>

    <rect x="514" y="142" width="302" height="132" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="665" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#a7f3d0">Rubric 与验收设计</text>
    <text x="665" y="207" text-anchor="middle" font-size="13" fill="#cbd5e1">功能、边界、性能、安全、维护性</text>
    <text x="665" y="232" text-anchor="middle" font-size="12" fill="#94a3b8">产出：评分表 · 通过标准 · 证据要求</text>

    <rect x="84" y="330" width="302" height="132" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="235" y="364" text-anchor="middle" font-size="18" font-weight="700" fill="#fde68a">错误诊断与反馈协议</text>
    <text x="235" y="395" text-anchor="middle" font-size="13" fill="#cbd5e1">把“不满意”拆成可学习错误类型</text>
    <text x="235" y="420" text-anchor="middle" font-size="12" fill="#94a3b8">产出：错误标签 · 修正建议 · 影响说明</text>

    <rect x="514" y="330" width="302" height="132" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="665" y="364" text-anchor="middle" font-size="18" font-weight="700" fill="#bae6fd">迭代治理与资产沉淀</text>
    <text x="665" y="395" text-anchor="middle" font-size="13" fill="#cbd5e1">让样本、规则和边界随项目演化</text>
    <text x="665" y="420" text-anchor="middle" font-size="12" fill="#94a3b8">产出：eval 种子集 · 示例库 · 治理规则</text>
  </g>

  <circle cx="450" cy="280" r="78" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="450" y="264" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Mentor Signal</text>
  <text x="450" y="291" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">人类判断</text>
  <text x="450" y="313" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">进入工程闭环</text>

  <line x1="386" y1="208" x2="409" y2="238" stroke="#475569" stroke-width="2"/>
  <line x1="514" y1="208" x2="491" y2="238" stroke="#475569" stroke-width="2"/>
  <line x1="386" y1="396" x2="409" y2="322" stroke="#475569" stroke-width="2"/>
  <line x1="514" y1="396" x2="491" y2="322" stroke="#475569" stroke-width="2"/>

  <text x="450" y="500" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#64748b">Figure 3. 四项能力共同把一次 AI 输出转化为可治理的 Mentor 信号。</text>
</svg>
