<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Coding Mentor Capability Model</title>
  <desc id="desc">Demonstrating Coding Mentor requires four capabilities: task contract design, rubric and acceptance design, error diagnosis feedback protocol, and iterative governance asset precipitation.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>

  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Coding Mentor Capability Model</text>
  <text x="450" y="96" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8"><tspan x="450" y="96">Mentor ability converts engineering</tspan><tspan x="450" dy="17.5">judgment into evaluable, feedbackable,</tspan><tspan x="450" dy="17.5">and reusable signals.</tspan></text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="84" y="142" width="302" height="132" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="235" y="192.03" text-anchor="middle" font-size="18" font-weight="700" fill="#bfdbfe"><tspan x="235" y="192.03">Task contract design</tspan></text>
    <text x="235" y="208.53" text-anchor="middle" font-size="12.5" fill="#cbd5e1"><tspan x="235" y="208.53">Target, non-target, context boundaries</tspan></text>
    <text x="235" y="226.03" text-anchor="middle" font-size="13.5" fill="#94a3b8"><tspan x="235" y="226.03">Output: Task Card · Prohibited Matters ·</tspan><tspan x="235" dy="15.93">Check Input</tspan></text>

    <rect x="514" y="142" width="302" height="132" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="665" y="183.7" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0"><tspan x="665" y="183.7">Rubrics and Acceptance Design</tspan></text>
    <text x="665" y="199.7" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="665" y="199.7">Function, boundary, performance, security,</tspan><tspan x="665" dy="14.16">maintainability</tspan></text>
    <text x="665" y="231.36" text-anchor="middle" font-size="13.5" fill="#94a3b8"><tspan x="665" y="231.36">Outputs: Score Sheet · Passing Criteria ·</tspan><tspan x="665" dy="15.93">Evidence Requirements</tspan></text>

    <rect x="84" y="330" width="302" height="132" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="235" y="371.7" text-anchor="middle" font-size="15" font-weight="700" fill="#fde68a"><tspan x="235" y="371.7">Diagnosis protocol</tspan></text>
    <text x="235" y="387.7" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="235" y="387.7">Break down “dissatisfaction” into learnable</tspan><tspan x="235" dy="14.16">error types</tspan></text>
    <text x="235" y="419.37" text-anchor="middle" font-size="13.5" fill="#94a3b8"><tspan x="235" y="419.37">Output: Error label · Recommendation for</tspan><tspan x="235" dy="15.93">correction · Impact statement</tspan></text>

    <rect x="514" y="330" width="302" height="132" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="665" y="362.86" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd"><tspan x="665" y="362.86">Iterative governance and asset</tspan><tspan x="665" dy="17.7">precipitation</tspan></text>
    <text x="665" y="396.56" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="665" y="396.56">Let samples, rules, and boundaries evolve</tspan><tspan x="665" dy="14.16">with the project</tspan></text>
    <text x="665" y="428.22" text-anchor="middle" font-size="13.5" fill="#94a3b8"><tspan x="665" y="428.22">Output: eval seed set · Example library ·</tspan><tspan x="665" dy="15.93">Governance rules</tspan></text>
  </g>

  <circle cx="450" cy="280" r="78" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="450" y="264" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Mentor Signal</text>
  <text x="450" y="291" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">human judgment</text>
  <text x="450" y="313" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">Entering the engineering closed loop</text>

  <line x1="386" y1="208" x2="409" y2="238" stroke="#475569" stroke-width="2"/>
  <line x1="514" y1="208" x2="491" y2="238" stroke="#475569" stroke-width="2"/>
  <line x1="386" y1="396" x2="409" y2="322" stroke="#475569" stroke-width="2"/>
  <line x1="514" y1="396" x2="491" y2="322" stroke="#475569" stroke-width="2"/>


</svg>
