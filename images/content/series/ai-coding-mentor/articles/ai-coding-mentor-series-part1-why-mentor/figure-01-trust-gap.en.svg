<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">The trust gap in AI programming assistants</title>
  <desc id="desc">Demonstrates that there are four gaps between the AI output from looking correct to being trustworthy: mission contract, boundary use case, evaluation evidence, and feedback loop.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>

  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">The trust gap in AI programming assistants</text>
  <text x="450" y="94" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8"><tspan x="450" y="85.5">Professional-looking code is only superficial;</tspan><tspan x="450" dy="17.1">trust requires evidence.</tspan></text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="78" y="142" width="232" height="276" rx="20" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="194" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#bfdbfe">looks correct</text>
    <text x="194" y="207" text-anchor="middle" font-size="13" fill="#cbd5e1">Surface signal output by AI</text>
    <rect x="112" y="238" width="164" height="38" rx="11" fill="#0f172a" stroke="#334155"/>
    <text x="194" y="262.46" text-anchor="middle" font-size="13" fill="#e2e8f0" font-weight="700"><tspan x="194" dy="0">code can run</tspan></text>
    <rect x="112" y="292" width="164" height="38" rx="11" fill="#0f172a" stroke="#334155"/>
    <text x="194" y="316.46" text-anchor="middle" font-size="12" fill="#e2e8f0" font-weight="700"><tspan x="194" dy="0">Clear naming</tspan></text>
    <rect x="112" y="346" width="164" height="38" rx="11" fill="#0f172a" stroke="#334155"/>
    <text x="194" y="370.25" text-anchor="middle" font-size="12" fill="#e2e8f0" font-weight="700"><tspan x="194" dy="0">Explain with evidence</tspan></text>

    <rect x="334" y="142" width="232" height="276" rx="20" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#fde68a">trust gap</text>
    <text x="450" y="207" text-anchor="middle" font-size="13" fill="#cbd5e1"><tspan x="450" y="207">Risks hide in unstated</tspan><tspan x="450" dy="15.86">conditions and edges</tspan></text>
    <circle cx="450" cy="272" r="34" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="284" text-anchor="middle" font-size="34" font-weight="700" fill="#f59e0b">?</text>
    <text x="450" y="334" text-anchor="middle" font-size="12.5" fill="#e2e8f0">Boundary coverage</text>
    <text x="450" y="354" text-anchor="middle" font-size="12" fill="#e2e8f0">Are concurrency and state safe?</text>
    <text x="450" y="374" text-anchor="middle" font-size="12" fill="#e2e8f0">Existing constraints broken?</text>

    <rect x="590" y="142" width="232" height="276" rx="20" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="706" y="180" text-anchor="middle" font-size="18" font-weight="700" fill="#a7f3d0">trustworthy</text>
    <text x="706" y="207" text-anchor="middle" font-size="13" fill="#cbd5e1"><tspan x="706" dy="0">Mentor provides</tspan><tspan x="706" dy="15.86">engineering evidence</tspan></text>
    <rect x="624" y="230" width="164" height="34" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="706" y="252.04" text-anchor="middle" font-size="12" fill="#e2e8f0" font-weight="700"><tspan x="706" dy="0">mission contract</tspan></text>
    <rect x="624" y="278" width="164" height="34" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="706" y="302" text-anchor="middle" font-size="12" fill="#e2e8f0" font-weight="700"><tspan x="706" y="302">Boundary use cases</tspan></text>
    <rect x="624" y="326" width="164" height="34" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="706" y="348.04" text-anchor="middle" font-size="12" fill="#e2e8f0" font-weight="700"><tspan x="706" dy="0">Evaluate the evidence</tspan></text>
    <rect x="624" y="374" width="164" height="34" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="706" y="396.04" text-anchor="middle" font-size="12" fill="#e2e8f0" font-weight="700"><tspan x="706" dy="0">feedback loop</tspan></text>
  </g>

  <line x1="310" y1="280" x2="326" y2="280" stroke="#64748b" stroke-width="2.5"/>
  <line x1="566" y1="280" x2="582" y2="280" stroke="#64748b" stroke-width="2.5"/>

  <text x="450" y="468" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#cbd5e1"><tspan x="450" y="450.9">AI output is only a candidate until contract,</tspan><tspan x="450" dy="17.1">cases, evidence,</tspan><tspan x="450" dy="17.1">and feedback pass.</tspan></text>

</svg>
