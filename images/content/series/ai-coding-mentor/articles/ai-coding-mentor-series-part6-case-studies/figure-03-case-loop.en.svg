<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Unified closed loop from cases to data assets</title>
  <desc id="desc">Demonstrate the closed-loop relationship between real tasks, AI output, human mentor feedback, structured signals, data routing and the next round of improvements.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#10b981"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Unified closed loop from cases to data assets</text>
  <text x="450" y="94" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8"><tspan x="450" y="85.5">Real tasks generate feedback;</tspan><tspan x="450" dy="17.1">routed feedback becomes the next improvement assets.</tspan></text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="80" y="150" width="170" height="78" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="165" y="181" text-anchor="middle" font-size="16" font-weight="700" fill="#bfdbfe">real tasks</text>
    <text x="165" y="193.02" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="165" dy="0">PR · Documentation ·</tspan><tspan x="165" dy="12.98">Teaching · Evaluation</tspan></text>

    <rect x="365" y="120" width="170" height="78" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="450" y="149.49" text-anchor="middle" font-size="15" font-weight="700" fill="#bfdbfe"><tspan x="450" dy="0">AI output</tspan></text>
    <text x="450" y="167.19" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="450" dy="0">Plan · Code · Review ·</tspan><tspan x="450" dy="14.16">Bootstrapping</tspan></text>

    <rect x="650" y="150" width="170" height="78" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="735" y="179.49" text-anchor="middle" font-size="15" font-weight="700" fill="#fde68a"><tspan x="735" dy="0">Mentor Feedback</tspan></text>
    <text x="735" y="197.19" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="735" dy="0">Error Types · Root</tspan><tspan x="735" dy="14.64">Causes · Principles</tspan></text>

    <rect x="650" y="334" width="170" height="78" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="735" y="365" text-anchor="middle" font-size="16" font-weight="700" fill="#a7f3d0">structured signal</text>
    <text x="735" y="377.02" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="735" dy="0">rubric · tag ·</tspan><tspan x="735" dy="12.98">verification evidence</tspan></text>

    <rect x="365" y="364" width="170" height="78" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="450" y="395" text-anchor="middle" font-size="16" font-weight="700" fill="#a7f3d0">Data routing</text>
    <text x="450" y="407.02" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="450" dy="0">Eval · SFT · Knowledge</tspan><tspan x="450" dy="12.98">Base · Discard</tspan></text>

    <rect x="80" y="334" width="170" height="78" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="165" y="361.9" text-anchor="middle" font-size="14" font-weight="700" fill="#bae6fd"><tspan x="165" dy="0">next round of</tspan><tspan x="165" dy="16.52">improvements</tspan></text>
    <text x="165" y="395.94" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="165" dy="0">Model · Prompt · Tools</tspan></text>
  </g>

  <path d="M250 188 C292 160, 322 158, 361 158" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M535 158 C585 158, 612 168, 646 187" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M735 228 C760 270, 760 304, 735 330" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M650 373 C603 397, 577 403, 539 403" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M365 403 C318 403, 288 396, 254 376" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M165 334 C122 277, 126 238, 162 229" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <circle cx="450" cy="280" r="68" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="450" y="268" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Unified closed loop</text>
  <text x="450" y="292" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">The case is not the end</text>
  <text x="450" y="312" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#cbd5e1">But the data entry</text>


</svg>
