<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">AI Coding Mentor Four Types of Case Maps</title>
  <desc id="desc">It shows how the four cases of model selection, feedback protocol, code review and programming education respectively precipitate evaluation tasks, feedback standards, review signals and learning trajectories.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">AI Coding Mentor Four Types of Case Maps</text>
  <text x="450" y="96" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8"><tspan x="450" y="96">Cases turn AI collaboration into evaluable, trainable,</tspan><tspan x="450" dy="17.5">and reusable engineering signals.</tspan></text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="92" y="150" width="270" height="124" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="227" y="195.49" text-anchor="middle" font-size="18" font-weight="700" fill="#bfdbfe"><tspan x="227" y="195.49">Model selection</tspan></text>
    <text x="227" y="211.99" text-anchor="middle" font-size="12.5" fill="#cbd5e1"><tspan x="227" y="211.99">Shift from “which is best” to “task fit”</tspan></text>
    <text x="227" y="229.99" text-anchor="middle" font-size="14" fill="#94a3b8"><tspan x="227" y="229.99">Output: private eval · profile ·</tspan><tspan x="227" dy="16.52">risk boundary</tspan></text>

    <rect x="538" y="150" width="270" height="124" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="673" y="187.16" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0"><tspan x="673" y="187.16">Feedback protocol design</tspan></text>
    <text x="673" y="203.66" text-anchor="middle" font-size="14" fill="#cbd5e1"><tspan x="673" y="203.66">Shift from prompt tweaks to explicit</tspan><tspan x="673" dy="16.52">quality standards</tspan></text>
    <text x="673" y="235.91" text-anchor="middle" font-size="13.5" fill="#94a3b8"><tspan x="673" y="235.91">Precipitation: rubric · Error type ·</tspan><tspan x="673" dy="15.93">Example library</tspan></text>

    <rect x="92" y="330" width="270" height="124" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="227" y="367.16" text-anchor="middle" font-size="15" font-weight="700" fill="#fde68a"><tspan x="227" y="367.16">code review signals</tspan></text>
    <text x="227" y="383.16" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="227" y="383.16">From &quot;AI reviewer&quot; to &quot;review signal</tspan><tspan x="227" dy="14.16">collector&quot;</tspan></text>
    <text x="227" y="415.32" text-anchor="middle" font-size="14" fill="#94a3b8"><tspan x="227" y="415.32">Output: review rules · corrected</tspan><tspan x="227" dy="16.52">samples · preference data</tspan></text>

    <rect x="538" y="330" width="270" height="124" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="673" y="366.62" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd"><tspan x="673" y="366.62">Programming education data</tspan></text>
    <text x="673" y="383.12" text-anchor="middle" font-size="14" fill="#cbd5e1"><tspan x="673" y="383.12">From AI tutor to learning</tspan><tspan x="673" dy="16.52">assessment</tspan></text>
    <text x="673" y="415.87" text-anchor="middle" font-size="14" fill="#94a3b8"><tspan x="673" y="415.87">Output: misconception labels ·</tspan><tspan x="673" dy="16.52">guidance samples · tracks</tspan></text>
  </g>

  <circle cx="450" cy="280" r="78" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="450" y="266" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Unified goal</text>
  <text x="450" y="292" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">judge human beings</text>
  <text x="450" y="314" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">Convert to Mentor signal</text>

  <line x1="362" y1="210" x2="392" y2="242" stroke="#475569" stroke-width="2"/>
  <line x1="538" y1="210" x2="508" y2="242" stroke="#475569" stroke-width="2"/>
  <line x1="362" y1="390" x2="392" y2="318" stroke="#475569" stroke-width="2"/>
  <line x1="538" y1="390" x2="508" y2="318" stroke="#475569" stroke-width="2"/>


</svg>
