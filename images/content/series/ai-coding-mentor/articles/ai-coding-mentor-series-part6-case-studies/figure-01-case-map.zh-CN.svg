<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">AI Coding Mentor 四类案例地图</title>
  <desc id="desc">展示模型选型、反馈协议、代码审查和编程教育四个案例如何分别沉淀评估任务、反馈标准、审查信号和学习轨迹。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">AI Coding Mentor 四类案例地图</text>
  <text x="450" y="94" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8">案例不是工具心得，而是把 AI 协作转化为可评估、可训练、可复用信号的入口</text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="92" y="150" width="270" height="124" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="227" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#bfdbfe">模型选型评估</text>
    <text x="227" y="214" text-anchor="middle" font-size="13" fill="#cbd5e1">从“哪个最好”转向“任务适配度”</text>
    <text x="227" y="240" text-anchor="middle" font-size="12" fill="#94a3b8">沉淀：私有 eval · 能力剖面 · 风险边界</text>

    <rect x="538" y="150" width="270" height="124" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="673" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#a7f3d0">反馈协议设计</text>
    <text x="673" y="214" text-anchor="middle" font-size="13" fill="#cbd5e1">从“改 prompt”转向“显性化质量标准”</text>
    <text x="673" y="240" text-anchor="middle" font-size="12" fill="#94a3b8">沉淀：rubric · 错误类型 · 示例库</text>

    <rect x="92" y="330" width="270" height="124" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="227" y="364" text-anchor="middle" font-size="18" font-weight="700" fill="#fde68a">代码审查信号</text>
    <text x="227" y="394" text-anchor="middle" font-size="13" fill="#cbd5e1">从“AI reviewer”转向“审查信号采集器”</text>
    <text x="227" y="420" text-anchor="middle" font-size="12" fill="#94a3b8">沉淀：review 规则 · 修正样本 · 偏好数据</text>

    <rect x="538" y="330" width="270" height="124" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="673" y="364" text-anchor="middle" font-size="18" font-weight="700" fill="#bae6fd">编程教育数据</text>
    <text x="673" y="394" text-anchor="middle" font-size="13" fill="#cbd5e1">从“AI 助教”转向“学习过程评估”</text>
    <text x="673" y="420" text-anchor="middle" font-size="12" fill="#94a3b8">沉淀：误区标签 · 引导样本 · 学习轨迹</text>
  </g>

  <circle cx="450" cy="280" r="78" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="450" y="266" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">统一目标</text>
  <text x="450" y="292" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">把人类判断</text>
  <text x="450" y="314" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#cbd5e1">转成 Mentor 信号</text>

  <line x1="362" y1="210" x2="392" y2="242" stroke="#475569" stroke-width="2"/>
  <line x1="538" y1="210" x2="508" y2="242" stroke="#475569" stroke-width="2"/>
  <line x1="362" y1="390" x2="392" y2="318" stroke="#475569" stroke-width="2"/>
  <line x1="538" y1="390" x2="508" y2="318" stroke="#475569" stroke-width="2"/>

  <text x="450" y="492" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#64748b">Figure 1. 四个案例共享同一个目标：把 AI 的输出、失败和修正转化为可复用的导师信号。</text>
</svg>
