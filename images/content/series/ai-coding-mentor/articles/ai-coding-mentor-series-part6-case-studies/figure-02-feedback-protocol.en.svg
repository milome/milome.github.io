<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">From prompt word optimization to feedback protocols</title>
  <desc id="desc">Demonstrate the feedback protocol path from AI low-quality output to error diagnosis, quality rubrics, example libraries, verification mechanisms, and data assets.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#60a5fa"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">From prompt word optimization to feedback protocols</text>
  <text x="450" y="96" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8"><tspan x="450" y="96">Prompt is just a consumption method of</tspan><tspan x="450" dy="17.5">the protocol. The real stability is</tspan><tspan x="450" dy="17.5">the task contract, rubric, example and verification.</tspan></text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="70" y="212" width="150" height="100" rx="16" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text x="145" y="244.8" text-anchor="middle" font-size="15" font-weight="700" fill="#fecdd3"><tspan x="145" dy="0">60 points output</tspan></text>
    <text x="145" y="262" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="145" dy="0">Messy structure ·</tspan><tspan x="145" dy="13.57">Missing fields</tspan></text>
    <text x="145" y="292.13" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="145" dy="0">Not runnable</tspan></text>

    <rect x="270" y="134" width="154" height="82" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="347" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#fde68a">Error diagnosis</text>
    <text x="347" y="181.02" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="347" dy="0">Classification · Root</tspan><tspan x="347" dy="12.98">Cause · Evidence</tspan></text>

    <rect x="270" y="242" width="154" height="82" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="347" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0">Quality Rubric</text>
    <text x="347" y="287.36" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="347" dy="0">Qualified·Excell</tspan><tspan x="347" dy="14.64">ent·Rejected</tspan></text>

    <rect x="270" y="350" width="154" height="82" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="347" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd">sample sample</text>
    <text x="347" y="397.02" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="347" dy="0">Good example · Bad</tspan><tspan x="347" dy="12.98">example · Correction</tspan></text>

    <rect x="494" y="188" width="154" height="82" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="571" y="213" text-anchor="middle" font-size="15" font-weight="700" fill="#bfdbfe"><tspan x="571" dy="0">Verification</tspan><tspan x="571" dy="17.7">mechanism</tspan></text>
    <text x="571" y="246.4" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="571" dy="0">Fields · Terminology ·</tspan><tspan x="571" dy="11.8">Security</tspan></text>

    <rect x="494" y="304" width="154" height="82" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="571" y="333.72" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0"><tspan x="571" dy="0">Agreement</tspan><tspan x="571" dy="17.7">consumption</tspan></text>
    <text x="571" y="369.12" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="571" dy="0">Prompt · RAG · Eval</tspan></text>

    <rect x="704" y="212" width="150" height="100" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="779" y="243.91" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0"><tspan x="779" dy="0">Reusable assets</tspan></text>
    <text x="779" y="261.61" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="779" dy="0">Evaluation set ·</tspan><tspan x="779" dy="14.16">Knowledge hub</tspan></text>
    <text x="779" y="292.93" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="779" dy="0">SFT candidate sample</tspan></text>
  </g>

  <path d="M220 262 L266 175" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M220 262 L266 283" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M220 262 L266 391" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M424 175 C458 180, 478 200, 490 226" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M424 283 C454 290, 474 306, 490 335" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M424 391 C464 386, 480 365, 490 348" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M648 229 C680 235, 692 244, 700 260" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M648 345 C684 335, 694 303, 701 278" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>


</svg>
