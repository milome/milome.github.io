<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">从提示词优化到反馈协议</title>
  <desc id="desc">展示从AI低质量输出到错误诊断、质量rubric、示例库、验证机制和数据资产的反馈协议路径。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#60a5fa"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">从提示词优化到反馈协议</text>
  <text x="450" y="94" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#94a3b8">Prompt 只是协议的一种消费方式，真正稳定的是任务契约、rubric、示例和验证</text>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="70" y="212" width="150" height="100" rx="16" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text x="145" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#fecdd3">60 分输出</text>
    <text x="145" y="273" text-anchor="middle" font-size="12" fill="#cbd5e1">结构乱 · 字段漏</text>
    <text x="145" y="294" text-anchor="middle" font-size="12" fill="#cbd5e1">示例不可运行</text>

    <rect x="270" y="134" width="154" height="82" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="347" y="164" text-anchor="middle" font-size="15" font-weight="700" fill="#fde68a">错误诊断</text>
    <text x="347" y="188" text-anchor="middle" font-size="12" fill="#cbd5e1">分类 · 根因 · 证据</text>

    <rect x="270" y="242" width="154" height="82" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="347" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0">质量 Rubric</text>
    <text x="347" y="296" text-anchor="middle" font-size="12" fill="#cbd5e1">合格 · 优秀 · 拒绝</text>

    <rect x="270" y="350" width="154" height="82" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="347" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd">示例样本</text>
    <text x="347" y="404" text-anchor="middle" font-size="12" fill="#cbd5e1">好例 · 坏例 · 修正</text>

    <rect x="494" y="188" width="154" height="82" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="571" y="218" text-anchor="middle" font-size="15" font-weight="700" fill="#bfdbfe">验证机制</text>
    <text x="571" y="242" text-anchor="middle" font-size="12" fill="#cbd5e1">字段 · 术语 · 安全</text>

    <rect x="494" y="304" width="154" height="82" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="571" y="334" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0">协议消费</text>
    <text x="571" y="358" text-anchor="middle" font-size="12" fill="#cbd5e1">Prompt · RAG · Eval</text>

    <rect x="704" y="212" width="150" height="100" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="779" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#a7f3d0">可复用资产</text>
    <text x="779" y="273" text-anchor="middle" font-size="12" fill="#cbd5e1">评估集 · 知识库</text>
    <text x="779" y="294" text-anchor="middle" font-size="12" fill="#cbd5e1">SFT 候选样本</text>
  </g>

  <path d="M220 262 L266 175" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M220 262 L266 283" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M220 262 L266 391" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M424 175 C458 180, 478 200, 490 226" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M424 283 C454 290, 474 306, 490 335" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M424 391 C464 386, 480 365, 490 348" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M648 229 C680 235, 692 244, 700 260" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M648 345 C684 335, 694 303, 701 278" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="450" y="492" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#64748b">Figure 2. 提示词不是终点；错误诊断、rubric、示例和验证机制才是可以长期维护的反馈协议。</text>
</svg>
