<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">企业级治理落地路径</title>
  <desc id="desc">展示企业级微服务治理落地从观测先行、入口治理、东西向治理到全栈韧性的阶段路径。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#64748b"/></marker></defs>
  <rect width="900" height="520" fill="#0f172a"/>
  <rect x="34" y="32" width="832" height="456" rx="24" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">企业级治理落地路径</text>
  <text x="450" y="96" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">A pragmatic landing path from observability to full-stack resilience</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="78" y="180" width="160" height="104" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="158" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#bfdbfe">观测先行</text>
    <text x="158" y="237" text-anchor="middle" font-size="12" fill="#e2e8f0">Observe First</text>
    <text x="158" y="257" text-anchor="middle" font-size="11" fill="#94a3b8">logs / metrics / traces</text>
    <rect x="278" y="180" width="160" height="104" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="358" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd">入口治理</text>
    <text x="358" y="237" text-anchor="middle" font-size="12" fill="#e2e8f0">Ingress Control</text>
    <text x="358" y="257" text-anchor="middle" font-size="11" fill="#94a3b8">auth / routing / canary</text>
    <rect x="478" y="180" width="160" height="104" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="558" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd">东西向治理</text>
    <text x="558" y="237" text-anchor="middle" font-size="12" fill="#e2e8f0">East-West Control</text>
    <text x="558" y="257" text-anchor="middle" font-size="11" fill="#94a3b8">discovery / LB / mTLS</text>
    <rect x="678" y="180" width="160" height="104" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="758" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0">全栈韧性</text>
    <text x="758" y="237" text-anchor="middle" font-size="12" fill="#e2e8f0">Full-stack Resilience</text>
    <text x="758" y="257" text-anchor="middle" font-size="11" fill="#94a3b8">chaos / DR / rollout</text>
    <g stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
      <line x1="238" y1="232" x2="268" y2="232"/>
      <line x1="438" y1="232" x2="468" y2="232"/>
      <line x1="638" y1="232" x2="668" y2="232"/>
    </g>
    <rect x="206" y="358" width="488" height="72" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#fde68a">落地原则 / Landing Principle</text>
    <text x="450" y="411" text-anchor="middle" font-size="12" fill="#cbd5e1">先让系统可见，再逐层加入口、东西向和韧性治理；不要一次性大爆炸改造。</text>
  </g>
</svg>
