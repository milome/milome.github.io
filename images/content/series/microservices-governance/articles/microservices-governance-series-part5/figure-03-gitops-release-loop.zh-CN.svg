<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">GitOps 发布治理闭环</title>
  <desc id="desc">展示 Git 可信源、GitOps 控制器、对账循环、目标环境和治理反馈构成的发布治理闭环。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#64748b"/></marker></defs>
  <rect width="900" height="520" fill="#0f172a"/>
  <rect x="34" y="32" width="832" height="456" rx="24" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">GitOps 发布治理闭环</text>
  <text x="450" y="96" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">Git as desired state, controller as reconciliation engine</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="96" y="194" width="145" height="86" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="169" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#bfdbfe">Git 可信源</text>
    <text x="169" y="248" text-anchor="middle" font-size="12" fill="#e2e8f0">Manifests / Helm</text>
    <rect x="296" y="194" width="145" height="86" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="369" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#bae6fd">控制器</text>
    <text x="369" y="248" text-anchor="middle" font-size="12" fill="#e2e8f0">ArgoCD / Flux</text>
    <rect x="496" y="194" width="145" height="86" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="569" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#bae6fd">对账循环</text>
    <text x="569" y="248" text-anchor="middle" font-size="12" fill="#e2e8f0">Watch / Diff / Sync</text>
    <rect x="696" y="194" width="145" height="86" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="769" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#a7f3d0">目标环境</text>
    <text x="769" y="248" text-anchor="middle" font-size="12" fill="#e2e8f0">Dev / Staging / Prod</text>
    <rect x="348" y="356" width="204" height="72" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="386" text-anchor="middle" font-size="14" font-weight="700" fill="#fde68a">治理反馈</text>
    <text x="450" y="408" text-anchor="middle" font-size="12" fill="#e2e8f0">Monitor / Audit / Rollback</text>
    <g stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
      <line x1="241" y1="237" x2="286" y2="237"/>
      <line x1="441" y1="237" x2="486" y2="237"/>
      <line x1="641" y1="237" x2="686" y2="237"/>
      <path d="M 750 280 C 680 360 585 388 562 392"/>
      <path d="M 348 392 C 240 386 166 340 168 290"/>
    </g>
  </g>
</svg>
