<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">蓝绿部署发布路径</title>
  <desc id="desc">展示蓝绿部署从当前蓝色环境、部署绿色新版本、切换流量到保留回滚路径的过程。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#64748b"/></marker></defs>
  <rect width="900" height="520" fill="#0f172a"/>
  <rect x="34" y="32" width="832" height="456" rx="24" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">蓝绿部署发布路径</text>
  <text x="450" y="96" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">Blue-green deployment keeps rollback cheap by preserving the old runtime</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="78" y="174" width="150" height="104" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="153" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#bfdbfe">蓝色运行</text>
    <text x="153" y="234" text-anchor="middle" font-size="12" fill="#e2e8f0">Blue Current</text>
    <text x="153" y="254" text-anchor="middle" font-size="11" fill="#94a3b8">traffic on v1</text>
    <rect x="282" y="174" width="150" height="104" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="357" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd">绿色部署</text>
    <text x="357" y="234" text-anchor="middle" font-size="12" fill="#e2e8f0">Deploy Green</text>
    <text x="357" y="254" text-anchor="middle" font-size="11" fill="#94a3b8">prepare v2</text>
    <rect x="486" y="174" width="150" height="104" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="561" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0">切换流量</text>
    <text x="561" y="234" text-anchor="middle" font-size="12" fill="#e2e8f0">Switch Traffic</text>
    <text x="561" y="254" text-anchor="middle" font-size="11" fill="#94a3b8">green serves users</text>
    <rect x="690" y="174" width="150" height="104" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="765" y="211" text-anchor="middle" font-size="15" font-weight="700" fill="#fde68a">回滚路径</text>
    <text x="765" y="234" text-anchor="middle" font-size="12" fill="#e2e8f0">Rollback Path</text>
    <text x="765" y="254" text-anchor="middle" font-size="11" fill="#94a3b8">blue retained</text>
    <g stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
      <line x1="228" y1="226" x2="272" y2="226"/>
      <line x1="432" y1="226" x2="476" y2="226"/>
      <line x1="636" y1="226" x2="680" y2="226"/>
    </g>
    <rect x="192" y="354" width="516" height="72" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="450" y="384" text-anchor="middle" font-size="13" font-weight="700" fill="#f8fafc">设计重点 / Design Focus</text>
    <text x="450" y="407" text-anchor="middle" font-size="12" fill="#cbd5e1">环境一致性、数据兼容、流量切换和回滚窗口必须一起设计。</text>
  </g>
</svg>
