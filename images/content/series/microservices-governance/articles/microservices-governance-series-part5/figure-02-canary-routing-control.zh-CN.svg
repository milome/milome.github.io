<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">金丝雀发布路由控制</title>
  <desc id="desc">展示金丝雀发布如何基于来源、权重、Header、用户分组和观测闭环控制新版本风险。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#64748b"/></marker></defs>
  <rect width="900" height="520" fill="#0f172a"/>
  <rect x="34" y="32" width="832" height="456" rx="24" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">金丝雀发布路由控制</text>
  <text x="450" y="96" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">Canary routing combines traffic policy with observable rollback signals</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="88" y="168" width="140" height="88" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="158" y="201" text-anchor="middle" font-size="14" font-weight="700" fill="#bfdbfe">流量来源</text>
    <text x="158" y="223" text-anchor="middle" font-size="12" fill="#e2e8f0">Users / Internal</text>
    <rect x="300" y="168" width="140" height="88" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="370" y="201" text-anchor="middle" font-size="14" font-weight="700" fill="#bae6fd">路由控制</text>
    <text x="370" y="223" text-anchor="middle" font-size="12" fill="#e2e8f0">Gateway / Mesh</text>
    <rect x="540" y="122" width="130" height="70" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="605" y="149" text-anchor="middle" font-size="13" font-weight="700" fill="#bfdbfe">权重</text>
    <text x="605" y="169" text-anchor="middle" font-size="11" fill="#e2e8f0">Weight 95/5</text>
    <rect x="540" y="212" width="130" height="70" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="605" y="239" text-anchor="middle" font-size="13" font-weight="700" fill="#bfdbfe">Header</text>
    <text x="605" y="259" text-anchor="middle" font-size="11" fill="#e2e8f0">Cookie / X-Canary</text>
    <rect x="540" y="302" width="130" height="70" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="605" y="329" text-anchor="middle" font-size="13" font-weight="700" fill="#bfdbfe">用户分组</text>
    <text x="605" y="349" text-anchor="middle" font-size="11" fill="#e2e8f0">Cohort</text>
    <rect x="725" y="212" width="120" height="70" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="785" y="239" text-anchor="middle" font-size="13" font-weight="700" fill="#a7f3d0">观测闭环</text>
    <text x="785" y="259" text-anchor="middle" font-size="11" fill="#e2e8f0">Error / P99 / Biz</text>
    <g stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
      <line x1="228" y1="212" x2="290" y2="212"/>
      <path d="M 440 212 C 488 172 505 158 530 157"/>
      <line x1="440" y1="212" x2="530" y2="247"/>
      <path d="M 440 212 C 490 286 506 328 530 337"/>
      <path d="M 670 247 H 715"/>
    </g>
    <text x="450" y="434" text-anchor="middle" font-size="12" fill="#94a3b8">金丝雀的重点不是“放 5% 流量”，而是让每一次放量都有可回滚证据。</text>
  </g>
</svg>
