<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Canary publishing routing control</title>
  <desc id="desc">Demonstrate how canary release controls new version risks based on source, weight, header, user grouping and observation closed loop.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#64748b"/></marker></defs>
  <rect width="900" height="520" fill="#0f172a"/>
  <rect x="34" y="32" width="832" height="456" rx="24" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Canary publishing routing control</text>
  <text x="450" y="96" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8"><tspan x="450" y="87.5">Canary routing combines traffic policy with</tspan><tspan x="450" dy="17.1">observable rollback signals</tspan></text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="88" y="168" width="140" height="88" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="158" y="201" text-anchor="middle" font-size="14" font-weight="700" fill="#bfdbfe">traffic source</text>
    <text x="158" y="223" text-anchor="middle" font-size="12" fill="#e2e8f0">Users / Internal</text>
    <rect x="300" y="168" width="140" height="88" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="370" y="201" text-anchor="middle" font-size="14" font-weight="700" fill="#bae6fd">routing control</text>
    <text x="370" y="223" text-anchor="middle" font-size="12" fill="#e2e8f0">Gateway / Mesh</text>
    <rect x="540" y="122" width="130" height="70" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="605" y="154.5" text-anchor="middle" font-size="13" font-weight="700" fill="#bfdbfe"><tspan x="605" dy="0">weight</tspan></text>
    <text x="605" y="170.58" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="605" dy="0">Weight 95/5</tspan></text>
    <rect x="540" y="212" width="130" height="70" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="605" y="244.5" text-anchor="middle" font-size="13" font-weight="700" fill="#bfdbfe"><tspan x="605" dy="0">Header</tspan></text>
    <text x="605" y="260.58" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="605" dy="0">Cookie / X-Canary</tspan></text>
    <rect x="540" y="302" width="130" height="70" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="605" y="334.5" text-anchor="middle" font-size="13" font-weight="700" fill="#bfdbfe"><tspan x="605" dy="0">User grouping</tspan></text>
    <text x="605" y="350.58" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="605" dy="0">Cohort</tspan></text>
    <rect x="725" y="212" width="120" height="70" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="785" y="237.62" text-anchor="middle" font-size="12" font-weight="700" fill="#a7f3d0"><tspan x="785" dy="0">Observation</tspan><tspan x="785" dy="13.42">closed loop</tspan></text>
    <text x="785" y="265.58" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="785" dy="0">Error / P99 / Biz</tspan></text>
    <g stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
      <line x1="228" y1="212" x2="290" y2="212"/>
      <path d="M 440 212 C 488 172 505 158 530 157"/>
      <line x1="440" y1="212" x2="530" y2="247"/>
      <path d="M 440 212 C 490 286 506 328 530 337"/>
      <path d="M 670 247 H 715"/>
    </g>
    <text x="450" y="431.86" text-anchor="middle" font-size="14" fill="#94a3b8"><tspan x="450" y="414.8">The point of canary is not to &quot;release 5% of traffic&quot;,</tspan><tspan x="450" dy="17.1">but to ensure that every release has evidence of</tspan><tspan x="450" dy="17.1">rollback.</tspan></text>
  </g>
</svg>
