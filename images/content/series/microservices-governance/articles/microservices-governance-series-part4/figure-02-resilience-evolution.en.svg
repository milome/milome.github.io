<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Evolution of elastic governance technology</title>
  <desc id="desc">Demonstrate the evolution of elastic governance from library-level circuit breaker, lightweight elastic library, grid strategy to adaptive resilience.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#64748b"/></marker></defs>
  <rect width="900" height="520" fill="#0f172a"/>
  <rect x="34" y="32" width="832" height="456" rx="24" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Evolution of elastic governance technology</text>
  <text x="450" y="96" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8"><tspan x="450" y="87.5">Resilience moves from local libraries to</tspan><tspan x="450" dy="17.1">adaptive platform feedback loops</tspan></text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="74" y="180" width="160" height="104" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="154" y="212.14" text-anchor="middle" font-size="15" font-weight="700" fill="#bfdbfe"><tspan x="154" dy="0">Library level</tspan><tspan x="154" dy="17.7">circuit breaker</tspan></text>
    <text x="154" y="247.54" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="154" dy="0">Hystrix Library</tspan></text>
    <text x="154" y="264.7" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="154" dy="0">2015-2018</tspan></text>
    <rect x="278" y="180" width="160" height="104" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="358" y="212.14" text-anchor="middle" font-size="15" font-weight="700" fill="#bfdbfe"><tspan x="358" dy="0">Lightweight and</tspan><tspan x="358" dy="17.7">elastic</tspan></text>
    <text x="358" y="247.54" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="358" dy="0">Resilience4j / Sentinel</tspan></text>
    <text x="358" y="264.7" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="358" dy="0">2018-2020</tspan></text>
    <rect x="482" y="180" width="160" height="104" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="562" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd">Grid elasticity</text>
    <text x="562" y="237" text-anchor="middle" font-size="12" fill="#e2e8f0">Mesh Outlier Policy</text>
    <text x="562" y="257" text-anchor="middle" font-size="12" fill="#94a3b8">2020-2022</text>
    <rect x="686" y="180" width="160" height="104" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="766" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0">adaptive resilience</text>
    <text x="766" y="237" text-anchor="middle" font-size="12" fill="#e2e8f0">eBPF / AI / Chaos</text>
    <text x="766" y="257" text-anchor="middle" font-size="12" fill="#94a3b8">2023-2026</text>
    <g stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
      <line x1="234" y1="232" x2="268" y2="232"/>
      <line x1="438" y1="232" x2="472" y2="232"/>
      <line x1="642" y1="232" x2="676" y2="232"/>
    </g>
    <rect x="230" y="358" width="440" height="64" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="378.99" text-anchor="middle" font-size="12.5" fill="#fde68a"><tspan x="450" y="378.99">Core Shift</tspan></text>
    <text x="450" y="396.99" text-anchor="middle" font-size="14" fill="#cbd5e1"><tspan x="450" y="396.99">From static parameters to runtime</tspan><tspan x="450" dy="16.52">feedback-driven resilience strategies.</tspan></text>
  </g>
</svg>
