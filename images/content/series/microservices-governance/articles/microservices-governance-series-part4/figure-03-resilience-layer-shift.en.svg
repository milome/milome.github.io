<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Resilient governance capabilities sink</title>
  <desc id="desc">Demonstrate that elastic governance capabilities are gradually transferred from application layer strategies to the grid layer, kernel data plane and platform self-healing, and at the same time, the closed-loop calibration threshold is verified.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#64748b"/></marker></defs>
  <rect width="900" height="520" fill="#0f172a"/>
  <rect x="34" y="32" width="832" height="456" rx="24" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Resilient governance capabilities sink</text>
  <text x="450" y="96" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8"><tspan x="450" y="87.5">Resilience capabilities move down while feedback</tspan><tspan x="450" dy="17.1">moves back up</tspan></text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="140" y="142" width="620" height="58" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="450" y="168.92" text-anchor="middle" font-size="14" font-weight="700" fill="#bfdbfe"><tspan x="450" dy="0">Application Layer Strategy/Library Resilience</tspan></text>
    <text x="450" y="185.16" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="450" dy="0">timeout, retry, circuit breaker</tspan></text>
    <rect x="140" y="220" width="620" height="58" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="450" y="246.92" text-anchor="middle" font-size="14" font-weight="700" fill="#bfdbfe"><tspan x="450" dy="0">Mesh Policy</tspan></text>
    <text x="450" y="263.16" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="450" dy="0">outlier detection, mTLS, traffic split</tspan></text>
    <rect x="140" y="298" width="620" height="58" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="450" y="324.92" text-anchor="middle" font-size="14" font-weight="700" fill="#bae6fd"><tspan x="450" dy="0">Kernel Data Plane / eBPF Data Plane</tspan></text>
    <text x="450" y="341.16" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="450" dy="0">low-overhead signal and fast path</tspan></text>
    <rect x="140" y="376" width="620" height="58" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="450" y="402.92" text-anchor="middle" font-size="14" font-weight="700" fill="#a7f3d0"><tspan x="450" dy="0">Platform self-healing/Scheduling Recovery</tspan></text>
    <text x="450" y="419.16" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="450" dy="0">restart, autoscale, failover, rollback</tspan></text>
    <g stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
      <line x1="450" y1="200" x2="450" y2="212" marker-end="none"/>
      <line x1="450" y1="278" x2="450" y2="290" marker-end="none"/>
      <line x1="450" y1="356" x2="450" y2="368" marker-end="none"/>
      <path d="M 780 406 C 830 332 830 224 764 172"/>
    </g>
    <text x="807" y="290" text-anchor="middle" font-size="12" fill="#94a3b8">Validate feedback<br/>Feedback</text>
  </g>
</svg>
