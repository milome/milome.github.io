<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Observable context bridging</title>
  <desc id="desc">Shows how scattered collected logs, indicators, and links can be turned into unified signals that can be used for governance decisions through Trace Context and OpenTelemetry Collector.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#64748b"/></marker></defs>
  <rect width="900" height="520" fill="#0f172a"/>
  <rect x="34" y="32" width="832" height="456" rx="24" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Observable context bridging</text>
  <text x="450" y="93.6" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8"><tspan x="450" y="85">Observability context bridge from fragmented</tspan><tspan x="450" dy="17.1">signals to governance decisions</tspan></text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="78" y="170" width="155" height="104" rx="14" fill="#111827" stroke="#475569" stroke-width="1.5"/>
    <text x="156" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#cbd5e1">dispersion signal</text>
    <text x="156" y="231" text-anchor="middle" font-size="12" fill="#e2e8f0">Fragmented Signals</text>
    <text x="156" y="252" text-anchor="middle" font-size="12" fill="#94a3b8">logs / metrics / traces</text>
    <rect x="278" y="170" width="155" height="104" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="355.5" y="202.14" text-anchor="middle" font-size="15" font-weight="700" fill="#bfdbfe"><tspan x="355.5" dy="0">context</tspan><tspan x="355.5" dy="17.7">propagation</tspan></text>
    <text x="355.5" y="237.54" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="355.5" dy="0">Trace Context</tspan></text>
    <text x="355.5" y="254.7" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="355.5" dy="0">request identity</tspan></text>
    <rect x="478" y="170" width="155" height="104" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="556" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd">unified pipeline</text>
    <text x="556" y="231" text-anchor="middle" font-size="12" fill="#e2e8f0">OTel Collector</text>
    <text x="556" y="252" text-anchor="middle" font-size="12" fill="#94a3b8">normalize and route</text>
    <rect x="678" y="170" width="155" height="104" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="755.5" y="202.14" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0"><tspan x="755.5" dy="0">governance</tspan><tspan x="755.5" dy="17.7">decisions</tspan></text>
    <text x="755.5" y="237.54" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="755.5" dy="0">Governance Decision</tspan></text>
    <text x="755.5" y="254.7" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="755.5" dy="0">SLO / route / rollback</tspan></text>
    <g stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
      <line x1="233" y1="222" x2="268" y2="222"/>
      <line x1="433" y1="222" x2="468" y2="222"/>
      <line x1="633" y1="222" x2="668" y2="222"/>
    </g>
    <rect x="164" y="340" width="572" height="72" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="184.02" y="421.04" text-anchor="start" font-size="13" font-weight="700" fill="#fde68a"><tspan x="184.02" y="421.04">Key Constraint</tspan></text>
    <text x="184.02" y="368" text-anchor="start" font-size="14" fill="#cbd5e1"><tspan x="184.02" y="368">Without stable context, more data will only create</tspan><tspan x="184.02" dy="16.52">more noise; governance must first have relevant</tspan><tspan x="184.02" dy="16.52">signals.</tspan></text>
  </g>
</svg>
