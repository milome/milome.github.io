<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">金丝雀路由策略演进</title>
  <desc id="desc">展示金丝雀发布的路由策略从框架配置到 Mesh CRD，再到 Gateway API HTTPRoute 的演进。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#64748b"/></marker></defs>
  <rect width="900" height="520" fill="#0f172a"/>
  <rect x="34" y="32" width="832" height="456" rx="24" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">金丝雀路由策略演进</text>
  <text x="450" y="96" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">Canary routing moves from framework config to portable platform API</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="96" y="180" width="170" height="104" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="181" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#bfdbfe">框架权重路由</text>
    <text x="181" y="240" text-anchor="middle" font-size="12" fill="#e2e8f0">SCG Code Config</text>
    <rect x="365" y="180" width="170" height="104" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="450" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd">网格策略资源</text>
    <text x="450" y="240" text-anchor="middle" font-size="12" fill="#e2e8f0">Mesh CRD Policy</text>
    <rect x="634" y="180" width="170" height="104" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="719" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0">标准路由 API</text>
    <text x="719" y="240" text-anchor="middle" font-size="12" fill="#e2e8f0">Gateway API HTTPRoute</text>
    <rect x="264" y="352" width="372" height="70" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#fde68a">结果 / Outcome</text>
    <text x="450" y="405" text-anchor="middle" font-size="12" fill="#cbd5e1">策略表达越标准，跨团队迁移和审计成本越低。</text>
    <g stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
      <line x1="266" y1="232" x2="355" y2="232"/>
      <line x1="535" y1="232" x2="624" y2="232"/>
    </g>
  </g>
</svg>
