<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">流量治理技术演进主线</title>
  <desc id="desc">展示流量治理从应用层网关到标准入口资源，再到网格与数据面的演进主线。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#64748b"/></marker></defs>
  <rect width="900" height="520" fill="#0f172a"/>
  <rect x="34" y="32" width="832" height="456" rx="24" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="450" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">流量治理技术演进主线</text>
  <text x="450" y="96" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">Traffic governance moves from framework code to platform APIs and data plane</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="88" y="174" width="176" height="104" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="176" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#bfdbfe">应用层网关</text>
    <text x="176" y="234" text-anchor="middle" font-size="12" fill="#e2e8f0">Application Gateway</text>
    <text x="176" y="255" text-anchor="middle" font-size="11" fill="#94a3b8">2015-2018</text>
    <rect x="362" y="174" width="176" height="104" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="450" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd">标准入口 API</text>
    <text x="450" y="234" text-anchor="middle" font-size="12" fill="#e2e8f0">Ingress to Gateway API</text>
    <text x="450" y="255" text-anchor="middle" font-size="11" fill="#94a3b8">2019-2026</text>
    <rect x="636" y="174" width="176" height="104" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="724" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0">网格与数据面</text>
    <text x="724" y="234" text-anchor="middle" font-size="12" fill="#e2e8f0">Mesh / Ambient / eBPF</text>
    <text x="724" y="255" text-anchor="middle" font-size="11" fill="#94a3b8">2021-2026</text>
    <rect x="234" y="350" width="432" height="72" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="450" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#fde68a">演进判断 / Architecture Judgment</text>
    <text x="450" y="405" text-anchor="middle" font-size="12" fill="#cbd5e1">流量策略持续从业务代码下沉到平台资源与数据面。</text>
    <g stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
      <line x1="264" y1="226" x2="352" y2="226"/>
      <line x1="538" y1="226" x2="626" y2="226"/>
    </g>
  </g>
</svg>
