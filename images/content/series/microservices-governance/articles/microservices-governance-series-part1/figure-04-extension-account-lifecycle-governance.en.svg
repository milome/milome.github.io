<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" width="940" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Expand the account system life cycle management flow</title>
  <desc id="desc">Demonstrate the closed loop of the extended account system from authorization, subscription, settlement, operation to unsubscription, as well as the division of responsibilities between the platform and the application.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="940" height="600" fill="#0f172a"/>
  <rect x="30" y="30" width="880" height="540" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>

  <text x="470" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Account lifecycle governance</text>
  <text x="470" y="92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8"><tspan x="470" y="83.5">Entitlement → Subscription → Onboarding →</tspan><tspan x="470" dy="17.1">Runtime → Offboarding</tspan></text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="70" y="126" width="800" height="56" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="98" y="191.52" text-anchor="start" font-size="14" fill="#bfdbfe"><tspan x="98" y="191.52">Platform layer / Platform</tspan></text>
    <text x="98" y="154" text-anchor="start" font-size="14" fill="#cbd5e1"><tspan x="98" y="154">Authorization, subscription, setup,</tspan><tspan x="98" dy="16.52">unsubscribe triggers, audit control</tspan></text>

    <rect x="70" y="198" width="800" height="56" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="98" y="263.52" text-anchor="start" font-size="14" fill="#a7f3d0"><tspan x="98" y="263.52">Application layer / Application</tspan></text>
    <text x="98" y="226" text-anchor="start" font-size="14" fill="#cbd5e1"><tspan x="98" y="226">Resource init, idempotent callbacks,</tspan><tspan x="98" dy="16.52">runtime access, and data deletion</tspan></text>
  </g>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="76" y="292" width="148" height="136" rx="16" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="150" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#bfdbfe">1 Authorization</text>
    <text x="150" y="344" text-anchor="middle" font-size="12" fill="#cbd5e1">Entitlement</text>
    <text x="150" y="370" text-anchor="middle" font-size="12" fill="#e2e8f0">Platform main account</text>
    <text x="150" y="388" text-anchor="middle" font-size="12" fill="#e2e8f0">Quota / SKU</text>

    <rect x="242" y="292" width="148" height="136" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="316" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#bae6fd"><tspan x="316" dy="0">2 Subscribe</tspan></text>
    <text x="316" y="358.24" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="316" dy="0">Subscription</tspan></text>
    <text x="316" y="374.16" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="316" dy="0">Extend Account → Apply</tspan></text>
    <text x="316" y="390.08" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="316" dy="0">Account Binding</tspan></text>

    <rect x="408" y="292" width="148" height="136" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="482" y="335.04" text-anchor="middle" font-size="14" font-weight="700" fill="#a7f3d0"><tspan x="482" dy="0">3 settle in</tspan></text>
    <text x="482" y="351.28" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="482" dy="0">Onboarding</tspan></text>
    <text x="482" y="367.2" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="482" dy="0">Callback PUT</tspan></text>
    <text x="482" y="383.12" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="482" dy="0">Idempotency +</tspan><tspan x="482" dy="14.16">RefCount</tspan></text>

    <rect x="574" y="292" width="148" height="136" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="648" y="332.92" text-anchor="middle" font-size="14" font-weight="700" fill="#a7f3d0"><tspan x="648" dy="0">4 runtime</tspan></text>
    <text x="648" y="350.44" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="648" dy="0">Runtime</tspan></text>
    <text x="648" y="367.6" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="648" dy="0">Extended account</tspan><tspan x="648" dy="14.16">context</tspan></text>
    <text x="648" y="398.92" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="648" dy="0">Access Control</tspan></text>

    <rect x="740" y="292" width="148" height="136" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="814" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#fde68a">5 Unsubscribe</text>
    <text x="814" y="344" text-anchor="middle" font-size="12" fill="#cbd5e1">Offboarding</text>
    <text x="814" y="370" text-anchor="middle" font-size="12" fill="#e2e8f0">Callback DELETE</text>
    <text x="814" y="388" text-anchor="middle" font-size="12" fill="#e2e8f0">Grace + Data Deletion</text>
  </g>

  <line x1="224" y1="360" x2="242" y2="360" stroke="#64748b" stroke-width="2.5"/>
  <line x1="390" y1="360" x2="408" y2="360" stroke="#64748b" stroke-width="2.5"/>
  <line x1="556" y1="360" x2="574" y2="360" stroke="#64748b" stroke-width="2.5"/>
  <line x1="722" y1="360" x2="740" y2="360" stroke="#64748b" stroke-width="2.5"/>

  <rect x="90" y="456" width="760" height="78" rx="12" fill="#111827" stroke="#475569"/>
  <text x="116.6" y="484.04" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#cbd5e1"><tspan x="116.6" y="484.04">Key constraint: callbacks may repeat, so deletion</tspan><tspan x="116.6" dy="16.52">waits for the last valid subscription.</tspan></text>
  <text x="116.6" y="554.6" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8"><tspan x="116.6" y="554.6">Rule: require idempotency and ref counts</tspan><tspan x="116.6" dy="16.52">before purge.</tspan></text>


</svg>
