<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">The complete life cycle of cf push</title>
  <desc id="desc">Shows how Cloud Foundry completes uploading, building, scheduling, starting, health checking, route registration and receiving traffic after developers execute cf push.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#64748b"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="34" y="32" width="832" height="496" rx="24" fill="#111827" stroke="#334155" stroke-width="1.5"/>

  <text x="450" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">The complete life cycle of cf push</text>
  <text x="450" y="96" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">From source upload to routed runtime traffic</text>

  <g font-family="Segoe UI, Arial, sans-serif" filter="url(#softShadow)">
    <rect x="70" y="140" width="145" height="92" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="142.5" y="166.14" text-anchor="middle" font-size="15" font-weight="700" fill="#bfdbfe"><tspan x="142.5" dy="0">Developer</tspan><tspan x="142.5" dy="17.7">execution</tspan></text>
    <text x="142.5" y="201.54" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="142.5" dy="0">cf push CLI</tspan></text>
    <text x="142.5" y="218.7" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="142.5" dy="0">manifest + source</tspan></text>

    <rect x="268" y="140" width="145" height="92" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="340" y="174" text-anchor="middle" font-size="15" font-weight="700" fill="#bfdbfe">Upload package</text>
    <text x="340" y="196" text-anchor="middle" font-size="12" fill="#e2e8f0">Upload Package</text>
    <text x="340" y="215" text-anchor="middle" font-size="12" fill="#94a3b8">Cloud Controller</text>

    <rect x="466" y="140" width="145" height="92" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="538" y="174" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd">build phase</text>
    <text x="538" y="196" text-anchor="middle" font-size="12" fill="#e2e8f0">Staging</text>
    <text x="538" y="215" text-anchor="middle" font-size="12" fill="#94a3b8">Buildpack to Droplet</text>

    <rect x="664" y="140" width="145" height="92" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="736" y="174" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd">Schedule run</text>
    <text x="736" y="196" text-anchor="middle" font-size="12" fill="#e2e8f0">Diego / Garden</text>
    <text x="736" y="215" text-anchor="middle" font-size="12" fill="#94a3b8">cell placement</text>

    <rect x="664" y="296" width="145" height="92" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="736.5" y="332.38" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0"><tspan x="736.5" dy="0">Start checking</tspan></text>
    <text x="736.5" y="348.78" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="736.5" dy="0">Start and Health</tspan></text>
    <text x="736.5" y="364.7" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="736.5" dy="0">readiness gate</tspan></text>

    <rect x="466" y="296" width="145" height="92" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="538.5" y="332.38" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0"><tspan x="538.5" dy="0">Register route</tspan></text>
    <text x="538.5" y="348.78" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="538.5" dy="0">Register Route</tspan></text>
    <text x="538.5" y="364.7" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="538.5" dy="0">Gorouter table</tspan></text>

    <rect x="268" y="296" width="145" height="92" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="340.5" y="319" text-anchor="middle" font-size="13" font-weight="700" fill="#fde68a"><tspan x="340.5" dy="0">governance</tspan><tspan x="340.5" dy="15.34">constraints</tspan></text>
    <text x="340.5" y="351" text-anchor="middle" font-size="12" fill="#e2e8f0" font-weight="700"><tspan x="340.5" dy="0">Platform Contract</tspan></text>
    <text x="340.5" y="369" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="340.5" dy="0">No default Dockerfile</tspan></text>

    <rect x="70" y="296" width="145" height="92" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="142.5" y="332.38" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0"><tspan x="142.5" dy="0">receive traffic</tspan></text>
    <text x="142.5" y="348.78" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="142.5" dy="0">Serve Traffic</tspan></text>
    <text x="142.5" y="364.7" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="142.5" dy="0">HTTPS to app</tspan></text>
  </g>

  <g stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <line x1="215" y1="186" x2="258" y2="186"/>
    <line x1="413" y1="186" x2="456" y2="186"/>
    <line x1="611" y1="186" x2="654" y2="186"/>
    <path d="M 736 232 V 286"/>
    <line x1="664" y1="342" x2="621" y2="342"/>
    <line x1="466" y1="342" x2="423" y2="342"/>
    <line x1="268" y1="342" x2="225" y2="342"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="88" y="414" width="724" height="100" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="116" y="440" font-size="13" font-weight="700" fill="#f8fafc">Core Reading Conclusion / Key Reading Point</text>
    <text x="116" y="462" font-size="14" fill="#cbd5e1">
      <tspan x="116" y="462">The platform owns build, runtime, health checks,</tspan>
      <tspan x="116" y="480">and routing. The application team owns source,</tspan>
      <tspan x="116" y="498">manifest, and start contract.</tspan>
    </text>
  </g>
</svg>
