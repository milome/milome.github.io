<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Space and the governance boundary of the extended account system</title>
  <desc id="desc">Compare the responsibility boundaries of Cloud Foundry Space as a design-time isolation unit and the extended account system as a run-time isolation unit.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>

  <text x="450" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#f8fafc">Space vs extension account boundary</text>
  <text x="450" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8"><tspan x="450" y="89.5">Design-time isolation and runtime isolation</tspan><tspan x="450" dy="17.1">solve different governance problems.</tspan></text>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="78" y="126" width="350" height="330" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="253" y="158" text-anchor="middle" font-size="18" font-weight="700" fill="#bfdbfe">Space (design-time isolation)</text>
    <text x="253" y="180" text-anchor="middle" font-size="12" fill="#cbd5e1">Build / Deploy / Release</text>

    <rect x="104" y="204" width="298" height="56" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="253" y="229.08" text-anchor="middle" font-size="12" fill="#e2e8f0" font-weight="700"><tspan x="253" dy="0">Environment layering: dev/test/prod</tspan></text>
    <text x="253" y="245" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="253" dy="0">Delivery Pipeline Segmentation</tspan></text>

    <rect x="104" y="276" width="298" height="56" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="253" y="301.08" text-anchor="middle" font-size="12" fill="#e2e8f0" font-weight="700"><tspan x="253" dy="0">Version and release cadence management</tspan></text>
    <text x="253" y="317" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="253" dy="0">Version and Release Cadence</tspan></text>

    <rect x="104" y="348" width="298" height="82" rx="10" fill="#111827" stroke="#475569"/>
    <text x="253" y="378.12" text-anchor="middle" font-size="12" fill="#fde68a"><tspan x="253" dy="0">Not responsible / Not for</tspan></text>
    <text x="253" y="394.04" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="253" dy="0">Runtime data and identity isolation</tspan></text>
    <text x="253" y="409.96" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="253" dy="0">Handled by the account runtime</tspan></text>

    <rect x="472" y="126" width="350" height="330" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="647" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#a7f3d0"><tspan x="647" dy="0">Extension Account Runtime</tspan></text>
    <text x="647" y="180" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="647" dy="0">Data / Identity / Authorization</tspan></text>

    <rect x="498" y="204" width="298" height="56" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="647" y="229.08" text-anchor="middle" font-size="12" fill="#e2e8f0" font-weight="700"><tspan x="647" dy="0">Account context data access boundaries</tspan></text>
    <text x="647" y="245" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="647" dy="0">Extension-account Data Boundary</tspan></text>

    <rect x="498" y="276" width="298" height="56" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="647" y="306" text-anchor="middle" font-size="12" fill="#e2e8f0" font-weight="700"><tspan x="647" dy="0">Identity boundary</tspan></text>
    <text x="647" y="326" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="647" dy="0">Authority scope</tspan></text>

    <rect x="498" y="348" width="298" height="82" rx="10" fill="#111827" stroke="#475569"/>
    <text x="647" y="378.12" text-anchor="middle" font-size="12" fill="#bae6fd"><tspan x="647" dy="0">Apps can be consumed across multiple Spaces</tspan></text>
    <text x="647" y="394.04" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="647" dy="0">Consume apps across spaces</tspan></text>
    <text x="647" y="409.96" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="647" dy="0">Runtime boundary is independent from one space</tspan></text>
  </g>


</svg>
