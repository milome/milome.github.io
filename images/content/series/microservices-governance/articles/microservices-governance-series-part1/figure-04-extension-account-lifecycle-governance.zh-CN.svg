<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" width="940" height="600" role="img" aria-labelledby="title desc">
  <title id="title">扩展账户体系生命周期治理流</title>
  <desc id="desc">展示扩展账户体系从授权、订阅、入驻、运行到退订的闭环，以及平台与应用责任分工。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="940" height="600" fill="#0f172a"/>
  <rect x="30" y="30" width="880" height="540" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>

  <text x="470" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">扩展账户体系生命周期治理流</text>
  <text x="470" y="92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">Entitlement → Subscription → Onboarding → Runtime → Offboarding</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="70" y="126" width="800" height="56" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="130" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#bfdbfe">平台层 / Platform</text>
    <text x="470" y="160" text-anchor="middle" font-size="12" fill="#cbd5e1">授权、订阅、账户编排、退订触发与审计门禁</text>

    <rect x="70" y="198" width="800" height="56" rx="12" fill="#0f172a" stroke="#334155"/>
    <text x="130" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="#a7f3d0">应用层 / Application</text>
    <text x="470" y="232" text-anchor="middle" font-size="12" fill="#cbd5e1">资源初始化、幂等回调、运行时访问控制、数据删除执行</text>
  </g>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="76" y="292" width="148" height="136" rx="16" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="150" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#bfdbfe">1 授权</text>
    <text x="150" y="344" text-anchor="middle" font-size="12" fill="#cbd5e1">Entitlement</text>
    <text x="150" y="370" text-anchor="middle" font-size="11" fill="#e2e8f0">平台主账户</text>
    <text x="150" y="388" text-anchor="middle" font-size="11" fill="#e2e8f0">Quota / SKU</text>

    <rect x="242" y="292" width="148" height="136" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="316" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#bae6fd">2 订阅</text>
    <text x="316" y="344" text-anchor="middle" font-size="12" fill="#cbd5e1">Subscription</text>
    <text x="316" y="370" text-anchor="middle" font-size="11" fill="#e2e8f0">扩展账户 → 应用</text>
    <text x="316" y="388" text-anchor="middle" font-size="11" fill="#e2e8f0">Account Binding</text>

    <rect x="408" y="292" width="148" height="136" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="482" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#a7f3d0">3 入驻</text>
    <text x="482" y="344" text-anchor="middle" font-size="12" fill="#cbd5e1">Onboarding</text>
    <text x="482" y="370" text-anchor="middle" font-size="11" fill="#e2e8f0">Callback PUT</text>
    <text x="482" y="388" text-anchor="middle" font-size="11" fill="#e2e8f0">Idempotency + RefCount</text>

    <rect x="574" y="292" width="148" height="136" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="648" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#a7f3d0">4 运行期</text>
    <text x="648" y="344" text-anchor="middle" font-size="12" fill="#cbd5e1">Runtime</text>
    <text x="648" y="370" text-anchor="middle" font-size="11" fill="#e2e8f0">扩展账户上下文</text>
    <text x="648" y="388" text-anchor="middle" font-size="11" fill="#e2e8f0">Access Control</text>

    <rect x="740" y="292" width="148" height="136" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="814" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#fde68a">5 退订</text>
    <text x="814" y="344" text-anchor="middle" font-size="12" fill="#cbd5e1">Offboarding</text>
    <text x="814" y="370" text-anchor="middle" font-size="11" fill="#e2e8f0">Callback DELETE</text>
    <text x="814" y="388" text-anchor="middle" font-size="11" fill="#e2e8f0">Grace + Data Deletion</text>
  </g>

  <line x1="224" y1="360" x2="242" y2="360" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="360" x2="408" y2="360" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="556" y1="360" x2="574" y2="360" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="722" y1="360" x2="740" y2="360" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="90" y="456" width="760" height="78" rx="12" fill="#111827" stroke="#475569"/>
  <text x="470" y="484" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#cbd5e1">关键治理约束：回调可重复触发，必须幂等；只有最后一个有效订阅结束后，才允许做账户级完全删除。</text>
  <text x="470" y="506" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8">Key Rule: callbacks can repeat; enforce idempotency and reference count before full purge.</text>

  <text x="470" y="548" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Figure 3. 扩展账户体系治理不是一次“建账户”，而是一条可审计的生命周期流水线。</text>
</svg>
