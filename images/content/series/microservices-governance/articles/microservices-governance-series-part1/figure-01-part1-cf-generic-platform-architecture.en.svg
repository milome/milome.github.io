<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Common enterprise-level Cloud Foundry platform operating architecture</title>
  <desc id="desc">Demonstrates a common layered architecture in which external clients enter the Cloud Foundry runtime through the platform portal, application portal, and identity service, and access the data ecosystem according to the extended account system.</desc>
  <defs>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#64748b"/>
    </marker>
    <style>
      .font { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 23px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-size: 13px; fill: #94a3b8; }
      .h2 { font-size: 16px; font-weight: 700; }
      .txt { font-size: 12px; fill: #e2e8f0; }
      .muted { font-size: 12px; fill: #94a3b8; }
      .caption { font-size: 12px; fill: #64748b; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; }
      .module { fill: #1e293b; stroke: #334155; stroke-width: 1.5; }
      .entry { fill: #1e293b; stroke: #60a5fa; stroke-width: 2; }
      .runtime { fill: #1e293b; stroke: #10b981; stroke-width: 2; }
      .identity { fill: #0f172a; stroke: #f59e0b; stroke-width: 2; }
      .feedback { fill: #0f172a; stroke: #38bdf8; stroke-width: 2; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .weakline { fill: none; stroke: #475569; stroke-width: 1.5; stroke-dasharray: 6 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="900" height="560" fill="#0f172a"/>
  <rect x="32" y="32" width="836" height="496" rx="22" class="panel"/>

  <text x="450" y="66" text-anchor="middle" class="font title">Cloud Foundry platform architecture</text>
  <text x="450" y="92" text-anchor="middle" class="font subtitle" font-size="14"><tspan x="450" y="83.5">Entry Routing / Identity / Runtime /</tspan><tspan x="450" dy="17.1">Extension-account Data Boundary</tspan></text>

  <g filter="url(#shadow)" class="font">
    <rect x="72" y="142" width="160" height="116" rx="16" class="entry"/>
    <text x="152" y="174" text-anchor="middle" class="h2" fill="#bfdbfe">external client</text>
    <text x="152" y="198" text-anchor="middle" class="txt">Web / Mobile / Device</text>
    <text x="152" y="220" text-anchor="middle" class="muted">HTTPS + OAuth2/OIDC</text>

    <rect x="286" y="122" width="542" height="346" rx="20" class="panel"/>
    <text x="310" y="148" class="h2" fill="#f8fafc">Cloud Foundry Platform Boundary</text>
    <text x="310" y="182" class="muted" style="font-size:14px"><tspan x="310" y="173.4">Platform owns routing, scheduling, runtime,</tspan><tspan x="310" dy="17.1">and observability entry.</tspan></text>

    <rect x="316" y="204" width="482" height="54" rx="12" class="entry"/>
    <text x="557" y="229.76" text-anchor="middle" class="h2" fill="#bfdbfe" font-size="16" font-weight="700"><tspan x="557" dy="0">CF Gorouter</tspan></text>
    <text x="557" y="246.32" text-anchor="middle" class="muted" font-size="12"><tspan x="557" dy="0">Routing, TLS, load balancing</tspan></text>

    <rect x="316" y="286" width="282" height="74" rx="12" class="feedback"/>
    <text x="457" y="321.76" text-anchor="middle" class="h2" fill="#bae6fd" font-size="16" font-weight="700"><tspan x="457" dy="0">Application Router</tspan></text>
    <text x="457" y="338.32" text-anchor="middle" class="txt" font-size="12"><tspan x="457" dy="0">Resolve account context</tspan></text>

    <rect x="626" y="286" width="172" height="74" rx="12" class="identity"/>
    <text x="712" y="313" text-anchor="middle" class="h2" fill="#fde68a">Identity service</text>
    <text x="712" y="335" text-anchor="middle" class="txt">OAuth2/OIDC</text>
    <text x="712" y="352" text-anchor="middle" class="muted">JWT + Scopes</text>

    <rect x="316" y="392" width="482" height="54" rx="12" class="runtime"/>
    <text x="557" y="417.76" text-anchor="middle" class="h2" fill="#a7f3d0" font-size="16" font-weight="700"><tspan x="557" dy="0">Runtime Cells / Workloads</tspan></text>
    <text x="557" y="434.32" text-anchor="middle" class="muted" font-size="12"><tspan x="557" dy="0">Services / jobs / policy checks</tspan></text>
  </g>

  <g class="font">
    <rect x="120" y="314" width="112" height="54" rx="12" class="module"/>
    <text x="176" y="332.39" text-anchor="middle" class="txt" font-size="12"><tspan x="176" dy="0">Audit and</tspan><tspan x="176" dy="11.8">Observation</tspan></text>
    <text x="176" y="357.99" text-anchor="middle" class="muted" font-size="12"><tspan x="176" dy="0">Telemetry</tspan></text>

    <rect x="286" y="478" width="542" height="42" rx="13" fill="#111827" stroke="#475569" stroke-width="1.2"/>
    <text x="557" y="494" text-anchor="middle" class="caption" style="font-size:12.5px">
      <tspan x="557" y="494">Account-scoped boundary:</tspan>
      <tspan x="557" dy="15">Relational DB · Object Storage · Event Bus</tspan>
    </text>
  </g>

  <path d="M232 200 L316 230" class="line"/>
  <path d="M557 258 L557 286" class="line" style="marker-end:none"/>
  <path d="M598 323 L626 323" class="weakline" style="marker-end:none"/>
  <path d="M457 360 L457 392" class="line"/>
  <path d="M712 360 L600 392" class="weakline"/>
  <path d="M557 446 L557 478" class="line"/>
  <path d="M316 420 L232 344" class="weakline"/>


</svg>
