<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" width="940" height="600" role="img" aria-labelledby="title desc">
  <title id="title">扩展账户体系数据隔离决策矩阵</title>
  <desc id="desc">展示在安全、成本与可运维性约束下如何选择扩展账户体系数据隔离策略。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="940" height="600" fill="#0f172a"/>
  <rect x="30" y="30" width="880" height="540" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>

  <text x="470" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">扩展账户体系数据隔离决策矩阵</text>
  <text x="470" y="92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">Security Boundary vs Cost and Operability</text>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="76" y="132" width="260" height="362" rx="18" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="206" y="164" text-anchor="middle" font-size="16" font-weight="700" fill="#fde68a">输入约束 / Inputs</text>
    <text x="206" y="194" text-anchor="middle" font-size="12" fill="#cbd5e1">合规等级、恢复目标、数据体量、账户规模</text>

    <rect x="100" y="218" width="212" height="54" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="206" y="241" text-anchor="middle" font-size="12" fill="#e2e8f0">高合规 / High Compliance</text>
    <text x="206" y="259" text-anchor="middle" font-size="11" fill="#94a3b8">金融、医疗、主权数据等场景</text>

    <rect x="100" y="286" width="212" height="54" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="206" y="309" text-anchor="middle" font-size="12" fill="#e2e8f0">恢复粒度 / Recovery Granularity</text>
    <text x="206" y="327" text-anchor="middle" font-size="11" fill="#94a3b8">是否要求账户级恢复</text>

    <rect x="100" y="354" width="212" height="54" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="206" y="377" text-anchor="middle" font-size="12" fill="#e2e8f0">成本约束 / Cost Constraint</text>
    <text x="206" y="395" text-anchor="middle" font-size="11" fill="#94a3b8">极小账户与低风险场景</text>

    <rect x="100" y="422" width="212" height="54" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="206" y="445" text-anchor="middle" font-size="12" fill="#e2e8f0">运维能力 / Ops Maturity</text>
    <text x="206" y="463" text-anchor="middle" font-size="11" fill="#94a3b8">自动化升级与审计能力</text>

    <rect x="368" y="132" width="496" height="168" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="616" y="164" text-anchor="middle" font-size="16" font-weight="700" fill="#a7f3d0">默认策略 / Default Strategy</text>
    <text x="616" y="192" text-anchor="middle" font-size="12" fill="#cbd5e1">按扩展账户体系划分独立隔离单元（container / schema）优先</text>
    <text x="616" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1">Extension-account isolated data domain as baseline</text>
    <text x="616" y="242" text-anchor="middle" font-size="11" fill="#94a3b8">优势：边界清晰、审计可追溯、按账户恢复与迁移更可控</text>

    <rect x="368" y="326" width="236" height="168" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="486" y="358" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd">例外共享（受控）</text>
    <text x="486" y="382" text-anchor="middle" font-size="12" fill="#cbd5e1">Shared Schema + Account Column</text>
    <text x="486" y="406" text-anchor="middle" font-size="11" fill="#e2e8f0">仅在低风险、低数据量、</text>
    <text x="486" y="424" text-anchor="middle" font-size="11" fill="#e2e8f0">且有强审计保障时允许</text>
    <text x="486" y="448" text-anchor="middle" font-size="11" fill="#94a3b8">Require strict guardrails</text>

    <rect x="628" y="326" width="236" height="168" rx="18" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="746" y="358" text-anchor="middle" font-size="15" font-weight="700" fill="#fde68a">禁止模式</text>
    <text x="746" y="382" text-anchor="middle" font-size="12" fill="#cbd5e1">无账户边界共享数据域</text>
    <text x="746" y="406" text-anchor="middle" font-size="11" fill="#e2e8f0">No account-scoped guard</text>
    <text x="746" y="424" text-anchor="middle" font-size="11" fill="#e2e8f0">No deletion accountability</text>
    <text x="746" y="448" text-anchor="middle" font-size="11" fill="#94a3b8">不可满足合规与审计</text>
  </g>

  <line x1="336" y1="236" x2="368" y2="216" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="336" y1="388" x2="368" y2="410" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="604" y1="410" x2="628" y2="410" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="470" y="544" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Figure 5. 先定义默认隔离等级，再制度化“共享例外准入条件”。</text>
</svg>
