<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" width="940" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Expanded account system data isolation decision matrix</title>
  <desc id="desc">Demonstrates how to choose an extended account system data isolation strategy under the constraints of security, cost and operability.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="940" height="600" fill="#0f172a"/>
  <rect x="30" y="30" width="880" height="540" rx="22" fill="#111827" stroke="#334155" stroke-width="1.5"/>

  <text x="470" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Expanded account system data isolation decision matrix</text>
  <text x="470" y="92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">Security Boundary vs Cost and Operability</text>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="76" y="132" width="260" height="362" rx="18" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="206" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#fde68a"><tspan x="206" dy="0">Input constraints</tspan></text>
    <text x="206" y="186" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="206" dy="0">Compliance, recovery,</tspan><tspan x="206" dy="14.16">volume, account size</tspan></text>

    <rect x="100" y="218" width="212" height="54" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="206" y="238" text-anchor="middle" font-size="13" fill="#e2e8f0" font-weight="700"><tspan x="206" dy="0">High Compliance</tspan></text>
    <text x="206" y="256" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="206" dy="0">Regulated data</tspan></text>

    <rect x="100" y="286" width="212" height="54" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="206" y="306" text-anchor="middle" font-size="13" fill="#e2e8f0" font-weight="700"><tspan x="206" dy="0">Recovery Granularity</tspan></text>
    <text x="206" y="324" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="206" dy="0">Account-level recovery</tspan></text>

    <rect x="100" y="354" width="212" height="54" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="206" y="376" text-anchor="middle" font-size="13" fill="#e2e8f0" font-weight="700"><tspan x="206" dy="0">Cost Constraint</tspan></text>
    <text x="206" y="396.32" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="206" dy="0">Small low-risk accounts</tspan></text>

    <rect x="100" y="422" width="212" height="54" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="206" y="444" text-anchor="middle" font-size="13" fill="#e2e8f0" font-weight="700"><tspan x="206" dy="0">Ops maturity</tspan></text>
    <text x="206" y="462" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="206" dy="0">Upgrade/audit automation</tspan></text>

    <rect x="368" y="132" width="496" height="168" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="616" y="177.72" text-anchor="middle" font-size="15" font-weight="700" fill="#a7f3d0"><tspan x="616" y="177.72">Default Strategy</tspan></text>
    <text x="616" y="193.72" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="616" y="193.72">Prefer account-scoped container/schema</tspan><tspan x="616" dy="14.16">isolation</tspan></text>
    <text x="616" y="223.88" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="616" y="223.88">Extension-account isolated data domain as</tspan><tspan x="616" dy="14.16">baseline</tspan></text>
    <text x="616" y="254.53" text-anchor="middle" font-size="12.5" fill="#94a3b8"><tspan x="616" y="254.53">Clear boundaries, traceable audits,</tspan><tspan x="616" dy="14.75">account-level recovery</tspan></text>

    <rect x="368" y="326" width="236" height="168" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="486" y="377.5" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd"><tspan x="486" dy="0">Exception sharing (controlled)</tspan></text>
    <text x="486" y="393.9" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="486" dy="0">Shared Schema + Account Column</tspan></text>
    <text x="486" y="409.82" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="486" dy="0">Only in low risk, low data volume,</tspan></text>
    <text x="486" y="425.74" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="486" dy="0">It is allowed when there is strong</tspan><tspan x="486" dy="14.16">audit guarantee</tspan></text>
    <text x="486" y="455.58" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="486" dy="0">Require strict guardrails</tspan></text>

    <rect x="628" y="326" width="236" height="168" rx="18" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="746" y="384.46" text-anchor="middle" font-size="15" font-weight="700" fill="#fde68a"><tspan x="746" dy="0">Disabled mode</tspan></text>
    <text x="746" y="400.86" text-anchor="middle" font-size="12" fill="#cbd5e1"><tspan x="746" dy="0">No account boundary shared data domain</tspan></text>
    <text x="746" y="416.78" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="746" dy="0">No account-scoped guard</tspan></text>
    <text x="746" y="432.7" text-anchor="middle" font-size="12" fill="#e2e8f0"><tspan x="746" dy="0">No deletion accountability</tspan></text>
    <text x="746" y="448.62" text-anchor="middle" font-size="12" fill="#94a3b8"><tspan x="746" dy="0">Unable to meet compliance and audit</tspan></text>
  </g>

  <line x1="336" y1="236" x2="368" y2="216" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="336" y1="388" x2="368" y2="410" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="604" y1="410" x2="628" y2="410" stroke="#64748b" stroke-width="2.5"/>


</svg>
