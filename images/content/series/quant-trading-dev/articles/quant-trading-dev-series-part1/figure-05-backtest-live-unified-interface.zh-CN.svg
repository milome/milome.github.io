    <text x="154" y="316" fill="#94a3b8" font-size="18">Backtest Adapter</text>
    <text x="154" y="474" font-size="23" font-weight="700">实盘事件流</text>
    <text x="154" y="508" fill="#94a3b8" font-size="18">Live Adapter</text>
    <text x="544" y="350" font-size="25" font-weight="700">UnifiedStrategy</text>
    <text x="544" y="386" fill="#94a3b8" font-size="18">on_market_event(event)</text>
    <text x="946" y="282" font-size="23" font-weight="700">模拟撮合</text>
    <text x="946" y="316" fill="#94a3b8" font-size="18">Simulated Broker</text>
    <text x="946" y="474" font-size="23" font-weight="700">真实委托</text>
    <text x="946" y="508" fill="#94a3b8" font-size="18">Gateway Execution</text>
