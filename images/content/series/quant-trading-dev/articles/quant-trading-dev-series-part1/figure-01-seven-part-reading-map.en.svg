  <text x="640" y="137" fill="#94a3b8" font-size="14" font-family="Arial" text-anchor="middle"><tspan x="640" y="137">Read Part1 -> Part2 -> Part3 -> Part4 -> Part5 -> Part6 -> Part7 in order,</tspan><tspan x="640" dy="17.5">then refer back to Part2/Part3 when diagnosing specific engineering risks.</tspan></text>
