<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" data-figure-id="FIG-001" data-visual-pattern="timeline 风格">
  <title id="title">Seven part reading map</title>
  <desc id="desc">A seven-part reading map ordered from Part1 to Part7.</desc>
