<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" data-figure-id="FIG-004" data-visual-pattern="flowchart">
  <title id="title">Event Collaboration Path</title>
  <desc id="desc">A forward event collaboration path from market events to data service, consistent view, strategy, risk, execution, and monitoring.</desc>
  <defs>
    <marker id="arrow-forward" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#60a5fa"/>
    </marker>
  </defs>

  <rect width="1280" height="720" rx="36" fill="#0f172a"/>
  <rect x="54" y="50" width="1172" height="620" rx="30" fill="#111827" stroke="#334155" stroke-width="2"/>

  <text x="92" y="108" fill="#f8fafc" font-family="Arial" font-size="32" font-weight="700">Event Collaboration Path</text>
  <text x="92" y="144" fill="#94a3b8" font-family="Arial" font-size="18">Business moves forward through standard events; strategies consume consistent data views</text>

  <g fill="#1e293b" stroke="#475569" stroke-width="2" font-family="Arial">
    <rect x="80" y="250" width="150" height="90" rx="18"/>
    <rect x="274" y="250" width="150" height="90" rx="18"/>
    <rect x="468" y="250" width="150" height="90" rx="18"/>
    <rect x="662" y="250" width="150" height="90" rx="18"/>
    <rect x="856" y="250" width="150" height="90" rx="18"/>
    <rect x="1050" y="250" width="150" height="90" rx="18"/>
  </g>

  <g font-family="Arial" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">
    <text x="155" y="286">Market Event</text>
    <text x="155" y="312" fill="#94a3b8" font-size="16">Tick / Bar</text>

    <text x="349" y="286">Data Service</text>
    <text x="349" y="312" fill="#94a3b8" font-size="16">Data Rules</text>

    <text x="543" y="286">Consistent View</text>
    <text x="543" y="312" fill="#94a3b8" font-size="16">Data Input</text>

    <text x="737" y="286">Strategy</text>
    <text x="737" y="312" fill="#94a3b8" font-size="16">Signal</text>

    <text x="931" y="286">Risk Gate</text>
    <text x="931" y="312" fill="#94a3b8" font-size="16">Instruction</text>

    <text x="1125" y="286">Execution</text>
    <text x="1125" y="312" fill="#94a3b8" font-size="16">Order / Trade</text>
  </g>

  <g stroke-width="4" fill="none" stroke-linecap="round" marker-end="url(#arrow-forward)">
    <line x1="230" y1="295" x2="274" y2="295" stroke="#60a5fa"/>
    <line x1="424" y1="295" x2="468" y2="295" stroke="#38bdf8"/>
    <line x1="618" y1="295" x2="662" y2="295" stroke="#10b981"/>
    <line x1="812" y1="295" x2="856" y2="295" stroke="#f59e0b"/>
    <line x1="1006" y1="295" x2="1050" y2="295" stroke="#60a5fa"/>
  </g>

  <g fill="#1e293b" stroke="#475569" stroke-width="2" font-family="Arial">
    <rect x="260" y="430" width="760" height="110" rx="22"/>
  </g>
  <text x="640" y="474" fill="#f8fafc" font-family="Arial" font-size="22" font-weight="700" text-anchor="middle">Monitoring subscribes to state; it does not drive business backward</text>
  <text x="640" y="506" fill="#94a3b8" font-family="Arial" font-size="18" text-anchor="middle">Monitor / Audit subscribe status events only</text>

  <rect x="106" y="585" width="1074" height="70" rx="20" fill="#1e293b" stroke="#334155"/>
  <text x="640" y="628" fill="#cbd5e1" font-family="Arial" font-size="18" text-anchor="middle">Design principle: collaborate through event contracts; direct cross-module access is high-risk coupling.</text>
</svg>
