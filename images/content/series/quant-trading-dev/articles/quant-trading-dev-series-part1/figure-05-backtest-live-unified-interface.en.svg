  <rect x="418" y="552" width="444" height="54" rx="18" fill="#1e293b" stroke="#334155"/>
  <text x="640" y="577.08" fill="#cbd5e1" font-family="Arial" font-size="14" text-anchor="middle"><tspan x="640" y="568.5">Testing, backtesting, and actual review build</tspan><tspan x="640" dy="17.1">evidence around the same event protocol.</tspan></text>
</svg>
