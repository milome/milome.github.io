<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" data-figure-id="FIG-006" data-visual-pattern="before-after comparison 风格">
  <title>多线程单进程与多进程失败域对比</title>
  <desc>对比重构前多个线程竞争同一个 Python 进程和重构后 UI、计算、录制、回测被拆成独立进程失败域。</desc>
  <rect width="1200" height="760" rx="32" fill="#0f172a"/>
  <rect x="48" y="46" width="1104" height="668" rx="28" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="86" y="108" fill="#f8fafc" font-size="34" font-weight="700">多线程单进程 vs 多进程失败域</text>
  <text x="86" y="150" fill="#cbd5e1" font-size="22">第五次重构的关键不是“并行更多”，而是把 UI、计算和录制从同一个失败域中拆开。</text>

  <rect x="86" y="214" width="492" height="404" rx="24" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
  <text x="124" y="264" fill="#fde68a" font-size="27" font-weight="700">重构前：一个进程内堆线程</text>
  <rect x="154" y="314" width="356" height="212" rx="18" fill="#111827" stroke="#475569" stroke-width="2"/>
  <text x="224" y="360" fill="#f8fafc" font-size="24" font-weight="700">Python Main Process</text>
  <g font-size="20">
    <rect x="188" y="396" width="120" height="46" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="220" y="426" fill="#bfdbfe">UI</text>
    <rect x="356" y="396" width="120" height="46" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="380" y="426" fill="#a7f3d0">指标线程</text>
    <rect x="188" y="462" width="120" height="46" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="212" y="492" fill="#bae6fd">录制线程</text>
    <rect x="356" y="462" width="120" height="46" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="392" y="492" fill="#fde68a">回测</text>
  </g>
  <text x="144" y="566" fill="#94a3b8" font-size="19">
    <tspan x="144" dy="0">问题：GIL、事件循环和 I/O</tspan>
    <tspan x="144" dy="28">共享同一进程，卡顿难定位。</tspan>
  </text>

  <rect x="622" y="214" width="492" height="404" rx="24" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
  <text x="660" y="264" fill="#a7f3d0" font-size="27" font-weight="700">重构后：拆成独立失败域</text>
  <g font-size="20" font-weight="700">
    <rect x="666" y="318" width="164" height="70" rx="14" fill="#111827" stroke="#60a5fa" stroke-width="2"/>
    <text x="718" y="360" fill="#bfdbfe">UI 进程</text>
    <rect x="906" y="318" width="164" height="70" rx="14" fill="#111827" stroke="#10b981" stroke-width="2"/>
    <text x="938" y="360" fill="#a7f3d0">计算进程</text>
    <rect x="666" y="452" width="164" height="70" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <text x="702" y="494" fill="#bae6fd">录制进程</text>
    <rect x="906" y="452" width="164" height="70" rx="14" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <text x="946" y="494" fill="#fde68a">回测进程</text>
  </g>
  <rect x="782" y="398" width="176" height="66" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="804" y="426" fill="#e2e8f0" font-size="20" font-weight="700">IPC control</text>
  <text x="806" y="452" fill="#e2e8f0" font-size="20" font-weight="700">shared_memory</text>
  <g stroke="#64748b" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M748 388 L748 408 L782 408"/>
    <path d="M988 388 L988 408 L958 408"/>
    <path d="M748 452 L782 452"/>
    <path d="M988 452 L958 452"/>
  </g>
  <text x="670" y="566" fill="#94a3b8" font-size="19">
    <tspan x="670" dy="0">收益：子进程失败可降级、重启、关联日志；</tspan>
    <tspan x="670" dy="28">主界面只处理控制信号和结果读取。</tspan>
  </text>
</svg>
