<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" data-figure-id="FIG-006" data-visual-pattern="before-after comparison 风格">
  <title>Comparison of multi-threaded single process and multi-process failure domains</title>
  <desc>Compare multiple threads competing for the same Python process before reconstruction and after reconstruction, UI, calculation, recording, and backtesting are split into independent process failure domains.</desc>
  <rect width="1200" height="760" rx="32" fill="#0f172a"/>
  <rect x="48" y="46" width="1104" height="668" rx="28" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="86" y="108" fill="#f8fafc" font-size="34" font-weight="700">Process split and failure domains</text>
  <text x="600" y="139.09" fill="#cbd5e1" font-size="14" text-anchor="middle"><tspan x="600" y="139.09">Refactoring separates UI, computation,</tspan><tspan x="600" dy="17.5">and recording into independent domains.</tspan></text>

  <rect x="86" y="214" width="492" height="404" rx="24" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
  <text x="124" y="264" fill="#fde68a" font-size="27" font-weight="700"><tspan x="124" dy="0">Before refactoring: an</tspan><tspan x="124" dy="32.94">in-process heap thread</tspan></text>
  <rect x="154" y="314" width="356" height="212" rx="18" fill="#111827" stroke="#475569" stroke-width="2"/>
  <text x="224" y="360" fill="#f8fafc" font-size="24" font-weight="700">Python Main Process</text>
  <g font-size="20">
    <rect x="188" y="396" width="120" height="46" rx="12" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="220" y="426" fill="#bfdbfe">UI</text>
    <rect x="356" y="396" width="120" height="46" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="416" y="425.09" fill="#a7f3d0" font-size="14.5" text-anchor="middle"><tspan x="416" dy="0">indicator thread</tspan></text>
    <rect x="188" y="462" width="120" height="46" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="248" y="491.09" fill="#bae6fd" font-size="14.5" text-anchor="middle"><tspan x="248" dy="0">Recording thread</tspan></text>
    <rect x="356" y="462" width="120" height="46" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="392" y="492" fill="#fde68a">backtest</text>
  </g>
  <text x="144" y="549.64" fill="#94a3b8" font-size="19"><tspan x="144" dy="0">Issue: GIL, event loop, and I/O share one</tspan><tspan x="144" dy="23.18">process, making lag hard to locate.</tspan></text>

  <rect x="622" y="214" width="492" height="404" rx="24" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
  <text x="660" y="264" fill="#a7f3d0" font-size="27" font-weight="700"><tspan x="660" dy="0">After reconstruction: split</tspan><tspan x="660" dy="32.94">into independent failure</tspan><tspan x="660" dy="32.94">domains</tspan></text>
  <g font-size="20" font-weight="700">
    <rect x="666" y="318" width="164" height="70" rx="14" fill="#111827" stroke="#60a5fa" stroke-width="2"/>
    <text x="718" y="360" fill="#bfdbfe">UI process</text>
    <rect x="906" y="318" width="164" height="70" rx="14" fill="#111827" stroke="#10b981" stroke-width="2"/>
    <text x="938" y="360" fill="#a7f3d0" font-size="12"><tspan x="938" dy="0">calculation process</tspan></text>
    <rect x="666" y="452" width="164" height="70" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <text x="748" y="483.88" fill="#bae6fd" font-size="19.5" text-anchor="middle" font-weight="700"><tspan x="748" dy="0">Recording</tspan><tspan x="748" dy="23.01">process</tspan></text>
    <rect x="906" y="452" width="164" height="70" rx="14" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
    <text x="946" y="494" fill="#fde68a" font-size="12"><tspan x="946" dy="0">Backtesting process</tspan></text>
  </g>
  <rect x="782" y="398" width="176" height="66" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="790" y="428.57" fill="#e2e8f0" font-size="15" font-weight="700" text-anchor="start"><tspan x="790" dy="0">IPC control</tspan></text>
  <text x="790" y="446.27" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="start"><tspan x="790" dy="0">shared_memory</tspan></text>
  <g stroke="#64748b" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M748 388 L748 408 L782 408"/>
    <path d="M988 388 L988 408 L958 408"/>
    <path d="M748 452 L782 452"/>
    <path d="M988 452 L958 452"/>
  </g>
  <text x="670" y="526.46" fill="#94a3b8" font-size="19"><tspan x="670" dy="0">Benefit: child process failure can degrade,</tspan><tspan x="670" dy="23.18">restart, and attach logs; the UI keeps</tspan><tspan x="670" dy="23.18">control and result reading.</tspan></text>
</svg>
