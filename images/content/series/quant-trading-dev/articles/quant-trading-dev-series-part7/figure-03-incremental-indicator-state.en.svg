<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" data-figure-id="FIG-003" data-visual-pattern="state diagram 风格">
  <title>IncrementalMA incremental indicator status migration</title>
  <desc>Shows the state changes of incremental indicators from initialization, warm-up, stable update to gap recovery and abnormal reconstruction.</desc>
  <rect width="1200" height="760" rx="32" fill="#0f172a"/>
  <rect x="48" y="46" width="1104" height="668" rx="28" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="86" y="108" fill="#f8fafc" font-size="34" font-weight="700">Incremental indicator state machine</text>
  <text x="600" y="139.09" fill="#cbd5e1" font-size="14" text-anchor="middle"><tspan x="600" y="139.09">When a new K-line arrives, only the real changed</tspan><tspan x="600" dy="17.5">status in the window is updated.</tspan></text>

  <g font-size="23" font-weight="700">
    <rect x="112" y="250" width="176" height="80" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="3"/>
    <text x="200" y="299.66" fill="#bfdbfe" font-size="23" text-anchor="middle" font-weight="700"><tspan x="200" dy="0">initialization</tspan></text>
    <rect x="380" y="250" width="176" height="80" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="468" y="299.66" fill="#bae6fd" font-size="21" text-anchor="middle" font-weight="700"><tspan x="468" dy="0">warm-up</tspan></text>
    <rect x="648" y="250" width="176" height="80" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
    <text x="736" y="299.66" fill="#a7f3d0" font-size="23" text-anchor="middle" font-weight="700"><tspan x="736" dy="0">Stable updates</tspan></text>
    <rect x="514" y="464" width="176" height="80" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <text x="602" y="513.66" fill="#fde68a" font-size="23" text-anchor="middle" font-weight="700"><tspan x="602" dy="0">gap recovery</tspan></text>
    <rect x="782" y="464" width="176" height="80" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <text x="824" y="514" fill="#fde68a">Exception reconstruction</text>
  </g>

  <g stroke="#64748b" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="288" y1="290" x2="380" y2="290"/>
    <line x1="556" y1="290" x2="648" y2="290"/>
    <path d="M736 330 C736 392 660 416 602 464"/>
    <line x1="690" y1="504" x2="782" y2="504"/>
    <path d="M514 520 C364 524 206 440 200 330"/>
  </g>
  <g fill="#64748b">
    <polygon points="374,290 358,280 358,300"/>
    <polygon points="642,290 626,280 626,300"/>
    <polygon points="604,460 614,444 622,462"/>
    <polygon points="776,504 760,494 760,514"/>
    <polygon points="200,336 190,352 210,352"/>
  </g>

  <text x="312" y="272" fill="#cbd5e1" font-size="18">history bars</text>
  <text x="584" y="272" fill="#cbd5e1" font-size="18">window is full</text>
  <text x="682" y="414" fill="#cbd5e1" font-size="18">Breakpoint/Reconnect</text>
  <rect x="150" y="610" width="900" height="58" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="178" y="638" fill="#f8fafc" font-size="14" text-anchor="start"><tspan x="178" y="638">Verification point: Under the same input, the</tspan><tspan x="178" dy="16.52">incremental result must be consistent with Pandas full</tspan><tspan x="178" dy="16.52">recalculation.</tspan></text>
</svg>
