<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" data-figure-id="FIG-004" data-visual-pattern="容器边界图">
  <title>图表 MVC 容器边界</title>
  <desc>拆分 ChartWidget 后，数据模型、渲染器、交互控制器和刷新协议的职责边界。</desc>
  <rect width="1200" height="760" rx="32" fill="#0f172a"/>
  <rect x="48" y="46" width="1104" height="668" rx="28" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="86" y="108" fill="#f8fafc" font-size="34" font-weight="700">图表组件边界拆分</text>
  <text x="86" y="150" fill="#cbd5e1" font-size="22">从 God Object 拆成可测试、可替换、可复审的容器边界。</text>

  <rect x="112" y="212" width="976" height="380" rx="24" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <text x="146" y="258" fill="#f8fafc" font-size="26" font-weight="700">Chart Module Container</text>

  <rect x="156" y="310" width="250" height="138" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="3"/>
  <text x="228" y="358" fill="#bfdbfe" font-size="26" font-weight="700">Model</text>
  <text x="190" y="398" fill="#e2e8f0" font-size="20">K 线 / 指标状态</text>
  <text x="190" y="428" fill="#94a3b8" font-size="18">只描述数据含义</text>

  <rect x="475" y="310" width="250" height="138" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
  <text x="536" y="358" fill="#a7f3d0" font-size="26" font-weight="700">Renderer</text>
  <text x="514" y="398" fill="#e2e8f0" font-size="20">绘制 / 缓存 / 样式</text>
  <text x="514" y="428" fill="#94a3b8" font-size="18">只处理可视表达</text>

  <rect x="794" y="310" width="250" height="138" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="844" y="358" fill="#bae6fd" font-size="26" font-weight="700">Controller</text>
  <text x="832" y="398" fill="#e2e8f0" font-size="20">拖拽 / 缩放 / 选择</text>
  <text x="832" y="428" fill="#94a3b8" font-size="18">只处理交互意图</text>

  <rect x="334" y="498" width="532" height="62" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
  <text x="430" y="538" fill="#fde68a" font-size="23" font-weight="700">Event Bus / Refresh Contract</text>
  <g stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M281 448 L430 498"/>
    <path d="M600 448 L600 498"/>
    <path d="M919 448 L770 498"/>
  </g>
  <rect x="166" y="626" width="868" height="52" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="194" y="660" fill="#94a3b8" font-size="20">收益：边界可独立测试；代价：刷新顺序、事件订阅和状态归属必须显式维护。</text>
</svg>
