  <g font-family="Arial">
    <rect x="248" y="580" width="784" height="50" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="275.44" y="608" fill="#cbd5e1" font-size="14" text-anchor="start"><tspan x="275.44" y="608">Output assets: prompt constraints, review checklist,</tspan><tspan x="275.44" dy="16.52">regression tests, and repro cases.</tspan></text>
  </g>
</svg>
