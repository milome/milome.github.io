<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" data-figure-id="FIG-002" data-visual-pattern="causal chain 风格">
  <title id="title">Python bug amplification causal chain</title>
  <desc id="desc">A causal chain showing how a small Python language issue can propagate through data, indicator, strategy and order layers.</desc>
  <rect width="1280" height="720" rx="36" fill="#0f172a"/>
  <rect x="56" y="54" width="1168" height="612" rx="30" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="96" y="112" fill="#f8fafc" font-family="Arial" font-size="32" font-weight="700">bug amplification causal chain / Amplification Chain</text>
  <text x="640" y="141" fill="#94a3b8" font-family="Arial" font-size="14" text-anchor="middle"><tspan x="640" y="141">Small errors in the language layer will not</tspan><tspan x="640" dy="17.5">stop at the error line, but will be magnified</tspan><tspan x="640" dy="17.5">layer by layer along the transaction link.</tspan></text>
  <g font-family="Arial">
    <rect x="110" y="254" width="170" height="112" rx="22" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <rect x="344" y="254" width="170" height="112" rx="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="578" y="254" width="170" height="112" rx="22" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="812" y="254" width="170" height="112" rx="22" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="1046" y="254" width="124" height="112" rx="22" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="123.44" y="307.57" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start"><tspan x="123.44" dy="0">Language error</tspan></text>
    <text x="123.44" y="325.27" fill="#94a3b8" font-size="12" text-anchor="start"><tspan x="123.44" dy="0">scope/type</tspan></text>
    <text x="376" y="304" fill="#f8fafc" font-size="20" font-weight="700">data pollution</text>
    <text x="376" y="334" fill="#94a3b8" font-size="18">K line / time</text>
    <text x="591.44" y="307.57" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start"><tspan x="591.44" dy="0">indicator offset</tspan></text>
    <text x="591.44" y="325.27" fill="#94a3b8" font-size="12" text-anchor="start"><tspan x="591.44" dy="0">window/status</tspan></text>
    <text x="844" y="304" fill="#f8fafc" font-size="20" font-weight="700">Signal drift</text>
    <text x="844" y="322.04" fill="#94a3b8" font-size="18"><tspan x="844" dy="0">strategic</tspan><tspan x="844" dy="21.96">judgment</tspan></text>
    <text x="1076" y="304" fill="#f8fafc" font-size="20" font-weight="700">Order</text>
    <text x="1076" y="334" fill="#94a3b8" font-size="18">real risk</text>
  </g>
  <g stroke="#60a5fa" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M280 310 H344"/>
    <path d="M514 310 H578"/>
    <path d="M748 310 H812"/>
    <path d="M982 310 H1046"/>
  </g>
  <g font-family="Arial">
    <rect x="158" y="470" width="964" height="72" rx="22" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="186" y="498" fill="#cbd5e1" font-size="14" text-anchor="start"><tspan x="186" y="498">The closer to the order link, the higher the repair</tspan><tspan x="186" dy="16.52">cost; the earlier you use testing and review to</tspan><tspan x="186" dy="16.52">intercept, the lower the review cost.</tspan></text>
  </g>
</svg>
