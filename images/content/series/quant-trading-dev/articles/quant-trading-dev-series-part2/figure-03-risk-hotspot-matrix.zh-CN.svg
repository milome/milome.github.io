<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" data-figure-id="FIG-003" data-visual-pattern="matrix / heatmap 风格">
  <title id="title">Risk hotspot matrix for Python runtime failures</title>
  <desc id="desc">A heatmap matrix highlighting shared state, callback order, exception propagation and type drift risks in quant trading systems.</desc>
  <rect width="1280" height="720" rx="36" fill="#0f172a"/>
  <rect x="56" y="54" width="1168" height="612" rx="30" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="96" y="112" fill="#f8fafc" font-family="Arial" font-size="32" font-weight="700">风险热区矩阵 / Runtime Risk Hotspots</text>
  <text x="96" y="148" fill="#94a3b8" font-family="Arial" font-size="18">用影响面和复现难度判断哪些 Python 风险最容易进入实盘事故</text>
  <g font-family="Arial">
    <text x="138" y="242" fill="#94a3b8" font-size="18">影响面高</text>
    <text x="138" y="520" fill="#94a3b8" font-size="18">影响面低</text>
    <text x="300" y="570" fill="#94a3b8" font-size="18">易复现</text>
    <text x="860" y="570" fill="#94a3b8" font-size="18">难复现</text>
    <line x1="240" y1="530" x2="1038" y2="530" stroke="#475569" stroke-width="3"/>
    <line x1="240" y1="210" x2="240" y2="530" stroke="#475569" stroke-width="3"/>
    <rect x="282" y="210" width="220" height="130" rx="22" fill="#38bdf8"/>
    <rect x="530" y="210" width="220" height="130" rx="22" fill="#f59e0b"/>
    <rect x="778" y="210" width="220" height="130" rx="22" fill="#f59e0b" stroke="#fde68a" stroke-width="2"/>
    <rect x="282" y="372" width="220" height="130" rx="22" fill="#60a5fa"/>
    <rect x="530" y="372" width="220" height="130" rx="22" fill="#10b981"/>
    <rect x="778" y="372" width="220" height="130" rx="22" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="320" y="260" fill="#0f172a" font-size="21" font-weight="700">回调顺序</text>
    <text x="320" y="292" fill="#0f172a" font-size="18">先后错乱</text>
    <text x="568" y="260" fill="#0f172a" font-size="21" font-weight="700">状态共享</text>
    <text x="568" y="292" fill="#0f172a" font-size="18">跨线程污染</text>
    <text x="816" y="260" fill="#0f172a" font-size="21" font-weight="700">异常传播</text>
    <text x="816" y="292" fill="#0f172a" font-size="18">吞掉后失真</text>
    <text x="320" y="422" fill="#0f172a" font-size="21" font-weight="700">类型漂移</text>
    <text x="320" y="454" fill="#0f172a" font-size="18">边界断言</text>
    <text x="568" y="422" fill="#0f172a" font-size="21" font-weight="700">资源泄漏</text>
    <text x="568" y="454" fill="#0f172a" font-size="18">长期运行</text>
    <text x="816" y="422" fill="#cbd5e1" font-size="21" font-weight="700">局部语法</text>
    <text x="816" y="454" fill="#94a3b8" font-size="18">优先级较低</text>
  </g>
  <g font-family="Arial">
    <rect x="168" y="604" width="944" height="44" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="198" y="633" fill="#cbd5e1" font-size="18">处理顺序：先补状态边界和异常记录，再补回调时序测试，最后处理局部语法清理。</text>
  </g>
</svg>
