<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" data-figure-id="FIG-004" data-visual-pattern="decision tree 风格">
  <title id="title">Python risk family fix decision patterns</title>
  <desc id="desc">A decision tree that maps Python risk families to import rules, type contracts, lifecycle boundaries and event boundaries.</desc>
  <rect width="1280" height="720" rx="36" fill="#0f172a"/>
  <rect x="56" y="54" width="1168" height="612" rx="30" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="96" y="112" fill="#f8fafc" font-family="Arial" font-size="32" font-weight="700">家族修复模式 / Fix Pattern Decision</text>
  <text x="96" y="148" fill="#94a3b8" font-family="Arial" font-size="18">先判断风险族群，再把单点修复沉淀为规则、测试和 review 项</text>
  <g font-family="Arial">
    <rect x="486" y="206" width="308" height="82" rx="22" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="524" y="256" fill="#f8fafc" font-size="22" font-weight="700">这个 Trap 属于哪类风险？</text>
    <rect x="118" y="410" width="224" height="106" rx="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="390" y="410" width="224" height="106" rx="22" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="662" y="410" width="224" height="106" rx="22" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="934" y="410" width="224" height="106" rx="22" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="154" y="454" fill="#f8fafc" font-size="21" font-weight="700">导入规则</text>
    <text x="154" y="486" fill="#94a3b8" font-size="18">作用域 / lint</text>
    <text x="426" y="454" fill="#f8fafc" font-size="21" font-weight="700">类型契约</text>
    <text x="426" y="486" fill="#94a3b8" font-size="18">guard / assert</text>
    <text x="698" y="454" fill="#f8fafc" font-size="21" font-weight="700">生命周期</text>
    <text x="698" y="486" fill="#94a3b8" font-size="18">cache / teardown</text>
    <text x="970" y="454" fill="#f8fafc" font-size="21" font-weight="700">事件边界</text>
    <text x="970" y="486" fill="#94a3b8" font-size="18">thread / signal</text>
  </g>
