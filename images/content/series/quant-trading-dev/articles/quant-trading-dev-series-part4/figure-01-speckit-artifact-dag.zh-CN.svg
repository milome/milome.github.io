<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" data-figure-id="FIG-001" data-visual-pattern="flowchart 风格">
  <title id="title">speckit artifact flow</title>
  <desc id="desc">Flowchart showing how business semantics become specification, clarification, plan, implementation and evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#60a5fa"/>
    </marker>
    <marker id="loopArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="1280" height="720" rx="34" fill="#0f172a"/>
  <rect x="56" y="52" width="1168" height="616" rx="30" fill="#111827" stroke="#334155" stroke-width="2"/>

  <text x="92" y="112" fill="#f8fafc" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700">speckit 工件流：不能从 prompt 直接跳到代码</text>
  <text x="92" y="152" fill="#cbd5e1" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="20">业务语义先进入可审计规格，再进入计划、实现和验收证据。</text>

  <g fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M250 328 H348"/>
    <path d="M498 328 H596"/>
    <path d="M746 328 H844"/>
    <path d="M994 328 H1092"/>
  </g>
  <path d="M1050 454 C856 574 418 574 230 454" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" marker-end="url(#loopArrow)"/>

  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <rect x="94" y="264" width="156" height="128" rx="22" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <rect x="348" y="264" width="150" height="128" rx="22" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <rect x="596" y="264" width="150" height="128" rx="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="844" y="264" width="150" height="128" rx="22" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="1092" y="264" width="92" height="128" rx="22" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>

    <text x="172" y="310" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">业务语义</text>
    <text x="172" y="344" text-anchor="middle" fill="#cbd5e1" font-size="18">交易日归属</text>
    <text x="423" y="310" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">Specify</text>
    <text x="423" y="344" text-anchor="middle" fill="#cbd5e1" font-size="18">需求与验收</text>
    <text x="671" y="310" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">Clarify</text>
    <text x="671" y="344" text-anchor="middle" fill="#cbd5e1" font-size="18">决策与歧义</text>
    <text x="919" y="310" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">Plan</text>
    <text x="919" y="344" text-anchor="middle" fill="#cbd5e1" font-size="18">阶段与风险</text>
    <text x="1138" y="310" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">Code</text>
    <text x="1138" y="344" text-anchor="middle" fill="#cbd5e1" font-size="18">实现</text>

    <rect x="420" y="462" width="440" height="72" rx="22" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="640" y="506" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">Checklist / Evidence：测试、构建、benchmark、人工签收</text>
    <text x="640" y="610" text-anchor="middle" fill="#a7f3d0" font-size="20">证据失败时回到规格或澄清，而不是继续堆补丁。</text>
  </g>
</svg>
