<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" data-figure-id="FIG-002" data-visual-pattern="state diagram 风格">
  <title id="title">Runtime lifecycle state map</title>
  <desc id="desc">A state diagram for quant trading runtime lifecycle from startup to subscription, running, degraded mode, recovery and shutdown.</desc>
  <rect width="1280" height="720" rx="36" fill="#0f172a"/>
  <rect x="56" y="54" width="1168" height="612" rx="30" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="96" y="112" fill="#f8fafc" font-family="Arial" font-size="32" font-weight="700">运行时生命周期 / Runtime Lifecycle</text>
  <text x="96" y="148" fill="#94a3b8" font-family="Arial" font-size="18">把资源创建、订阅、降级、恢复和关闭建模为显式状态</text>
  <g font-family="Arial">
    <rect x="118" y="278" width="150" height="86" rx="20" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <rect x="324" y="278" width="150" height="86" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="530" y="278" width="150" height="86" rx="20" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="736" y="278" width="150" height="86" rx="20" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="942" y="278" width="150" height="86" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="530" y="470" width="150" height="86" rx="20" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="152" y="328" fill="#f8fafc" font-size="20" font-weight="700">启动</text>
    <text x="350" y="328" fill="#f8fafc" font-size="20" font-weight="700">订阅</text>
    <text x="556" y="328" fill="#f8fafc" font-size="20" font-weight="700">运行</text>
    <text x="762" y="328" fill="#f8fafc" font-size="20" font-weight="700">降级</text>
    <text x="968" y="328" fill="#f8fafc" font-size="20" font-weight="700">恢复</text>
    <text x="556" y="520" fill="#f8fafc" font-size="20" font-weight="700">关闭</text>
  </g>
  <g stroke="#60a5fa" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M268 321 H324"/>
    <path d="M474 321 H530"/>
    <path d="M680 321 H736"/>
    <path d="M886 321 H942"/>
    <path d="M1017 364 C990 454 742 512 680 512"/>
    <path d="M605 364 V470"/>
  </g>
  <g font-family="Arial">
    <rect x="188" y="594" width="904" height="42" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="218" y="622" fill="#cbd5e1" font-size="18">每个状态都要有进入条件、退出条件、清理责任和可测试的异常路径。</text>
  </g>
</svg>
