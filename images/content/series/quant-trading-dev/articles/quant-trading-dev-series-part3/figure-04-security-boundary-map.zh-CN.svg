<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" data-figure-id="FIG-004" data-visual-pattern="容器边界图">
  <title id="title">Security boundary map for quant trading terminal</title>
  <desc id="desc">A container boundary diagram showing trust boundaries for plugins, configuration, logs, dynamic API access and serialized cache files.</desc>
  <rect width="1280" height="720" rx="36" fill="#0f172a"/>
  <rect x="56" y="54" width="1168" height="612" rx="30" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="96" y="112" fill="#f8fafc" font-family="Arial" font-size="32" font-weight="700">安全边界图 / Security Boundary Map</text>
  <text x="96" y="148" fill="#94a3b8" font-family="Arial" font-size="18">插件、配置、日志、动态 API 和缓存文件都必须先经过信任边界</text>
  <g font-family="Arial">
    <rect x="116" y="236" width="246" height="310" rx="28" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <rect x="478" y="216" width="324" height="350" rx="30" fill="#111827" stroke="#60a5fa" stroke-width="3"/>
    <rect x="918" y="236" width="246" height="310" rx="28" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="152" y="282" fill="#f8fafc" font-size="21" font-weight="700">外部输入</text>
    <text x="152" y="326" fill="#94a3b8" font-size="18">插件代码</text>
    <text x="152" y="358" fill="#94a3b8" font-size="18">配置文件</text>
    <text x="152" y="390" fill="#94a3b8" font-size="18">用户输入</text>
    <text x="152" y="422" fill="#94a3b8" font-size="18">缓存文件</text>
    <text x="520" y="270" fill="#f8fafc" font-size="22" font-weight="700">信任边界</text>
    <text x="520" y="318" fill="#cbd5e1" font-size="18">白名单 / 签名校验</text>
    <text x="520" y="350" fill="#cbd5e1" font-size="18">安全解析 / 禁止 eval</text>
    <text x="520" y="382" fill="#cbd5e1" font-size="18">结构化日志 / 脱敏</text>
    <text x="520" y="414" fill="#cbd5e1" font-size="18">API 暴露清单</text>
    <text x="520" y="446" fill="#cbd5e1" font-size="18">序列化签名验证</text>
    <text x="954" y="282" fill="#f8fafc" font-size="21" font-weight="700">内部能力</text>
    <text x="954" y="326" fill="#94a3b8" font-size="18">行情权限</text>
    <text x="954" y="358" fill="#94a3b8" font-size="18">订单接口</text>
    <text x="954" y="390" fill="#94a3b8" font-size="18">本地文件</text>
    <text x="954" y="422" fill="#94a3b8" font-size="18">运行日志</text>
  </g>
  <g stroke="#60a5fa" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M362 390 H478"/>
    <path d="M802 390 H918"/>
  </g>
  <g font-family="Arial">
    <rect x="176" y="596" width="928" height="42" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="206" y="624" fill="#cbd5e1" font-size="18">原则：任何来自边界外的数据，都不能直接进入交易能力、日志或本地资源。</text>
  </g>
</svg>
