<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" data-figure-id="FIG-003" data-visual-pattern="state diagram 风格">
  <title id="title">Boundary time test status diagram</title>
  <desc id="desc">The opening, lunch break, closing, night trading, midnight, weekly, half-day trading and market closing are used as test states to demonstrate the migration boundaries of trading day semantics.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1280" height="720" rx="34" fill="#0f172a"/>
  <rect x="54" y="48" width="1172" height="624" rx="28" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="92" y="104" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">Boundary time test status diagram</text>
  <text x="640" y="132" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" text-anchor="middle"><tspan x="640" y="132">Only by changing the date list to status</tspan><tspan x="640" dy="17.5">migration can the semantics of trading day</tspan><tspan x="640" dy="17.5">attribution, overnight and market closing be</tspan><tspan x="640" dy="17.5">covered.</tspan></text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="150" y="206" width="160" height="80" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="230" y="240" fill="#f8fafc" font-size="20" font-weight="700">opening<tspan x="230" dy="26" fill="#cbd5e1" font-size="18">The first K line</tspan></text>
    <rect x="478" y="206" width="186" height="80" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="571" y="241" fill="#f8fafc" font-size="13" font-weight="700"><tspan x="571" dy="0">Lunch break/recovery</tspan><tspan x="571" dy="15.34">Event paused</tspan></text>
    <rect x="832" y="206" width="176" height="80" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="920" y="240" fill="#f8fafc" font-size="12" font-weight="700"><tspan x="920" dy="0">daily closing Attribution</tspan><tspan x="920" dy="12.98">of tail root</tspan></text>
    <rect x="564" y="346" width="160" height="80" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="644" y="382" fill="#f8fafc" font-size="14" font-weight="700"><tspan x="644" dy="0">Night dish</tspan><tspan x="644" dy="16.52">across midnight</tspan></text>
    <rect x="186" y="414" width="176" height="80" rx="18" fill="#1e293b" stroke="#bfdbfe" stroke-width="2"/>
    <text x="274" y="448" fill="#f8fafc" font-size="12" font-weight="700"><tspan x="274" dy="0">Attribution across</tspan><tspan x="274" dy="12.98">weeks Friday to Monday</tspan></text>
    <rect x="796" y="414" width="184" height="80" rx="18" fill="#1e293b" stroke="#fde68a" stroke-width="2"/>
    <text x="888" y="448" fill="#f8fafc" font-size="12" font-weight="700"><tspan x="888" dy="0">Half day market / closed</tspan><tspan x="888" dy="12.98">market Truncate early</tspan></text>
  </g>
  <g fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M310 246 H478"/>
    <path d="M664 246 H832"/>
    <path d="M920 286 C920 334 800 386 724 386"/>
    <path d="M564 386 C494 386 430 454 362 454"/>
    <path d="M230 286 C168 350 130 440 130 548 H888 V494"/>
    <path d="M888 414 C888 352 912 322 920 286"/>
  </g>
  <text x="640" y="616" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18" text-anchor="middle"><tspan x="640" dy="0">Each state verifies at least pre-boundary, boundary point and post-boundary to avoid natural day segmentation pollution indicators.</tspan></text>
</svg>
