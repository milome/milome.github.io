<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" data-figure-id="FIG-002" data-visual-pattern="swimlane 风格">
  <title id="title">AI-assisted TDD human-machine division of labor swim lane diagram</title>
  <desc id="desc">Demonstrate the division of responsibilities among the presenter, AI Agent and CI Gate in the three stages of RED, GREEN and REFACTOR.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1280" height="720" rx="34" fill="#0f172a"/>
  <rect x="54" y="48" width="1172" height="624" rx="28" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="92" y="104" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="700">AI-assisted TDD division of labor</text>
  <text x="640" y="132" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" text-anchor="middle"><tspan x="640" y="132">AI increases the speed of candidate</tspan><tspan x="640" dy="17.5">generation, while humans retain the rights to</tspan><tspan x="640" dy="17.5">define defects, business semantics, and</tspan><tspan x="640" dy="17.5">acceptance signoffs.</tspan></text>
  <g font-family="Arial, sans-serif">
    <rect x="94" y="178" width="1092" height="104" rx="20" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <rect x="94" y="320" width="1092" height="104" rx="20" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="94" y="462" width="1092" height="104" rx="20" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="130" y="238" fill="#f8fafc" font-size="22" font-weight="700">people</text>
    <text x="130" y="380" fill="#f8fafc" font-size="22" font-weight="700">AI</text>
    <text x="130" y="522" fill="#f8fafc" font-size="22" font-weight="700">CI</text>
    <text x="300" y="216" fill="#bfdbfe" font-size="18" font-weight="700">RED<tspan x="300" dy="28" fill="#e2e8f0">Define defects and boundaries</tspan></text>
    <text x="592" y="216" fill="#bfdbfe" font-size="18" font-weight="700">GREEN<tspan x="592" dy="28" fill="#e2e8f0">Review candidate implementations</tspan></text>
    <text x="884" y="216" fill="#bfdbfe" font-size="18" font-weight="700">REFACTOR<tspan x="884" dy="28" fill="#e2e8f0">Keep signature semantics</tspan></text>
    <text x="300" y="358" fill="#a7f3d0" font-size="18" font-weight="700">Extend use cases<tspan x="300" dy="28" fill="#e2e8f0">Generate boundary samples</tspan></text>
    <text x="592" y="358" fill="#a7f3d0" font-size="18" font-weight="700">Generate code<tspan x="592" dy="28" fill="#e2e8f0">Give a minimal implementation</tspan></text>
    <text x="884" y="358" fill="#a7f3d0" font-size="18" font-weight="700">Recommend refactoring<tspan x="884" dy="28" fill="#e2e8f0">Explain the risk of change</tspan></text>
    <text x="300" y="500" fill="#fde68a" font-size="18" font-weight="700">Failure is reproducible<tspan x="300" dy="28" fill="#e2e8f0">Prove the test works</tspan></text>
    <text x="592" y="500" fill="#fde68a" font-size="18" font-weight="700">Test remains green<tspan x="592" dy="28" fill="#e2e8f0">block regression</tspan></text>
    <text x="884" y="500" fill="#fde68a" font-size="18" font-weight="700">Evidence is reviewable<tspan x="884" dy="28" fill="#e2e8f0">Enter merge access</tspan></text>
  </g>
  <g fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)">
    <path d="M412 596 H540"/>
    <path d="M704 596 H832"/>
  </g>
  <text x="640" y="642" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18" text-anchor="middle"><tspan x="640" dy="0">Judgment criteria: AI can only expand the candidate space but cannot reduce assertion strength.</tspan></text>
</svg>
