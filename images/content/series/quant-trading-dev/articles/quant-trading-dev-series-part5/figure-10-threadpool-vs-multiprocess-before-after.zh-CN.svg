<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-labelledby="title desc" data-figure-id="FIG-005" data-visual-pattern="before-after comparison 风格">
  <title id="title">线程池 vs 多进程架构对比</title>
  <desc id="desc">对比线程池单进程和多进程架构在 GIL、共享数据、Worker 并行、崩溃隔离和 100 万条数据 MA 计算中的差异。</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="700" fill="#0f172a"/>

  <text x="450" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#f8fafc">线程池 vs 多进程架构对比</text>

  <rect x="30" y="50" width="410" height="280" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="235" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#fde68a">线程池模式（受 GIL 限制）</text>

  <rect x="50" y="90" width="370" height="220" rx="4" fill="#111827" stroke="#475569" stroke-width="1"/>
  <text x="235" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#fde68a">单进程 - 所有线程共享 GIL</text>

  <rect x="70" y="125" width="80" height="35" rx="3" fill="#334155" stroke="#f59e0b" stroke-width="1"/>
  <text x="110" y="147" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#f8fafc">Tick 事件</text>

  <rect x="170" y="125" width="80" height="35" rx="3" fill="#334155" stroke="#f59e0b" stroke-width="1"/>
  <text x="210" y="147" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#f8fafc">BarGenerator</text>

  <rect x="270" y="125" width="80" height="35" rx="3" fill="#334155" stroke="#f59e0b" stroke-width="1"/>
  <text x="310" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#f8fafc">共享数据</text>
  <text x="310" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#fde68a">(需 Lock)</text>

  <rect x="70" y="180" width="100" height="110" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="120" y="198" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#fde68a">Thread 1</text>
  <text x="120" y="220" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#fde68a">计算 MA</text>
  <text x="120" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#fde68a">等待 GIL</text>
  <text x="120" y="260" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#fde68a">串行执行</text>

  <rect x="185" y="180" width="100" height="110" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="235" y="198" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#fde68a">Thread 2</text>
  <text x="235" y="220" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#fde68a">计算 RSI</text>
  <text x="235" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#fde68a">等待 GIL</text>
  <text x="235" y="260" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#fde68a">串行执行</text>

  <rect x="300" y="180" width="100" height="110" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="350" y="198" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#fde68a">Thread 3</text>
  <text x="350" y="220" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#fde68a">计算 MACD</text>
  <text x="350" y="238" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#fde68a">等待 GIL</text>
  <text x="350" y="260" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#fde68a">串行执行</text>

  <line x1="150" y1="142" x2="165" y2="142" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="250" y1="142" x2="265" y2="142" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="120" y1="160" x2="120" y2="178" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="235" y1="160" x2="235" y2="178" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="160" x2="350" y2="178" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="160" y="295" width="150" height="25" rx="12" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
  <text x="235" y="312" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">GIL 全局锁</text>

  <rect x="460" y="50" width="410" height="280" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="665" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#a7f3d0">多进程模式（真并行）</text>

  <rect x="480" y="90" width="370" height="100" rx="4" fill="#111827" stroke="#475569" stroke-width="1"/>
  <text x="665" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#a7f3d0">主进程</text>

  <rect x="500" y="125" width="70" height="30" rx="3" fill="#334155" stroke="#10b981" stroke-width="1"/>
  <text x="535" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#f8fafc">Tick 事件</text>

  <rect x="590" y="125" width="70" height="30" rx="3" fill="#334155" stroke="#10b981" stroke-width="1"/>
  <text x="625" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#f8fafc">BarGenerator</text>

  <rect x="680" y="125" width="70" height="30" rx="3" fill="#334155" stroke="#10b981" stroke-width="1"/>
  <text x="715" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#f8fafc">IPC 通知</text>

  <rect x="590" y="165" width="150" height="20" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="665" y="179" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#f8fafc">共享内存 (Zero-Copy)</text>

  <rect x="500" y="210" width="100" height="100" rx="3" fill="#334155" stroke="#10b981" stroke-width="1"/>
  <text x="550" y="228" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#f8fafc">Worker 1</text>
  <text x="550" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a7f3d0">独立进程</text>
  <text x="550" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a7f3d0">计算 MA</text>
  <text x="550" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a7f3d0">真并行</text>

  <rect x="615" y="210" width="100" height="100" rx="3" fill="#334155" stroke="#10b981" stroke-width="1"/>
  <text x="665" y="228" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#f8fafc">Worker 2</text>
  <text x="665" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a7f3d0">独立进程</text>
  <text x="665" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a7f3d0">计算 RSI</text>
  <text x="665" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a7f3d0">真并行</text>

  <rect x="730" y="210" width="100" height="100" rx="3" fill="#334155" stroke="#10b981" stroke-width="1"/>
  <text x="780" y="228" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#f8fafc">Worker 3</text>
  <text x="780" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a7f3d0">独立进程</text>
  <text x="780" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a7f3d0">计算 MACD</text>
  <text x="780" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#a7f3d0">真并行</text>

  <line x1="570" y1="140" x2="585" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="660" y1="140" x2="675" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="715" y1="175" x2="715" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="715" y1="185" x2="780" y2="208" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="665" y1="185" x2="665" y2="208" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="615" y1="185" x2="550" y2="208" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="30" y="350" width="840" height="330" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="450" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">架构对比分析</text>

  <rect x="50" y="390" width="200" height="30" rx="2" fill="#334155"/>
  <text x="150" y="410" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f8fafc" font-weight="600">对比维度</text>
  <rect x="255" y="390" width="280" height="30" rx="2" fill="#1e293b"/>
  <text x="395" y="410" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#fde68a" font-weight="600">线程池（单进程）</text>
  <rect x="540" y="390" width="310" height="30" rx="2" fill="#1e293b"/>
  <text x="695" y="410" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#a7f3d0" font-weight="600">多进程（推荐）</text>

  <rect x="50" y="425" width="200" height="25" rx="2" fill="#111827"/>
  <text x="60" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">并行度</text>
  <rect x="255" y="425" width="280" height="25" rx="2" fill="#111827"/>
  <text x="395" y="442" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fde68a">受 GIL 限制（伪并行）</text>
  <rect x="540" y="425" width="310" height="25" rx="2" fill="#111827"/>
  <text x="695" y="442" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a7f3d0">真并行（利用多核）</text>

  <rect x="50" y="455" width="200" height="25" rx="2" fill="#111827"/>
  <text x="60" y="472" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">CPU 密集型任务</text>
  <rect x="255" y="455" width="280" height="25" rx="2" fill="#111827"/>
  <text x="395" y="472" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fde68a">不适合（GIL 竞争）</text>
  <rect x="540" y="455" width="310" height="25" rx="2" fill="#111827"/>
  <text x="695" y="472" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a7f3d0">适合（无 GIL）</text>

  <rect x="50" y="485" width="200" height="25" rx="2" fill="#111827"/>
  <text x="60" y="502" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">内存共享</text>
  <rect x="255" y="485" width="280" height="25" rx="2" fill="#111827"/>
  <text x="395" y="502" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fde68a">天然共享（需 Lock）</text>
  <rect x="540" y="485" width="310" height="25" rx="2" fill="#111827"/>
  <text x="695" y="502" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a7f3d0">Zero-Copy 共享内存</text>

  <rect x="50" y="515" width="200" height="25" rx="2" fill="#111827"/>
  <text x="60" y="532" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">Numba 加速</text>
  <rect x="255" y="515" width="280" height="25" rx="2" fill="#111827"/>
  <text x="395" y="532" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fde68a">受 GIL 限制</text>
  <rect x="540" y="515" width="310" height="25" rx="2" fill="#111827"/>
  <text x="695" y="532" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a7f3d0">完全发挥性能</text>

  <rect x="50" y="545" width="200" height="25" rx="2" fill="#111827"/>
  <text x="60" y="562" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">崩溃隔离</text>
  <rect x="255" y="545" width="280" height="25" rx="2" fill="#111827"/>
  <text x="395" y="562" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fde68a">可能拖垮整个进程</text>
  <rect x="540" y="545" width="310" height="25" rx="2" fill="#111827"/>
  <text x="695" y="562" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a7f3d0">进程级隔离</text>

  <rect x="50" y="575" width="200" height="25" rx="2" fill="#111827"/>
  <text x="60" y="592" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">适用场景</text>
  <rect x="255" y="575" width="280" height="25" rx="2" fill="#111827"/>
  <text x="395" y="592" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fde68a">IO 密集型（网络/文件）</text>
  <rect x="540" y="575" width="310" height="25" rx="2" fill="#111827"/>
  <text x="695" y="592" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a7f3d0">CPU 密集型（计算）</text>

  <rect x="50" y="610" width="800" height="55" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="450" y="630" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">性能对比（100万条数据 MA 计算）</text>
  <text x="150" y="650" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fde68a">单线程: 2000ms</text>
  <text x="395" y="650" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fde68a">线程池(4核): 2500ms 更慢</text>
  <text x="695" y="650" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a7f3d0">多进程(4核): 400ms 5x 提升</text>
</svg>
