<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" data-figure-id="FIG-011" data-visual-pattern="flowchart 风格">
  <title id="title">timeit workflow for micro-benchmark validation</title>
  <desc id="desc">A flowchart showing how to use timeit for micro-benchmarking: isolate a small code path, fix setup and input, choose number and repeat, read minimum and variance, and promote only stable findings to benchmark validation.</desc>
  <rect width="1280" height="720" rx="36" fill="#0f172a"/>
  <rect x="56" y="48" width="1168" height="624" rx="30" fill="#111827" stroke="#334155" stroke-width="2"/>

  <text x="96" y="108" fill="#f8fafc" font-size="32" font-family="Arial" font-weight="700">timeit 使用流程 / Micro-Benchmark Flow</text>
  <text x="96" y="144" fill="#cbd5e1" font-size="19" font-family="Arial">timeit 适合比较很小的纯计算片段；它验证局部实现选择，不能替代端到端性能验收。</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <g font-family="Arial">
    <rect x="88" y="198" width="188" height="96" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="116" y="232" fill="#f8fafc" font-size="21" font-weight="700">1. 隔离片段</text>
    <text x="116" y="262" fill="#cbd5e1" font-size="18">只测小函数</text>
    <text x="116" y="286" fill="#cbd5e1" font-size="18">避免 I/O 与 UI</text>

    <rect x="318" y="198" width="188" height="96" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="346" y="232" fill="#f8fafc" font-size="21" font-weight="700">2. 固定 setup</text>
    <text x="346" y="262" fill="#cbd5e1" font-size="18">相同输入</text>
    <text x="346" y="286" fill="#cbd5e1" font-size="18">相同初始化</text>

    <rect x="548" y="198" width="188" height="96" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="576" y="232" fill="#f8fafc" font-size="21" font-weight="700">3. 设置次数</text>
    <text x="576" y="262" fill="#cbd5e1" font-size="18">number</text>
    <text x="576" y="286" fill="#cbd5e1" font-size="18">repeat</text>

    <rect x="778" y="198" width="188" height="96" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="806" y="232" fill="#f8fafc" font-size="21" font-weight="700">4. 读取分布</text>
    <text x="806" y="262" fill="#cbd5e1" font-size="18">min / median</text>
    <text x="806" y="286" fill="#cbd5e1" font-size="18">波动范围</text>

    <rect x="1008" y="198" width="182" height="96" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="1034" y="232" fill="#f8fafc" font-size="21" font-weight="700">5. 升级验证</text>
    <text x="1034" y="262" fill="#cbd5e1" font-size="18">端到端 benchmark</text>
    <text x="1034" y="286" fill="#cbd5e1" font-size="18">正确性断言</text>

    <path d="M276 246 H308" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M506 246 H538" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M736 246 H768" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M966 246 H998" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  </g>

  <g font-family="Arial">
    <text x="96" y="360" fill="#f8fafc" font-size="24" font-weight="700">结果怎么避免误读 / Guardrails for Reading Results</text>

    <rect x="96" y="394" width="254" height="132" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="122" y="430" fill="#bfdbfe" font-size="21" font-weight="700">只看平均值</text>
    <text x="122" y="462" fill="#e2e8f0" font-size="18">容易被抖动误导</text>
    <text x="122" y="488" fill="#cbd5e1" font-size="18">至少看 min</text>
    <text x="122" y="514" fill="#cbd5e1" font-size="18">和 repeat 分布</text>

    <rect x="384" y="394" width="254" height="132" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="410" y="430" fill="#a7f3d0" font-size="21" font-weight="700">setup 不一致</text>
    <text x="410" y="462" fill="#e2e8f0" font-size="18">测到初始化成本</text>
    <text x="410" y="488" fill="#cbd5e1" font-size="18">把数据准备</text>
    <text x="410" y="514" fill="#cbd5e1" font-size="18">移入 setup</text>

    <rect x="672" y="394" width="254" height="132" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="698" y="430" fill="#fde68a" font-size="21" font-weight="700">片段过小</text>
    <text x="698" y="462" fill="#e2e8f0" font-size="18">解释器开销占比高</text>
    <text x="698" y="488" fill="#cbd5e1" font-size="18">提高 number</text>
    <text x="698" y="514" fill="#cbd5e1" font-size="18">或扩大样本</text>

    <rect x="960" y="394" width="224" height="132" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="986" y="430" fill="#bae6fd" font-size="21" font-weight="700">局部快了</text>
    <text x="986" y="462" fill="#e2e8f0" font-size="18">不等于链路变快</text>
    <text x="986" y="488" fill="#cbd5e1" font-size="18">必须回到</text>
    <text x="986" y="514" fill="#cbd5e1" font-size="18">端到端验证</text>
  </g>

  <rect x="118" y="584" width="1044" height="52" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="146" y="617" fill="#cbd5e1" font-size="19" font-family="Arial">边界原则：timeit 证明局部片段差异；实盘链路仍要看 P50、P95、最大值、内存和正确性断言。</text>
</svg>
