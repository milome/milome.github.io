<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" data-figure-id="FIG-004" data-visual-pattern="decision tree 风格">
  <title id="title">Thread process shared memory decision</title>
  <desc id="desc">Decision map for choosing threads, processes, or shared memory in Python quant systems.</desc>
  <rect width="1280" height="720" rx="36" fill="#0f172a"/>
  <rect x="56" y="54" width="1168" height="612" rx="30" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="96" y="112" fill="#f8fafc" font-family="Arial" font-size="32" font-weight="700">并发模型决策 / Concurrency Decision</text>
  <g font-family="Arial">
    <rect x="500" y="160" width="280" height="88" rx="22" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="536" y="214" fill="#f8fafc" font-size="22" font-weight="700">瓶颈类型是什么？</text>
    <rect x="124" y="360" width="270" height="122" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
