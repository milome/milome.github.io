    <rect x="886" y="360" width="270" height="122" rx="24" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="170" y="414" fill="#f8fafc" font-size="22" font-weight="700">I/O 等待</text>
    <text x="170" y="448" fill="#94a3b8" font-size="18">线程 / async</text>
    <text x="552" y="414" fill="#f8fafc" font-size="22" font-weight="700">CPU 计算</text>
    <text x="552" y="448" fill="#94a3b8" font-size="18">进程 / 向量化</text>
    <text x="932" y="414" fill="#f8fafc" font-size="22" font-weight="700">大数组复用</text>
    <text x="932" y="448" fill="#94a3b8" font-size="18">共享内存</text>
  </g>
  <g stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M590 248 C470 298 370 320 260 360" stroke="#38bdf8"/>
    <path d="M640 248 V360" stroke="#10b981"/>
