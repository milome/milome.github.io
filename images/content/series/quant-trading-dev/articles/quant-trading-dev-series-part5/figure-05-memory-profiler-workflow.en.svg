<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" data-figure-id="FIG-009" data-visual-pattern="flowchart 风格">
  <title id="title">memory_profiler workflow for memory growth diagnosis</title>
  <desc id="desc">A flowchart showing how to use memory_profiler to reproduce a memory scenario, annotate the target function, read Mem usage and Increment, classify allocation patterns, and choose a memory optimization action.</desc>
  <rect width="1280" height="720" rx="36" fill="#0f172a"/>
  <rect x="56" y="48" width="1168" height="624" rx="30" fill="#111827" stroke="#334155" stroke-width="2"/>

  <text x="96" y="108" fill="#f8fafc" font-size="32" font-family="Arial" font-weight="700">Memory growth diagnosis</text>
  <text x="640" y="137" fill="#cbd5e1" font-size="14" font-family="Arial" text-anchor="middle"><tspan x="640" y="137">Inspect increments to separate peaks,</tspan><tspan x="640" dy="17.5">leaks, and long lifetimes.</tspan></text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#10b981"/>
    </marker>
  </defs>

  <g font-family="Arial">
    <rect x="92" y="198" width="190" height="94" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="107.04" y="228.04" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start"><tspan x="107.04" dy="0">1. Reproduce the</tspan><tspan x="107.04" dy="18.3">memory scene</tspan></text>
    <text x="103.28" y="277.7" fill="#cbd5e1" font-size="12" text-anchor="start"><tspan x="103.28" dy="0">Load historical data</tspan></text>
    <text x="103.28" y="260.54" fill="#cbd5e1" font-size="12" text-anchor="start"><tspan x="103.28" dy="0">Or create objects in batches</tspan></text>

    <rect x="326" y="198" width="190" height="94" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="341.04" y="227.79" fill="#f8fafc" font-size="13.5" font-weight="700" text-anchor="start"><tspan x="341.04" dy="0">2. Label function</tspan></text>
    <text x="341.04" y="273.79" fill="#cbd5e1" font-size="12" text-anchor="start"><tspan x="341.04" dy="0">@profile</tspan></text>
    <text x="341.04" y="243.95" fill="#cbd5e1" font-size="12" text-anchor="start"><tspan x="341.04" dy="0">Only allocation boundaries are</tspan><tspan x="341.04" dy="14.16">included</tspan></text>

    <rect x="560" y="198" width="190" height="94" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="571.28" y="233.99" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start"><tspan x="571.28" dy="0">3. Read increment</tspan></text>
    <text x="571.28" y="251.69" fill="#cbd5e1" font-size="12" text-anchor="start"><tspan x="571.28" dy="0">Mem usage</tspan></text>
    <text x="571.28" y="268.85" fill="#cbd5e1" font-size="12" text-anchor="start"><tspan x="571.28" dy="0">Increment</tspan></text>

    <rect x="794" y="198" width="190" height="94" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="805.28" y="233.99" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start"><tspan x="805.28" dy="0">4. Judgment mode</tspan></text>
    <text x="805.28" y="251.69" fill="#cbd5e1" font-size="12" text-anchor="start"><tspan x="805.28" dy="0">Peak/Leakage</tspan></text>
    <text x="805.28" y="268.85" fill="#cbd5e1" font-size="12" text-anchor="start"><tspan x="805.28" dy="0">Life cycle is too long</tspan></text>

    <rect x="1028" y="198" width="162" height="94" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="1039.28" y="233.99" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start"><tspan x="1039.28" dy="0">5. Select an action</tspan></text>
    <text x="1039.28" y="251.69" fill="#cbd5e1" font-size="12" text-anchor="start"><tspan x="1039.28" dy="0">Generator/Obje ct Pool</tspan></text>
    <text x="1039.28" y="268.85" fill="#cbd5e1" font-size="12" text-anchor="start"><tspan x="1039.28" dy="0">preallocate/re lease</tspan></text>

    <path d="M282 245 H316" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M516 245 H550" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M750 245 H784" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M984 245 H1018" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  </g>

  <g font-family="Arial">
    <text x="96" y="360" fill="#f8fafc" font-size="24" font-weight="700">Interpreting increment</text>

    <rect x="96" y="394" width="254" height="132" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="112" y="442.42" fill="#bfdbfe" font-size="15" font-weight="700" text-anchor="start"><tspan x="112" dy="0">Significant growth in single line</tspan></text>
    <text x="112" y="458.82" fill="#e2e8f0" font-size="12" text-anchor="start"><tspan x="112" dy="0">Load or copy once</tspan></text>
    <text x="112" y="474.74" fill="#cbd5e1" font-size="12" text-anchor="start"><tspan x="112" dy="0">Switch to streaming reading</tspan></text>
    <text x="112" y="490.66" fill="#cbd5e1" font-size="12" text-anchor="start"><tspan x="112" dy="0">or load in batches</tspan></text>

    <rect x="384" y="394" width="254" height="132" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="400" y="433.72" fill="#a7f3d0" font-size="15" font-weight="700" text-anchor="start"><tspan x="400" dy="0">Continuous growth within the</tspan><tspan x="400" dy="17.7">cycle</tspan></text>
    <text x="400" y="467.52" fill="#e2e8f0" font-size="12" text-anchor="start"><tspan x="400" dy="0">Object life cycle is too long</tspan></text>
    <text x="400" y="499.36" fill="#cbd5e1" font-size="12" text-anchor="start"><tspan x="400" dy="0">Object pool/reuse</tspan></text>
    <text x="400" y="483.44" fill="#cbd5e1" font-size="12" text-anchor="start"><tspan x="400" dy="0">Release references promptly</tspan></text>

    <rect x="672" y="394" width="254" height="132" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="688" y="442.42" fill="#fde68a" font-size="15" font-weight="700" text-anchor="start"><tspan x="688" dy="0">The peak is high but will fall back</tspan></text>
    <text x="688" y="458.82" fill="#e2e8f0" font-size="12" text-anchor="start"><tspan x="688" dy="0">Temporary array or conversion</tspan></text>
    <text x="688" y="474.74" fill="#cbd5e1" font-size="12" text-anchor="start"><tspan x="688" dy="0">Pre-allocated/compute d in place</tspan></text>
    <text x="688" y="490.66" fill="#cbd5e1" font-size="12" text-anchor="start"><tspan x="688" dy="0">Control batch size</tspan></text>

    <rect x="960" y="394" width="224" height="132" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="976" y="442.42" fill="#bae6fd" font-size="15" font-weight="700" text-anchor="start"><tspan x="976" dy="0">Growth does not fall back</tspan></text>
    <text x="976" y="458.82" fill="#e2e8f0" font-size="12" text-anchor="start"><tspan x="976" dy="0">Suspected leak or cache runaway</tspan></text>
    <text x="976" y="474.74" fill="#cbd5e1" font-size="12" text-anchor="start"><tspan x="976" dy="0">plus upper limit</tspan></text>
    <text x="976" y="490.66" fill="#cbd5e1" font-size="12" text-anchor="start"><tspan x="976" dy="0">and release strategy</tspan></text>
  </g>

  <rect x="118" y="584" width="1044" height="52" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="146" y="612" fill="#cbd5e1" font-size="14" font-family="Arial" text-anchor="start"><tspan x="146" y="612">Boundary: trends are not leak proof; confirm with</tspan><tspan x="146" dy="16.52">GC, cache caps, and long-run evidence.</tspan></text>
</svg>
