<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" data-figure-id="FIG-009" data-visual-pattern="flowchart 风格">
  <title id="title">memory_profiler workflow for memory growth diagnosis</title>
  <desc id="desc">A flowchart showing how to use memory_profiler to reproduce a memory scenario, annotate the target function, read Mem usage and Increment, classify allocation patterns, and choose a memory optimization action.</desc>
  <rect width="1280" height="720" rx="36" fill="#0f172a"/>
  <rect x="56" y="48" width="1168" height="624" rx="30" fill="#111827" stroke="#334155" stroke-width="2"/>

  <text x="96" y="108" fill="#f8fafc" font-size="32" font-family="Arial" font-weight="700">memory_profiler 使用流程 / Memory Growth Diagnosis</text>
  <text x="96" y="144" fill="#cbd5e1" font-size="19" font-family="Arial">当问题从“函数慢”转向“内存持续增长”，先看增量，再判断是峰值、泄漏还是对象生命周期过长。</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#10b981"/>
    </marker>
  </defs>

  <g font-family="Arial">
    <rect x="92" y="198" width="190" height="94" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="120" y="232" fill="#f8fafc" font-size="21" font-weight="700">1. 复现内存场景</text>
    <text x="120" y="262" fill="#cbd5e1" font-size="18">加载历史数据</text>
    <text x="120" y="286" fill="#cbd5e1" font-size="18">或批量创建对象</text>

    <rect x="326" y="198" width="190" height="94" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="354" y="232" fill="#f8fafc" font-size="21" font-weight="700">2. 标注函数</text>
    <text x="354" y="262" fill="#cbd5e1" font-size="18">@profile</text>
    <text x="354" y="286" fill="#cbd5e1" font-size="18">只包分配边界</text>

    <rect x="560" y="198" width="190" height="94" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="588" y="232" fill="#f8fafc" font-size="21" font-weight="700">3. 读取增量</text>
    <text x="588" y="262" fill="#cbd5e1" font-size="18">Mem usage</text>
    <text x="588" y="286" fill="#cbd5e1" font-size="18">Increment</text>

    <rect x="794" y="198" width="190" height="94" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="822" y="232" fill="#f8fafc" font-size="21" font-weight="700">4. 判断模式</text>
    <text x="822" y="262" fill="#cbd5e1" font-size="18">峰值 / 泄漏</text>
    <text x="822" y="286" fill="#cbd5e1" font-size="18">生命周期过长</text>

    <rect x="1028" y="198" width="162" height="94" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="1054" y="232" fill="#f8fafc" font-size="21" font-weight="700">5. 选择动作</text>
    <text x="1054" y="262" fill="#cbd5e1" font-size="18">生成器 / 对象池</text>
    <text x="1054" y="286" fill="#cbd5e1" font-size="18">预分配 / 释放</text>

    <path d="M282 245 H316" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M516 245 H550" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M750 245 H784" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M984 245 H1018" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  </g>

  <g font-family="Arial">
    <text x="96" y="360" fill="#f8fafc" font-size="24" font-weight="700">Increment 怎么解释 / Interpreting Increment</text>

    <rect x="96" y="394" width="254" height="132" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="122" y="430" fill="#bfdbfe" font-size="21" font-weight="700">单行大幅增长</text>
    <text x="122" y="462" fill="#e2e8f0" font-size="18">一次性加载或复制</text>
    <text x="122" y="488" fill="#cbd5e1" font-size="18">改流式读取</text>
    <text x="122" y="514" fill="#cbd5e1" font-size="18">或分批加载</text>

    <rect x="384" y="394" width="254" height="132" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="410" y="430" fill="#a7f3d0" font-size="21" font-weight="700">循环内持续增长</text>
    <text x="410" y="462" fill="#e2e8f0" font-size="18">对象生命周期过长</text>
    <text x="410" y="488" fill="#cbd5e1" font-size="18">对象池 / 复用</text>
    <text x="410" y="514" fill="#cbd5e1" font-size="18">及时释放引用</text>

    <rect x="672" y="394" width="254" height="132" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="698" y="430" fill="#fde68a" font-size="21" font-weight="700">峰值高但会回落</text>
    <text x="698" y="462" fill="#e2e8f0" font-size="18">临时数组或转换</text>
    <text x="698" y="488" fill="#cbd5e1" font-size="18">预分配 / 原地计算</text>
    <text x="698" y="514" fill="#cbd5e1" font-size="18">控制批次大小</text>

    <rect x="960" y="394" width="224" height="132" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="986" y="430" fill="#bae6fd" font-size="21" font-weight="700">增长不回落</text>
    <text x="986" y="462" fill="#e2e8f0" font-size="18">疑似泄漏或缓存失控</text>
    <text x="986" y="488" fill="#cbd5e1" font-size="18">加上上限</text>
    <text x="986" y="514" fill="#cbd5e1" font-size="18">和释放策略</text>
  </g>

  <rect x="118" y="584" width="1044" height="52" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="146" y="617" fill="#cbd5e1" font-size="19" font-family="Arial">边界原则：memory_profiler 解释进程内存趋势；排查真实泄漏时仍要结合 GC、缓存上限和长期运行观测。</text>
</svg>
