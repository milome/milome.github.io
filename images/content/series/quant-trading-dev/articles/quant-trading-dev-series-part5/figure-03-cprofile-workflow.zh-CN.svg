<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc" data-figure-id="FIG-007" data-visual-pattern="flowchart 风格">
  <title id="title">cProfile workflow for quant trading performance diagnosis</title>
  <desc id="desc">A flowchart showing how to choose a reproducible action, run cProfile, sort stats, classify bottlenecks, and decide next profiling action.</desc>
  <rect width="1280" height="720" rx="36" fill="#0f172a"/>
  <rect x="56" y="48" width="1168" height="624" rx="30" fill="#111827" stroke="#334155" stroke-width="2"/>

  <text x="96" y="108" fill="#f8fafc" font-size="32" font-family="Arial" font-weight="700">cProfile 使用流程 / Function-Level Profiling Flow</text>
  <text x="96" y="144" fill="#cbd5e1" font-size="19" font-family="Arial">从一次可复现的用户动作开始，把“感觉慢”收敛成可排序、可解释、可验证的函数级证据。</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#60a5fa"/>
    </marker>
  </defs>

  <g font-family="Arial">
    <rect x="90" y="210" width="190" height="96" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="118" y="244" fill="#f8fafc" font-size="21" font-weight="700">1. 选定动作</text>
    <text x="118" y="274" fill="#cbd5e1" font-size="18">例如加载 10000 根</text>
    <text x="118" y="298" fill="#cbd5e1" font-size="18">K 线或切换周期</text>

    <rect x="330" y="210" width="190" height="96" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="358" y="244" fill="#f8fafc" font-size="21" font-weight="700">2. 包住边界</text>
    <text x="358" y="274" fill="#cbd5e1" font-size="18">enable / disable</text>
    <text x="358" y="298" fill="#cbd5e1" font-size="18">只覆盖目标链路</text>

    <rect x="570" y="210" width="190" height="96" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="598" y="244" fill="#f8fafc" font-size="21" font-weight="700">3. 排序结果</text>
    <text x="598" y="274" fill="#cbd5e1" font-size="18">先看 cumtime</text>
    <text x="598" y="298" fill="#cbd5e1" font-size="18">再看 tottime</text>

    <rect x="810" y="210" width="190" height="96" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="838" y="244" fill="#f8fafc" font-size="21" font-weight="700">4. 分类瓶颈</text>
    <text x="838" y="274" fill="#cbd5e1" font-size="18">热点函数 / 子调用</text>
    <text x="838" y="298" fill="#cbd5e1" font-size="18">高频小调用</text>

    <rect x="1040" y="210" width="150" height="96" rx="18" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="1066" y="244" fill="#f8fafc" font-size="21" font-weight="700">5. 下一步</text>
    <text x="1066" y="274" fill="#cbd5e1" font-size="18">line_profiler</text>
    <text x="1066" y="298" fill="#cbd5e1" font-size="18">或 benchmark</text>

    <path d="M280 258 H320" stroke="#60a5fa" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M520 258 H560" stroke="#60a5fa" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M760 258 H800" stroke="#60a5fa" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M1000 258 H1030" stroke="#60a5fa" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  </g>

  <g font-family="Arial">
    <text x="96" y="376" fill="#f8fafc" font-size="24" font-weight="700">结果怎么读 / Reading the stats</text>

    <rect x="96" y="410" width="332" height="120" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="124" y="445" fill="#bfdbfe" font-size="21" font-weight="700">高 tottime + 高 ncalls</text>
    <text x="124" y="478" fill="#e2e8f0" font-size="18">函数自身就是热点</text>
    <text x="124" y="505" fill="#cbd5e1" font-size="18">优先看算法、缓存、批处理</text>

    <rect x="474" y="410" width="332" height="120" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="502" y="445" fill="#a7f3d0" font-size="21" font-weight="700">高 cumtime + 低 tottime</text>
    <text x="502" y="478" fill="#e2e8f0" font-size="18">慢在子调用或 I/O</text>
    <text x="502" y="505" fill="#cbd5e1" font-size="18">继续下钻调用树和依赖边界</text>

    <rect x="852" y="410" width="332" height="120" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="880" y="445" fill="#fde68a" font-size="21" font-weight="700">低 percall + 高 ncalls</text>
    <text x="880" y="478" fill="#e2e8f0" font-size="18">单次不慢但调用太多</text>
    <text x="880" y="505" fill="#cbd5e1" font-size="18">优先合并、窗口化或去重复</text>
  </g>

  <rect x="126" y="584" width="1028" height="52" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="154" y="617" fill="#cbd5e1" font-size="19" font-family="Arial">边界原则：cProfile 先定位函数级方向；真正改代码前，还需要最小复现、定向 benchmark 和正确性断言。</text>
</svg>
