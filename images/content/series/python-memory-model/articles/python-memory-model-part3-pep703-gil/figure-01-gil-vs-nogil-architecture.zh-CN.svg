<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720">
  <title>GIL vs nogil架构对比</title>
  <desc>对比GIL全局锁与偏向引用计数(BRC)的nogil架构演进。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#5a5a5a"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#5a5a5a"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#c44"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#4a5"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000015"/>
    </filter>
    <linearGradient id="gilGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f4d4c1"/>
      <stop offset="100%" style="stop-color:#f4d4c1"/>
    </linearGradient>
    <linearGradient id="nogilGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c1e4d4"/>
      <stop offset="100%" style="stop-color:#c1e4d4"/>
    </linearGradient>
    <linearGradient id="middleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4d4f4"/>
      <stop offset="100%" style="stop-color:#d4d4f4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="720" fill="#f8f6f3"/>

  <!-- ============ LEFT SIDE: GIL ============ -->
  <rect x="30" y="50" width="250" height="560" rx="12" fill="#fef8f4" stroke="#d4a080" stroke-width="2" stroke-dasharray="4,2" opacity="0.6"/>
  <text x="155" y="80" text-anchor="middle" fill="#8a5a40" font-size="16" font-weight="700">GIL 全局锁</text>

  <!-- GIL Global Lock -->
  <rect x="60" y="100" width="190" height="80" rx="12" fill="#f4d4c1" stroke="#8a5a40" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="155" y="128" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="600">GIL Global Lock</text>
  <text x="155" y="148" text-anchor="middle" fill="#6a6a6a" font-size="11">全局解释器锁</text>
  <text x="155" y="165" text-anchor="middle" fill="#8a5a40" font-size="10" font-style="italic">单一执行点控制</text>

  <!-- Single Thread Execution -->
  <rect x="60" y="200" width="190" height="70" rx="10" fill="#e8d4c8" stroke="#8a5a40" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="225" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Single Thread</text>
  <text x="155" y="242" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Execution</text>
  <text x="155" y="258" text-anchor="middle" fill="#6a6a6a" font-size="11">单线程执行</text>

  <!-- ob_refcnt (atomic) -->
  <rect x="60" y="290" width="190" height="70" rx="10" fill="#e8e6e3" stroke="#5a5a5a" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="315" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">ob_refcnt</text>
  <text x="155" y="332" text-anchor="middle" fill="#6a6a6a" font-size="11">原子引用计数</text>
  <text x="155" y="348" text-anchor="middle" fill="#5a5a5a" font-size="10">atomic</text>

  <!-- 72 Processes Workaround -->
  <rect x="60" y="380" width="190" height="80" rx="10" fill="#f4e4d4" stroke="#a08060" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="405" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">72 Processes</text>
  <text x="155" y="422" text-anchor="middle" fill="#6a6a6a" font-size="11">多进程 workaround</text>
  <text x="155" y="440" text-anchor="middle" fill="#8a6a4a" font-size="10">内存隔离 · 数据序列化</text>

  <!-- Lock contention indicator -->
  <rect x="60" y="480" width="190" height="100" rx="10" fill="#fff0e8" stroke="#c48060" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#shadow)"/>
  <text x="155" y="505" text-anchor="middle" fill="#8a5a40" font-size="12" font-weight="600">锁竞争</text>
  <text x="155" y="525" text-anchor="middle" fill="#6a6a6a" font-size="10">所有线程竞争同一把锁</text>
  <text x="155" y="545" text-anchor="middle" fill="#6a6a6a" font-size="10">上下文切换开销大</text>
  <text x="155" y="565" text-anchor="middle" fill="#8a5a40" font-size="10">无法利用多核</text>

  <!-- ============ RIGHT SIDE: NOGIL ============ -->
  <rect x="620" y="50" width="250" height="560" rx="12" fill="#f4fef8" stroke="#60a080" stroke-width="2" stroke-dasharray="4,2" opacity="0.6"/>
  <text x="745" y="80" text-anchor="middle" fill="#408060" font-size="16" font-weight="700">nogil 细粒度锁</text>

  <!-- ob_tid -->
  <rect x="650" y="100" width="190" height="60" rx="10" fill="#c1e4d4" stroke="#408060" stroke-width="2" filter="url(#shadow)"/>
  <text x="745" y="125" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">ob_tid (Thread ID)</text>
  <text x="745" y="145" text-anchor="middle" fill="#408060" font-size="10">拥有者线程标识</text>

  <!-- ob_ref_local (biased) -->
  <rect x="650" y="175" width="190" height="65" rx="10" fill="#d4f4e4" stroke="#408060" stroke-width="2" filter="url(#shadow)"/>
  <text x="745" y="200" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">ob_ref_local</text>
  <text x="745" y="217" text-anchor="middle" fill="#6a6a6a" font-size="11">偏向引用计数</text>
  <text x="745" y="233" text-anchor="middle" fill="#408060" font-size="10">biased (拥有者线程独享)</text>

  <!-- ob_ref_shared (atomic) -->
  <rect x="650" y="255" width="190" height="65" rx="10" fill="#e4f4e8" stroke="#408060" stroke-width="2" filter="url(#shadow)"/>
  <text x="745" y="280" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">ob_ref_shared</text>
  <text x="745" y="297" text-anchor="middle" fill="#6a6a6a" font-size="11">共享引用计数</text>
  <text x="745" y="313" text-anchor="middle" fill="#5a5a5a" font-size="10">atomic (跨线程安全)</text>

  <!-- ob_mutex (per-object) -->
  <rect x="650" y="335" width="190" height="65" rx="10" fill="#d4e8e4" stroke="#408060" stroke-width="2" filter="url(#shadow)"/>
  <text x="745" y="360" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">ob_mutex</text>
  <text x="745" y="377" text-anchor="middle" fill="#6a6a6a" font-size="11">每对象互斥锁</text>
  <text x="745" y="393" text-anchor="middle" fill="#408060" font-size="10">per-object locking</text>

  <!-- Single Process Multi-thread -->
  <rect x="650" y="415" width="190" height="80" rx="10" fill="#e4f8f0" stroke="#408060" stroke-width="2" filter="url(#shadow)"/>
  <text x="745" y="440" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Single Process</text>
  <text x="745" y="457" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Multi-thread</text>
  <text x="745" y="478" text-anchor="middle" fill="#408060" font-size="10">真并行 · 共享内存</text>

  <!-- BRC state machine -->
  <rect x="650" y="510" width="190" height="85" rx="10" fill="#f0f8f4" stroke="#60a080" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#shadow)"/>
  <text x="745" y="535" text-anchor="middle" fill="#408060" font-size="12" font-weight="600">BRC 状态机</text>
  <text x="745" y="555" text-anchor="middle" fill="#6a6a6a" font-size="10">Biased → Shared</text>
  <text x="745" y="570" text-anchor="middle" fill="#6a6a6a" font-size="10">状态转换</text>
  <text x="745" y="585" text-anchor="middle" fill="#408060" font-size="10">延迟合并策略</text>

  <!-- ============ MIDDLE: SHARED ============ -->
  <rect x="310" y="50" width="280" height="560" rx="12" fill="#f4f4f8" stroke="#6060a0" stroke-width="2" stroke-dasharray="4,2" opacity="0.6"/>
  <text x="450" y="80" text-anchor="middle" fill="#404080" font-size="16" font-weight="700">共享组件</text>

  <!-- PyObject Structure -->
  <rect x="335" y="100" width="230" height="90" rx="12" fill="#d4d4f4" stroke="#404080" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="450" y="130" text-anchor="middle" fill="#1a1a1a" font-size="15" font-weight="600">PyObject Structure</text>
  <text x="450" y="152" text-anchor="middle" fill="#6a6a6a" font-size="12">Python 对象基础结构</text>
  <text x="450" y="172" text-anchor="middle" fill="#5050a0" font-size="11">ob_type · ob_refcnt</text>

  <!-- Thread A -->
  <rect x="335" y="210" width="70" height="110" rx="10" fill="#e8e8f8" stroke="#6060a0" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="240" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Thread</text>
  <text x="370" y="260" text-anchor="middle" fill="#404080" font-size="16" font-weight="700">A</text>
  <text x="370" y="285" text-anchor="middle" fill="#6a6a6a" font-size="10">执行线程</text>
  <text x="370" y="305" text-anchor="middle" fill="#5050a0" font-size="10">CPU Core 1</text>

  <!-- Thread B -->
  <rect x="415" y="210" width="70" height="110" rx="10" fill="#e8e8f8" stroke="#6060a0" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="240" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Thread</text>
  <text x="450" y="260" text-anchor="middle" fill="#404080" font-size="16" font-weight="700">B</text>
  <text x="450" y="285" text-anchor="middle" fill="#6a6a6a" font-size="10">执行线程</text>
  <text x="450" y="305" text-anchor="middle" fill="#5050a0" font-size="10">CPU Core 2</text>

  <!-- Thread C -->
  <rect x="495" y="210" width="70" height="110" rx="10" fill="#e8e8f8" stroke="#6060a0" stroke-width="2" filter="url(#shadow)"/>
  <text x="530" y="240" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">Thread</text>
  <text x="530" y="260" text-anchor="middle" fill="#404080" font-size="16" font-weight="700">C</text>
  <text x="530" y="285" text-anchor="middle" fill="#6a6a6a" font-size="10">执行线程</text>
  <text x="530" y="305" text-anchor="middle" fill="#5050a0" font-size="10">CPU Core 3</text>

  <!-- Comparison arrows/labels -->
  <rect x="335" y="340" width="230" height="130" rx="10" fill="#ffffff" stroke="#9090a0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="365" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">架构演进核心对比</text>

  <text x="350" y="395" fill="#8a5a40" font-size="11">GIL: 集中式控制</text>
  <text x="350" y="415" fill="#6a6a6a" font-size="10">所有线程争夺单一锁</text>

  <text x="350" y="440" fill="#408060" font-size="11">nogil: 分布式控制</text>
  <text x="350" y="458" fill="#6a6a6a" font-size="10">每对象独立锁，细粒度</text>

  <!-- Evolution path -->
  <rect x="335" y="490" width="230" height="100" rx="10" fill="#f8f8fc" stroke="#6060a0" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#shadow)"/>
  <text x="450" y="515" text-anchor="middle" fill="#404080" font-size="12" font-weight="600">演进路径</text>
  <text x="450" y="540" text-anchor="middle" fill="#6a6a6a" font-size="10">Global Lock → Local Bias</text>
  <text x="450" y="560" text-anchor="middle" fill="#6a6a6a" font-size="10">Coarse Grain → Fine Grain</text>
  <text x="450" y="580" text-anchor="middle" fill="#5050a0" font-size="10">Single Point → Distributed</text>

  <!-- ============ CONNECTION LINES ============ -->

  <!-- GIL to PyObject -->
  <line x1="250" y1="140" x2="335" y2="145" stroke="#8a5a40" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="280" y="125" width="30" height="16" fill="#f8f6f3" opacity="0.95" rx="3"/>
  <text x="295" y="137" text-anchor="middle" fill="#8a5a40" font-size="10">控制</text>

  <!-- Threads to GIL (contention) -->
  <line x1="335" y1="265" x2="250" y2="235" stroke="#c44" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="380" y1="265" x2="250" y2="265" stroke="#c44" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="460" y1="265" x2="250" y2="265" stroke="#c44" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="285" y="245" width="35" height="16" fill="#f8f6f3" opacity="0.95" rx="3"/>
  <text x="302" y="257" text-anchor="middle" fill="#c44" font-size="10">竞争</text>

  <!-- nogil to PyObject -->
  <line x1="650" y1="130" x2="565" y2="150" stroke="#408060" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="650" y1="205" x2="565" y2="165" stroke="#408060" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="650" y1="285" x2="565" y2="175" stroke="#408060" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="650" y1="365" x2="565" y2="185" stroke="#408060" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="590" y="155" width="30" height="16" fill="#f8f6f3" opacity="0.95" rx="3"/>
  <text x="605" y="167" text-anchor="middle" fill="#408060" font-size="10">关联</text>

  <!-- Threads to nogil (parallel) -->
  <line x1="565" y1="265" x2="650" y2="455" stroke="#4a5" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="580" y="340" width="50" height="18" fill="#f8f6f3" opacity="0.95" rx="3"/>
  <text x="605" y="353" text-anchor="middle" fill="#4a5" font-size="10">并行执行</text>

  <!-- ============ LEGEND ============ -->
  <rect x="30" y="620" width="840" height="75" rx="8" fill="#ffffff" stroke="#d0d0d0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="645" fill="#1a1a1a" font-size="13" font-weight="600">图例说明</text>

  <!-- Legend items -->
  <rect x="50" y="655" width="18" height="12" rx="2" fill="#f4d4c1" stroke="#8a5a40" stroke-width="1"/>
  <text x="75" y="665" fill="#6a6a6a" font-size="10">GIL 组件</text>

  <rect x="150" y="655" width="18" height="12" rx="2" fill="#c1e4d4" stroke="#408060" stroke-width="1"/>
  <text x="175" y="665" fill="#6a6a6a" font-size="10">nogil 组件</text>

  <rect x="260" y="655" width="18" height="12" rx="2" fill="#d4d4f4" stroke="#404080" stroke-width="1"/>
  <text x="285" y="665" fill="#6a6a6a" font-size="10">共享结构</text>

  <line x1="380" y1="661" x2="405" y2="661" stroke="#8a5a40" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="665" fill="#6a6a6a" font-size="10">控制流 (GIL)</text>

  <line x1="500" y1="661" x2="525" y2="661" stroke="#408060" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530" y="665" fill="#6a6a6a" font-size="10">关联流 (nogil)</text>

  <line x1="620" y1="661" x2="645" y2="661" stroke="#c44" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="665" fill="#6a6a6a" font-size="10">锁竞争</text>

  <line x1="710" y1="661" x2="735" y2="661" stroke="#4a5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="740" y="665" fill="#6a6a6a" font-size="10">并行执行</text>

  <!-- System boundary label -->
  <text x="450" y="30" text-anchor="middle" fill="#404040" font-size="14" font-weight="600">System Boundary: CPython Memory Management</text>
</svg>
