<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540">
  <title>Python Memory Architecture Three-Layer Model</title>
  <desc>Shows the Arena-Pool-Block three-layer memory management architecture and allocation strategy.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#5a5a5a"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#5a5a5a"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000010"/>
    </filter>
  </defs>
  <rect width="720" height="540" fill="#f8f6f3"/>
  <rect x="260" y="40" width="200" height="70" rx="12" ry="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="360" y="68" text-anchor="middle" fill="#1a1a1a" font-size="16" font-weight="600">Arena</text>
  <text x="360" y="88" text-anchor="middle" fill="#6a6a6a" font-size="13">256KB</text>
  <rect x="40" y="160" width="140" height="60" rx="10" ry="10" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="185" text-anchor="middle" fill="#1a1a1a" font-size="14" font-weight="600">Size Class Index</text>
  <text x="110" y="203" text-anchor="middle" fill="#6a6a6a" font-size="12">0-63</text>
  <rect x="280" y="160" width="160" height="70" rx="12" ry="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="360" y="188" text-anchor="middle" fill="#1a1a1a" font-size="16" font-weight="600">Pool</text>
  <text x="360" y="208" text-anchor="middle" fill="#6a6a6a" font-size="13">4KB</text>
  <rect x="500" y="140" width="110" height="50" rx="10" ry="10" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2" filter="url(#shadow)"/>
  <text x="555" y="160" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">usedpools</text>
  <text x="555" y="176" text-anchor="middle" fill="#6a6a6a" font-size="11">Available Pool List</text>
  <rect x="500" y="200" width="110" height="50" rx="10" ry="10" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2" filter="url(#shadow)"/>
  <text x="555" y="220" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">freepools</text>
  <text x="555" y="236" text-anchor="middle" fill="#6a6a6a" font-size="11">Free Pool List</text>
  <rect x="300" y="300" width="120" height="70" rx="12" ry="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="360" y="328" text-anchor="middle" fill="#1a1a1a" font-size="16" font-weight="600">Block</text>
  <text x="360" y="348" text-anchor="middle" fill="#6a6a6a" font-size="13">8-512 bytes</text>
  <rect x="60" y="310" width="100" height="50" rx="10" ry="10" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="335" text-anchor="middle" fill="#1a1a1a" font-size="13" font-weight="600">freeblock</text>
  <text x="110" y="351" text-anchor="middle" fill="#6a6a6a" font-size="11">Free Block Ptr</text>
  <line x1="360" y1="110" x2="360" y2="160" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="375" y="128" width="50" height="18" fill="#f8f6f3" opacity="0.95" rx="3"/>
  <text x="400" y="141" text-anchor="middle" fill="#5a5a5a" font-size="12">Contains</text>
  <line x1="360" y1="230" x2="360" y2="300" stroke="#5a5a5a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="375" y="253" width="50" height="18" fill="#f8f6f3" opacity="0.95" rx="3"/>
  <text x="400" y="266" text-anchor="middle" fill="#5a5a5a" font-size="12">Contains</text>
  <line x1="180" y1="190" x2="280" y2="190" stroke="#5a5a5a" stroke-width="1.5" stroke-dasharray="2,3" marker-end="url(#arrow)"/>
  <rect x="215" y="177" width="30" height="16" fill="#f8f6f3" opacity="0.95" rx="3"/>
  <text x="230" y="189" text-anchor="middle" fill="#5a5a5a" font-size="11">Index</text>
  <line x1="500" y1="165" x2="440" y2="180" stroke="#5a5a5a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-dashed)"/>
  <rect x="455" y="157" width="30" height="16" fill="#f8f6f3" opacity="0.95" rx="3"/>
  <text x="470" y="169" text-anchor="middle" fill="#5a5a5a" font-size="11">Tracks</text>
  <line x1="500" y1="225" x2="440" y2="210" stroke="#5a5a5a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-dashed)"/>
  <rect x="455" y="213" width="30" height="16" fill="#f8f6f3" opacity="0.95" rx="3"/>
  <text x="470" y="225" text-anchor="middle" fill="#5a5a5a" font-size="11">Tracks</text>
  <line x1="160" y1="335" x2="300" y2="335" stroke="#5a5a5a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-dashed)"/>
  <rect x="210" y="322" width="30" height="16" fill="#f8f6f3" opacity="0.95" rx="3"/>
  <text x="225" y="334" text-anchor="middle" fill="#5a5a5a" font-size="11">Points</text>
  <rect x="540" y="420" width="160" height="100" rx="8" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.5" opacity="0.9"/>
  <text x="550" y="445" fill="#1a1a1a" font-size="13" font-weight="600">Legend</text>
  <line x1="550" y1="460" x2="575" y2="460" stroke="#5a5a5a" stroke-width="2"/>
  <text x="580" y="464" fill="#6a6a6a" font-size="11">Contains</text>
  <line x1="550" y1="480" x2="575" y2="480" stroke="#5a5a5a" stroke-width="1.5" stroke-dasharray="2,3"/>
  <text x="580" y="484" fill="#6a6a6a" font-size="11">Index</text>
  <line x1="550" y1="500" x2="575" y2="500" stroke="#5a5a5a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="580" y="504" fill="#6a6a6a" font-size="11">Tracks/Points</text>
</svg>