<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540">
  <title>Python GC Three Mechanisms</title>
  <desc>Shows the collaboration of reference counting, generational GC, and cycle detection garbage collection mechanisms.</desc>
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue',
                   Arial, 'PingFang SC', 'Microsoft YaHei', 'SimHei', sans-serif;
    }
  </style>

  <defs>
    <marker id="arrow-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#5a5a5a"/>
    </marker>
    <filter id="shadow-soft">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000010"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="540" fill="#f8f6f3"/>

  <!-- Layer labels on left -->
  <text x="25" y="180" fill="#6a6a6a" font-size="13" font-weight="600">GC Mechanism</text>
  <text x="25" y="374" fill="#6a6a6a" font-size="13" font-weight="600">Trigger</text>
  <text x="25" y="390" fill="#6a6a6a" font-size="13" font-weight="600">Method</text>

  <!-- Column 1: Reference Counting -->
  <!-- Top node -->
  <rect x="80" y="100" width="160" height="70" rx="12" ry="12"
        fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="160" y="132" text-anchor="middle" fill="#1a1a1a" font-size="15" font-weight="600">Reference Counting</text>
  <text x="160" y="155" text-anchor="middle" fill="#4a4a4a" font-size="12">Reference Counting</text>

  <!-- Bottom node -->
  <rect x="80" y="330" width="160" height="70" rx="12" ry="12"
        fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="160" y="362" text-anchor="middle" fill="#1a1a1a" font-size="15" font-weight="600">Immediate</text>
  <text x="160" y="385" text-anchor="middle" fill="#4a4a4a" font-size="12">Immediate</text>

  <!-- Column 2: Generational GC -->
  <!-- Top node -->
  <rect x="280" y="100" width="160" height="70" rx="12" ry="12"
        fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="360" y="132" text-anchor="middle" fill="#1a1a1a" font-size="15" font-weight="600">Generational GC</text>
  <text x="360" y="155" text-anchor="middle" fill="#4a4a4a" font-size="12">Generational GC</text>

  <!-- Bottom node -->
  <rect x="280" y="330" width="160" height="70" rx="12" ry="12"
        fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="360" y="362" text-anchor="middle" fill="#1a1a1a" font-size="15" font-weight="600">Threshold</text>
  <text x="360" y="385" text-anchor="middle" fill="#4a4a4a" font-size="12">Threshold</text>

  <!-- Column 3: Cycle Detection -->
  <!-- Top node -->
  <rect x="480" y="100" width="160" height="70" rx="12" ry="12"
        fill="#d4c4e6" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="560" y="132" text-anchor="middle" fill="#1a1a1a" font-size="15" font-weight="600">Cycle Detection</text>
  <text x="560" y="155" text-anchor="middle" fill="#4a4a4a" font-size="12">Cycle Detection</text>

  <!-- Bottom node -->
  <rect x="480" y="330" width="160" height="70" rx="12" ry="12"
        fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.5" filter="url(#shadow-soft)"/>
  <text x="560" y="362" text-anchor="middle" fill="#1a1a1a" font-size="15" font-weight="600">Mark-Sweep</text>
  <text x="560" y="385" text-anchor="middle" fill="#4a4a4a" font-size="12">Mark-Sweep</text>

  <!-- Vertical arrows (mechanism to trigger) -->
  <!-- Reference Counting -> Immediate -->
  <line x1="160" y1="180" x2="160" y2="320"
        stroke="#5a5a5a" stroke-width="2" marker-end="url(#arrow-head)"/>

  <!-- Generational GC -> Threshold -->
  <line x1="360" y1="180" x2="360" y2="320"
        stroke="#5a5a5a" stroke-width="2" marker-end="url(#arrow-head)"/>

  <!-- Cycle Detection -> Mark-Sweep -->
  <line x1="560" y1="180" x2="560" y2="320"
        stroke="#5a5a5a" stroke-width="2" marker-end="url(#arrow-head)"/>

  <!-- Horizontal arrows showing collaboration -->
  <!-- Reference Counting handles most objects -->
  <text x="160" y="245" text-anchor="middle" fill="#5a5a5a" font-size="11">Handles most objects</text>

  <!-- Generational GC handles cycles -->
  <text x="360" y="245" text-anchor="middle" fill="#5a5a5a" font-size="11">Handles cycles</text>

  <!-- Cycle Detection is part of GC -->
  <text x="560" y="245" text-anchor="middle" fill="#5a5a5a" font-size="11">Part of GC</text>

  <!-- Connection between GC mechanisms -->
  <line x1="240" y1="135" x2="270" y2="135"
        stroke="#5a5a5a" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="440" y1="135" x2="470" y2="135"
        stroke="#5a5a5a" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Bottom label showing relationship -->
  <text x="360" y="450" text-anchor="middle" fill="#6a6a6a" font-size="13">
    Three mechanisms collaborate
  </text>

  <!-- Legend in bottom right -->
  <rect x="520" y="470" width="160" height="55" rx="8" ry="8"
        fill="#ffffff" stroke="#4a4a4a" stroke-width="1.5"/>
  <text x="535" y="490" fill="#1a1a1a" font-size="12" font-weight="600">Legend</text>

  <line x1="535" y1="500" x2="555" y2="500" stroke="#5a5a5a" stroke-width="2"/>
  <text x="565" y="505" fill="#6a6a6a" font-size="11">Main Flow</text>

  <line x1="535" y1="512" x2="555" y2="512" stroke="#5a5a5a" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="565" y="517" fill="#6a6a6a" font-size="11">Collaboration</text>
</svg>
