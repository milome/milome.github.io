<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 690" width="800" height="690">
  <title>Python生态飞轮</title>
  <desc>展示Python在AI领域的生态飞轮效应：人才-库-应用-投资的正向循环。</desc>
    <defs>
        <!-- Gradients -->
        <linearGradient id="grad-talent" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="grad-libs" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="grad-apps" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="grad-invest" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="grad-timeline" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#4facfe" />
            <stop offset="33%" style="stop-color:#00f2fe" />
            <stop offset="66%" style="stop-color:#43e97b" />
            <stop offset="100%" style="stop-color:#fa709a" />
        </linearGradient>

        <!-- Arrow Marker -->
        <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <polygon points="0 0, 10 3, 0 6" fill="rgba(255,255,255,0.7)" />
        </marker>

        <!-- Glow Filter -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Drop Shadow -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="800" height="690" fill="#1a1a2e" rx="16"/>

    <!-- Background Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <rect width="800" height="520" fill="url(#grid)" />

    <!-- Title -->
    <text x="400" y="35" fill="#fff" font-size="22" font-weight="600" text-anchor="middle">Python AI 生态系统飞轮</text>
    <text x="400" y="58" fill="rgba(255,255,255,0.6)" font-size="12" text-anchor="middle">人才 → 库/框架 → 应用 → 投资 → 人才的自我强化循环</text>

    <!-- Connection Arrows with Animation Paths -->
    <!-- Talent -> Libraries (Top arc) -->
    <path d="M 300 165 Q 400 105 500 165" fill="none" stroke="url(#grad-talent)" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead)" opacity="0.9"/>
    <text x="400" y="118" fill="rgba(255,255,255,0.8)" font-size="11" text-anchor="middle" font-weight="500">创造</text>

    <!-- Libraries -> Applications (Right arc) -->
    <path d="M 580 265 Q 640 345 580 425" fill="none" stroke="url(#grad-libs)" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead)" opacity="0.9"/>
    <text x="635" y="345" fill="rgba(255,255,255,0.8)" font-size="11" text-anchor="middle" font-weight="500">支撑</text>

    <!-- Applications -> Investment (Bottom arc) -->
    <path d="M 500 475 Q 400 535 300 475" fill="none" stroke="url(#grad-apps)" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead)" opacity="0.9"/>
    <text x="400" y="520" fill="rgba(255,255,255,0.8)" font-size="11" text-anchor="middle" font-weight="500">证明价值</text>

    <!-- Investment -> Talent (Left arc) -->
    <path d="M 220 425 Q 160 345 220 265" fill="none" stroke="url(#grad-invest)" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrowhead)" opacity="0.9"/>
    <text x="165" y="345" fill="rgba(255,255,255,0.8)" font-size="11" text-anchor="middle" font-weight="500">吸引</text>

    <!-- Center Flywheel Circle -->
    <circle cx="400" cy="320" r="70" fill="rgba(255, 193, 7, 0.1)" stroke="#ffc107" stroke-width="2.5" stroke-dasharray="8,4" filter="url(#glow)"/>

    <!-- Rotating Dashed Ring (Static representation) -->
    <circle cx="400" cy="320" r="85" fill="none" stroke="#ffc107" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4"/>

    <!-- Center Text -->
    <text x="400" y="312" fill="#ffc107" font-size="15" font-weight="700" text-anchor="middle">飞轮效应</text>
    <text x="400" y="332" fill="#ffc107" font-size="10" text-anchor="middle" opacity="0.9">Flywheel Effect</text>

    <!-- Component: Talent -->
    <g filter="url(#shadow)">
        <rect x="160" y="140" width="140" height="90" rx="14" fill="url(#grad-talent)" opacity="0.95"/>
        <text x="230" y="170" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">人才</text>
        <text x="230" y="188" fill="rgba(255,255,255,0.85)" font-size="10" text-anchor="middle">Talent Pool</text>
        <text x="230" y="208" fill="rgba(255,255,255,0.7)" font-size="9" text-anchor="middle">研究人员 · 工程师 · 教育者</text>
    </g>

    <!-- Component: Libraries -->
    <g filter="url(#shadow)">
        <rect x="500" y="140" width="140" height="90" rx="14" fill="url(#grad-libs)" opacity="0.95"/>
        <text x="570" y="170" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">库/框架</text>
        <text x="570" y="188" fill="rgba(255,255,255,0.85)" font-size="10" text-anchor="middle">Libraries</text>
        <text x="570" y="208" fill="rgba(255,255,255,0.7)" font-size="8" text-anchor="middle">NumPy · PyTorch · Transformers</text>
    </g>

    <!-- Component: Applications -->
    <g filter="url(#shadow)">
        <rect x="500" y="410" width="140" height="90" rx="14" fill="url(#grad-apps)" opacity="0.95"/>
        <text x="570" y="440" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">应用</text>
        <text x="570" y="458" fill="rgba(255,255,255,0.85)" font-size="10" text-anchor="middle">Applications</text>
        <text x="570" y="478" fill="rgba(255,255,255,0.7)" font-size="9" text-anchor="middle">研究 · 生产 · 产品化</text>
    </g>

    <!-- Component: Investment -->
    <g filter="url(#shadow)">
        <rect x="160" y="410" width="140" height="90" rx="14" fill="url(#grad-invest)" opacity="0.95"/>
        <text x="230" y="440" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">投资</text>
        <text x="230" y="458" fill="rgba(255,255,255,0.85)" font-size="10" text-anchor="middle">Investment</text>
        <text x="230" y="478" fill="rgba(255,255,255,0.7)" font-size="8" text-anchor="middle">Meta · Google · 创业公司</text>
    </g>

    <!-- Key Insight Box -->
    <rect x="50" y="530" width="700" height="55" rx="10" fill="rgba(255, 193, 7, 0.08)" stroke="#ffc107" stroke-width="1.5"/>
    <text x="70" y="550" fill="#ffc107" font-size="12" font-weight="600">核心洞察</text>
    <text x="70" y="570" fill="rgba(255, 255, 255, 0.85)" font-size="11">Python 的生态飞轮已形成正向循环：人才创造工具，工具支撑应用，应用吸引投资，投资回流人才</text>

    <!-- Timeline Section -->
    <text x="70" y="615" fill="#fff" font-size="13" font-weight="600">关键里程碑</text>

    <!-- Timeline Line -->
    <line x1="160" y1="628" x2="730" y2="628" stroke="url(#grad-timeline)" stroke-width="2" stroke-linecap="round"/>

    <!-- Timeline Items -->
    <!-- 2006 NumPy -->
    <circle cx="200" cy="628" r="7" fill="#1a1a2e" stroke="#667eea" stroke-width="3"/>
    <text x="200" y="648" fill="rgba(255,255,255,0.6)" font-size="10" font-weight="600" text-anchor="middle">2006</text>
    <text x="200" y="662" fill="#fff" font-size="11" text-anchor="middle">NumPy</text>

    <!-- 2016 PyTorch -->
    <circle cx="340" cy="628" r="7" fill="#1a1a2e" stroke="#f5576c" stroke-width="3"/>
    <text x="340" y="648" fill="rgba(255,255,255,0.6)" font-size="10" font-weight="600" text-anchor="middle">2016</text>
    <text x="340" y="662" fill="#fff" font-size="11" text-anchor="middle">PyTorch</text>

    <!-- 2019 Transformers -->
    <circle cx="500" cy="628" r="7" fill="#1a1a2e" stroke="#4facfe" stroke-width="3"/>
    <text x="500" y="648" fill="rgba(255,255,255,0.6)" font-size="10" font-weight="600" text-anchor="middle">2019</text>
    <text x="500" y="662" fill="#fff" font-size="11" text-anchor="middle">Transformers</text>

    <!-- 2022 LangChain -->
    <circle cx="680" cy="628" r="7" fill="#1a1a2e" stroke="#43e97b" stroke-width="3"/>
    <text x="680" y="648" fill="rgba(255,255,255,0.6)" font-size="10" font-weight="600" text-anchor="middle">2022</text>
    <text x="680" y="662" fill="#fff" font-size="11" text-anchor="middle">LangChain</text>
</svg>
