<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="400" fill="#F8F6F1"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1A2B4A">
    30分钟K线周期计算示例
  </text>

  <!-- Timeline -->
  <g transform="translate(50, 80)">
    <!-- Base timeline -->
    <line x1="0" y1="200" x2="800" y2="200" stroke="#1A2B4A" stroke-width="3"/>

    <!-- Time markers -->
    <g transform="translate(0, 0)">
      <line x1="0" y1="195" x2="0" y2="215" stroke="#1A2B4A" stroke-width="2"/>
      <text x="0" y="240" text-anchor="middle" font-family="Georgia" font-size="11" fill="#1A2B4A">17:15</text>
      <text x="0" y="255" text-anchor="middle" font-family="Georgia" font-size="9" fill="#6B7B8C">夜盘开始</text>
    </g>

    <g transform="translate(150, 0)">
      <line x1="0" y1="195" x2="0" y2="210" stroke="#6B7B8C" stroke-width="1"/>
      <text x="0" y="240" text-anchor="middle" font-family="Georgia" font-size="10" fill="#6B7B8C">21:15</text>
    </g>

    <g transform="translate(300, 0)">
      <line x1="0" y1="195" x2="0" y2="215" stroke="#C4786A" stroke-width="2"/>
      <text x="0" y="240" text-anchor="middle" font-family="Georgia" font-size="11" fill="#C4786A">03:00</text>
      <text x="0" y="255" text-anchor="middle" font-family="Georgia" font-size="9" fill="#C4786A">夜盘收盘</text>
    </g>

    <!-- Cross session period -->
    <g transform="translate(340, 0)">
      <rect x="0" y="80" width="60" height="100" fill="#C4786A" opacity="0.15" rx="3"/>
      <line x1="30" y1="190" x2="30" y2="215" stroke="#C4786A" stroke-width="2" stroke-dasharray="3,3"/>
      <text x="30" y="235" text-anchor="middle" font-family="Georgia" font-size="10" fill="#C4786A" font-weight="bold">02:45</text>
      <text x="30" y="140" text-anchor="middle" font-family="Georgia" font-size="9" fill="#C4786A">跨市场</text>
      <text x="30" y="155" text-anchor="middle" font-family="Georgia" font-size="9" fill="#C4786A">周期</text>
    </g>

    <g transform="translate(400, 0)">
      <line x1="0" y1="195" x2="0" y2="215" stroke="#5A8A6E" stroke-width="2"/>
      <text x="0" y="240" text-anchor="middle" font-family="Georgia" font-size="11" fill="#5A8A6E">09:15</text>
      <text x="0" y="255" text-anchor="middle" font-family="Georgia" font-size="9" fill="#5A8A6E">日盘开始</text>
    </g>

    <g transform="translate(500, 0)">
      <line x1="0" y1="195" x2="0" y2="210" stroke="#6B7B8C" stroke-width="1"/>
      <text x="0" y="240" text-anchor="middle" font-family="Georgia" font-size="10" fill="#6B7B8C">12:30</text>
    </g>

    <g transform="translate(600, 0)">
      <line x1="0" y1="195" x2="0" y2="210" stroke="#6B7B8C" stroke-width="1"/>
      <text x="0" y="240" text-anchor="middle" font-family="Georgia" font-size="10" fill="#6B7B8C">14:00</text>
    </g>

    <g transform="translate(700, 0)">
      <line x1="0" y1="195" x2="0" y2="215" stroke="#1A2B4A" stroke-width="2"/>
      <text x="0" y="240" text-anchor="middle" font-family="Georgia" font-size="11" fill="#1A2B4A">16:30</text>
      <text x="0" y="255" text-anchor="middle" font-family="Georgia" font-size="9" fill="#6B7B8C">日盘收盘</text>
    </g>

    <!-- 30min period boxes -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="37.5" height="35" fill="#2A4A7A" opacity="0.8" rx="3"/>
      <text x="18.75" y="22" text-anchor="middle" font-family="monospace" font-size="8" fill="#FFFFFF">17:15</text>
    </g>

    <g transform="translate(37.5, 140)">
      <rect x="0" y="0" width="37.5" height="35" fill="#3A5A8A" opacity="0.8" rx="3"/>
      <text x="18.75" y="22" text-anchor="middle" font-family="monospace" font-size="8" fill="#FFFFFF">17:45</text>
    </g>

    <g transform="translate(75, 140)">
      <rect x="0" y="0" width="37.5" height="35" fill="#2A4A7A" opacity="0.8" rx="3"/>
      <text x="18.75" y="22" text-anchor="middle" font-family="monospace" font-size="8" fill="#FFFFFF">18:15</text>
    </g>

    <!-- More periods... -->
    <g transform="translate(112.5, 140)">
      <text x="18.75" y="22" text-anchor="middle" font-family="Georgia" font-size="10" fill="#6B7B8C">...</text>
    </g>

    <!-- Cross session period (special) -->
    <g transform="translate(340, 140)">
      <rect x="0" y="0" width="60" height="35" fill="#C4786A" opacity="0.6" rx="3"/>
      <text x="30" y="22" text-anchor="middle" font-family="monospace" font-size="8" fill="#FFFFFF">02:45</text>
    </g>

    <!-- Day session periods -->
    <g transform="translate(400, 140)">
      <rect x="0" y="0" width="37.5" height="35" fill="#5A8A6E" opacity="0.8" rx="3"/>
      <text x="18.75" y="22" text-anchor="middle" font-family="monospace" font-size="8" fill="#FFFFFF">09:15</text>
    </g>

    <g transform="translate(437.5, 140)">
      <rect x="0" y="0" width="37.5" height="35" fill="#6A9A7E" opacity="0.8" rx="3"/>
      <text x="18.75" y="22" text-anchor="middle" font-family="monospace" font-size="8" fill="#FFFFFF">09:45</text>
    </g>

    <g transform="translate(475, 140)">
      <text x="18.75" y="22" text-anchor="middle" font-family="Georgia" font-size="10" fill="#6B7B8C">...</text>
    </g>

    <!-- Legend -->
    <g transform="translate(550, 50)">
      <rect x="0" y="0" width="230" height="100" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1" rx="5"/>
      <text x="115" y="20" text-anchor="middle" font-family="Georgia" font-size="12" font-weight="bold" fill="#1A2B4A">图例</text>

      <rect x="15" y="35" width="20" height="15" fill="#2A4A7A" opacity="0.8" rx="2"/>
      <text x="45" y="47" font-family="Georgia" font-size="10" fill="#1A2B4A">夜盘周期</text>

      <rect x="15" y="55" width="20" height="15" fill="#5A8A6E" opacity="0.8" rx="2"/>
      <text x="45" y="67" font-family="Georgia" font-size="10" fill="#1A2B4A">日盘周期</text>

      <rect x="120" y="35" width="20" height="15" fill="#C4786A" opacity="0.6" rx="2"/>
      <text x="150" y="47" font-family="Georgia" font-size="10" fill="#1A2B4A">跨市场周期</text>

      <line x1="125" y1="62" x2="135" y2="62" stroke="#C4786A" stroke-width="2" stroke-dasharray="3,3"/>
      <text x="150" y="67" font-family="Georgia" font-size="10" fill="#1A2B4A">无交易时段</text>
    </g>
  </g>

  <!-- Example calculation -->
  <g transform="translate(50, 310)">
    <rect x="0" y="0" width="800" height="70" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1" rx="5"/>
    <text x="20" y="25" font-family="Georgia" font-size="12" font-weight="bold" fill="#1A2B4A">计算示例</text>

    <text x="20" y="50" font-family="monospace" font-size="11" fill="#1A2B4A">输入: 2026-01-05 18:30</text>
    <text x="250" y="50" font-family="monospace" font-size="11" fill="#5A8A6E">→</text>
    <text x="280" y="50" font-family="monospace" font-size="11" fill="#1A2B4A">输出: 2026-01-05 18:15 (夜盘第二根30分钟K线)</text>

    <text x="20" y="65" font-family="monospace" font-size="11" fill="#1A2B4A">输入: 2026-01-05 07:00</text>
    <text x="250" y="65" font-family="monospace" font-size="11" fill="#C4786A">→</text>
    <text x="280" y="65" font-family="monospace" font-size="11" fill="#1A2B4A">输出: 2026-01-05 02:45 (跨市场周期)</text>
  </g>
</svg>
