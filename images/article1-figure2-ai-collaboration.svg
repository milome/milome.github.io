<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#F8F6F1"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1A2B4A">
    AI辅助设计流程
  </text>

  <!-- Flow diagram -->
  <g transform="translate(50, 70)">
    <!-- Stage 1: Problem Description -->
    <rect x="0" y="20" width="140" height="80" fill="#2A4A7A" rx="8"/>
    <text x="70" y="50" text-anchor="middle" font-family="Georgia" font-size="13" fill="#FFFFFF">问题描述</text>
    <text x="70" y="70" text-anchor="middle" font-family="Georgia" font-size="10" fill="#E8E4DC">描述Bug现象</text>
    <text x="70" y="85" text-anchor="middle" font-family="Georgia" font-size="10" fill="#E8E4DC">提供上下文</text>

    <!-- Arrow 1 -->
    <path d="M 140 60 L 180 60" fill="none" stroke="#1A2B4A" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 2: AI Analysis -->
    <rect x="180" y="20" width="140" height="80" fill="#C4786A" rx="8"/>
    <text x="250" y="50" text-anchor="middle" font-family="Georgia" font-size="13" fill="#FFFFFF">AI分析</text>
    <text x="250" y="70" text-anchor="middle" font-family="Georgia" font-size="10" fill="#FFF5F3">枚举边界情况</text>
    <text x="250" y="85" text-anchor="middle" font-family="Georgia" font-size="10" fill="#FFF5F3">识别技术难点</text>

    <!-- Arrow 2 -->
    <path d="M 320 60 L 360 60" fill="none" stroke="#1A2B4A" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 3: Architecture Design -->
    <rect x="360" y="20" width="140" height="80" fill="#5A8A6E" rx="8"/>
    <text x="430" y="50" text-anchor="middle" font-family="Georgia" font-size="13" fill="#FFFFFF">架构设计</text>
    <text x="430" y="70" text-anchor="middle" font-family="Georgia" font-size="10" fill="#E8F4EC">设计代码结构</text>
    <text x="430" y="85" text-anchor="middle" font-family="Georgia" font-size="10" fill="#E8F4EC">定义接口规范</text>

    <!-- Arrow 3 -->
    <path d="M 500 60 L 540 60" fill="none" stroke="#1A2B4A" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Stage 4: Implementation -->
    <rect x="540" y="20" width="140" height="80" fill="#6B5B8A" rx="8"/>
    <text x="610" y="50" text-anchor="middle" font-family="Georgia" font-size="13" fill="#FFFFFF">代码实现</text>
    <text x="610" y="70" text-anchor="middle" font-family="Georgia" font-size="10" fill="#F0EDF5">编写核心函数</text>
    <text x="610" y="85" text-anchor="middle" font-family="Georgia" font-size="10" fill="#F0EDF5">生成测试用例</text>

    <!-- Feedback loop -->
    <path d="M 610 100 Q 610 150 350 150 Q 90 150 70 100" fill="none" stroke="#C4786A" stroke-width="1.5" stroke-dasharray="5,5"/>
    <text x="350" y="165" text-anchor="middle" font-family="Georgia" font-size="11" fill="#C4786A">迭代优化</text>
  </g>

  <!-- Human vs AI responsibilities -->
  <g transform="translate(50, 220)">
    <rect x="0" y="0" width="700" height="140" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="2" rx="10"/>

    <!-- Human column -->
    <text x="120" y="30" text-anchor="middle" font-family="Georgia" font-size="14" font-weight="bold" fill="#1A2B4A">人类职责</text>
    <line x1="20" y1="40" x2="220" y2="40" stroke="#1A2B4A" stroke-width="1"/>

    <g transform="translate(30, 55)">
      <circle cx="8" cy="8" r="6" fill="#2A4A7A"/>
      <text x="20" y="12" font-family="Georgia" font-size="12" fill="#1A2B4A">定义问题和约束</text>

      <circle cx="8" cy="35" r="6" fill="#2A4A7A"/>
      <text x="20" y="39" font-family="Georgia" font-size="12" fill="#1A2B4A">确认业务规则</text>

      <circle cx="8" cy="62" r="6" fill="#2A4A7A"/>
      <text x="20" y="66" font-family="Georgia" font-size="12" fill="#1A2B4A">代码审查和验收</text>
    </g>

    <!-- AI column -->
    <text x="380" y="30" text-anchor="middle" font-family="Georgia" font-size="14" font-weight="bold" fill="#C4786A">AI价值</text>
    <line x1="280" y1="40" x2="480" y2="40" stroke="#C4786A" stroke-width="1"/>

    <g transform="translate(290, 55)">
      <circle cx="8" cy="8" r="6" fill="#C4786A"/>
      <text x="20" y="12" font-family="Georgia" font-size="12" fill="#1A2B4A">系统性枚举边界情况</text>

      <circle cx="8" cy="35" r="6" fill="#C4786A"/>
      <text x="20" y="39" font-family="Georgia" font-size="12" fill="#1A2B4A">生成代码框架</text>

      <circle cx="8" cy="62" r="6" fill="#C4786A"/>
      <text x="20" y="66" font-family="Georgia" font-size="12" fill="#1A2B4A">提供测试用例模板</text>
    </g>

    <!-- Collaboration arrow -->
    <path d="M 500 80 Q 550 80 580 80" fill="none" stroke="#5A8A6E" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="600" y="85" font-family="Georgia" font-size="12" fill="#5A8A6E" font-weight="bold">协作产出</text>
    <text x="600" y="105" font-family="Georgia" font-size="10" fill="#6B7B8C">高质量</text>
    <text x="600" y="120" font-family="Georgia" font-size="10" fill="#6B7B8C">可维护代码</text>
  </g>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1A2B4A"/>
    </marker>
  </defs>
</svg>
