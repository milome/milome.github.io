<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="400" viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="700" height="400" fill="#F8F6F1"/>

  <!-- Title -->
  <text x="350" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#1A2B4A">
    项目资源导航
  </text>

  <!-- Central hub -->
  <g transform="translate(350, 150)">
    <circle cx="0" cy="0" r="60" fill="#2A4A7A" opacity="0.95"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Georgia" font-size="14" font-weight="bold" fill="#FFFFFF">Micang</text>
    <text x="0" y="15" text-anchor="middle" font-family="Georgia" font-size="14" font-weight="bold" fill="#FFFFFF">Trader</text>
  </g>

  <!-- Resource nodes -->
  <!-- Node 1: Core Code -->
  <g transform="translate(150, 100)">
    <rect x="-70" y="-30" width="140" height="60" fill="#FFFFFF" stroke="#5A8A6E" stroke-width="2" rx="8"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Georgia" font-size="12" font-weight="bold" fill="#5A8A6E">核心代码</text>
    <text x="0" y="10" text-anchor="middle" font-family="monospace" font-size="9" fill="#1A2B4A">period_utils.py</text>
    <line x1="70" y1="0" x2="170" y2="50" stroke="#5A8A6E" stroke-width="1.5"/>
    <polygon points="170,50 165,45 165,55" fill="#5A8A6E"/>
  </g>

  <!-- Node 2: Tests -->
  <g transform="translate(550, 100)">
    <rect x="-70" y="-30" width="140" height="60" fill="#FFFFFF" stroke="#5A7A9A" stroke-width="2" rx="8"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Georgia" font-size="12" font-weight="bold" fill="#5A7A9A">测试套件</text>
    <text x="0" y="10" text-anchor="middle" font-family="monospace" font-size="9" fill="#1A2B4A">test_period_utils.py</text>
    <line x1="-70" y1="0" x2="-170" y2="50" stroke="#5A7A9A" stroke-width="1.5"/>
    <polygon points="-170,50 -165,45 -165,55" fill="#5A7A9A"/>
  </g>

  <!-- Node 3: Documentation -->
  <g transform="translate(150, 280)">
    <rect x="-70" y="-30" width="140" height="60" fill="#FFFFFF" stroke="#C4786A" stroke-width="2" rx="8"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Georgia" font-size="12" font-weight="bold" fill="#C4786A">设计文档</text>
    <text x="0" y="10" text-anchor="middle" font-family="monospace" font-size="9" fill="#1A2B4A">CLAUDE.md</text>
    <line x1="70" y1="0" x2="170" y2="-80" stroke="#C4786A" stroke-width="1.5"/>
    <polygon points="170,-80 165,-75 165,-85" fill="#C4786A"/>
  </g>

  <!-- Node 4: Bugfix -->
  <g transform="translate(550, 280)">
    <rect x="-70" y="-30" width="140" height="60" fill="#FFFFFF" stroke="#8A6B7A" stroke-width="2" rx="8"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Georgia" font-size="12" font-weight="bold" fill="#8A6B7A">Bug修复记录</text>
    <text x="0" y="10" text-anchor="middle" font-family="monospace" font-size="9" fill="#1A2B4A">BUGFIX_*.md</text>
    <line x1="-70" y1="0" x2="-170" y2="-80" stroke="#8A6B7A" stroke-width="1.5"/>
    <polygon points="-170,-80 -165,-75 -165,-85" fill="#8A6B7A"/>
  </g>

  <!-- Quick links bar -->
  <g transform="translate(50, 360)">
    <rect x="0" y="0" width="600" height="30" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="1" rx="5"/>
    <text x="20" y="20" font-family="Georgia" font-size="11" fill="#1A2B4A" font-weight="bold">快速链接：</text>
    <text x="100" y="20" font-family="monospace" font-size="9" fill="#5A8A6E">github.com/milome/micang-trader</text>
  </g>

  <!-- GitHub icon -->
  <g transform="translate="580" y="360">
    <circle cx="15" cy="15" r="12" fill="#1A2B4A"/>
    <text x="15" y="20" text-anchor="middle" font-family="Georgia" font-size="10" fill="#FFFFFF">GH</text>
  </g>
</svg>
