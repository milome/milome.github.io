<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#0f172a"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#f1f5f9">多进程架构（Zero-Copy 共享内存）</text>

  <!-- Main Process Box -->
  <rect x="50" y="60" width="380" height="200" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="240" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#93c5fd">主进程（Main Process）</text>

  <!-- Tick Event -->
  <rect x="70" y="100" width="100" height="40" rx="4" fill="#3b82f6" stroke="#60a5fa" stroke-width="1"/>
  <text x="120" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#fff">Tick 事件</text>

  <!-- BarGenerator -->
  <rect x="200" y="100" width="100" height="40" rx="4" fill="#3b82f6" stroke="#60a5fa" stroke-width="1"/>
  <text x="250" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#fff">BarGenerator</text>

  <!-- Shared Memory -->
  <rect x="150" y="170" width="200" height="60" rx="4" fill="#164e63" stroke="#22d3ee" stroke-width="2"/>
  <text x="250" y="195" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#fff">共享内存（Shared Memory）</text>
  <text x="250" y="215" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cffafe">K-Line 数据（mmap）</text>

  <!-- IPC -->
  <rect x="320" y="100" width="90" height="40" rx="4" fill="#3b82f6" stroke="#60a5fa" stroke-width="1"/>
  <text x="365" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#fff">IPC 通知</text>

  <!-- Arrows in Main Process -->
  <line x1="170" y1="120" x2="195" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="250" y1="140" x2="250" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="140" x2="350" y2="280" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="280" x2="500" y2="280" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="280" x2="350" y2="420" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="420" x2="500" y2="420" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Worker 1 Box -->
  <rect x="510" y="60" width="340" height="200" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="680" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#86efac">Worker 进程 1</text>

  <!-- Worker 1 Components -->
  <rect x="530" y="100" width="90" height="40" rx="4" fill="#16a34a" stroke="#4ade80" stroke-width="1"/>
  <text x="575" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fff">读取 K-Line</text>

  <rect x="640" y="100" width="90" height="40" rx="4" fill="#16a34a" stroke="#4ade80" stroke-width="1"/>
  <text x="685" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fff">计算 MA</text>

  <rect x="750" y="100" width="90" height="40" rx="4" fill="#16a34a" stroke="#4ade80" stroke-width="1"/>
  <text x="795" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fff">IPC 回传</text>

  <!-- Arrows in Worker 1 -->
  <line x1="620" y1="120" x2="635" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="730" y1="120" x2="745" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Shared Memory Access (Worker 1) -->
  <line x1="575" y1="100" x2="575" y2="60" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="575" y1="60" x2="250" y2="60" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="250" y1="60" x2="250" y2="170" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-dashed)"/>
  <text x="410" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#cffafe">Zero-Copy 读取</text>

  <!-- Worker 2 Box -->
  <rect x="510" y="300" width="340" height="200" rx="8" fill="#713f12" stroke="#eab308" stroke-width="2"/>
  <text x="680" y="325" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#fde047">Worker 进程 2</text>

  <!-- Worker 2 Components -->
  <rect x="530" y="340" width="90" height="40" rx="4" fill="#ca8a04" stroke="#facc15" stroke-width="1"/>
  <text x="575" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fff">读取 K-Line</text>

  <rect x="640" y="340" width="90" height="40" rx="4" fill="#ca8a04" stroke="#facc15" stroke-width="1"/>
  <text x="685" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fff">计算 RSI</text>

  <rect x="750" y="340" width="90" height="40" rx="4" fill="#ca8a04" stroke="#facc15" stroke-width="1"/>
  <text x="795" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fff">IPC 回传</text>

  <!-- Arrows in Worker 2 -->
  <line x1="620" y1="360" x2="635" y2="360" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="730" y1="360" x2="745" y2="360" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Shared Memory Access (Worker 2) -->
  <line x1="575" y1="340" x2="575" y2="300" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="575" y1="300" x2="250" y2="300" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="250" y1="300" x2="250" y2="230" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-dashed)"/>
  <text x="410" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#cffafe">Zero-Copy 读取</text>

  <!-- More Workers Indicator -->
  <rect x="510" y="540" width="340" height="40" rx="4" fill="#374151" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="680" y="565" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9ca3af">... 更多 Worker 进程（MACD, BOLL, KDJ...）</text>

  <!-- Legend -->
  <rect x="50" y="530" width="380" height="50" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="70" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">图例：</text>
  <rect x="110" y="540" width="15" height="15" fill="#164e63" rx="2"/>
  <text x="130" y="552" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#cbd5e1">共享内存</text>
  <line x1="200" y1="547" x2="230" y2="547" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="235" y="552" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#cbd5e1">数据流</text>
  <line x1="290" y1="547" x2="320" y2="547" stroke="#22d3ee" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrowhead-dashed)"/>
  <text x="325" y="552" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#cbd5e1">Zero-Copy 访问</text>
</svg>
