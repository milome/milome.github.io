<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">RAG quality evaluation and safety gates</title>
  <desc id="desc">Shows the three-layer quality evaluation, six-layer safety protection, and how the evaluation set, closeout gate, and reverse audit converge into pre-release evidence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5a2b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="600" fill="#f8f6f3"/>
  <text x="480" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1c1917">Quality, Safety, and Release Loop</text>
  <text x="480" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#78716c">Public /chat needs reviewable evidence, not just plausible answers</text>

  <rect x="40" y="108" width="260" height="402" rx="16" fill="#fafaf9" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1e40af">Three Quality Layers</text>

  <rect x="65" y="165" width="210" height="90" rx="12" fill="#fafaf9" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="197" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1e40af">1. Retrieval Quality</text>
  <text x="170" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">expected sources / recall / current-page scope</text>

  <rect x="65" y="275" width="210" height="90" rx="12" fill="#fafaf9" stroke="#16a34a" stroke-width="2"/>
  <text x="170" y="307" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#166534">2. Citation Quality</text>
  <text x="170" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">dedupe / HTTPS / fresh metadata</text>

  <rect x="65" y="385" width="210" height="90" rx="12" fill="#fafaf9" stroke="#7c3aed" stroke-width="2"/>
  <text x="170" y="417" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#6b21a8">3. Answer Quality</text>
  <text x="170" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">required facts / language / fallback label</text>

  <rect x="350" y="108" width="260" height="402" rx="16" fill="#fafaf9" stroke="#dc2626" stroke-width="2"/>
  <text x="480" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#991b1b">Six Safety Layers</text>

  <rect x="375" y="160" width="210" height="42" rx="10" fill="#fafaf9" stroke="#dc2626" stroke-width="2"/>
  <text x="480" y="187" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#991b1b">Kill Switch</text>

  <rect x="375" y="214" width="210" height="42" rx="10" fill="#fafaf9" stroke="#ef4444" stroke-width="2"/>
  <text x="480" y="241" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#991b1b">Origin Check</text>

  <rect x="375" y="268" width="210" height="42" rx="10" fill="#fafaf9" stroke="#ea580c" stroke-width="2"/>
  <text x="480" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#92400e">Rate Limit</text>

  <rect x="375" y="322" width="210" height="42" rx="10" fill="#fafaf9" stroke="#d97706" stroke-width="2"/>
  <text x="480" y="349" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#92400e">Daily Budget</text>

  <rect x="375" y="376" width="210" height="42" rx="10" fill="#fafaf9" stroke="#8b5a2b" stroke-width="2"/>
  <text x="480" y="403" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#92400e">Circuit Breaker</text>

  <rect x="375" y="430" width="210" height="42" rx="10" fill="#fafaf9" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="457" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1e40af">Input Validation</text>

  <rect x="660" y="108" width="260" height="402" rx="16" fill="#fafaf9" stroke="#16a34a" stroke-width="2"/>
  <text x="790" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#166534">Release Evidence Chain</text>

  <rect x="685" y="168" width="210" height="72" rx="12" fill="#fafaf9" stroke="#16a34a" stroke-width="2"/>
  <text x="790" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#166534">Fixed Evaluation Set</text>
  <text x="790" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">9 high-value question types</text>

  <rect x="685" y="258" width="210" height="72" rx="12" fill="#fafaf9" stroke="#7c3aed" stroke-width="2"/>
  <text x="790" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#6b21a8">Debug Report</text>
  <text x="790" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">failed rule IDs / selected sources</text>

  <rect x="685" y="348" width="210" height="72" rx="12" fill="#fafaf9" stroke="#ea580c" stroke-width="2"/>
  <text x="790" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#92400e">Closeout Gate</text>
  <text x="790" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">build / audit / answer-quality / E2E</text>

  <rect x="685" y="438" width="210" height="50" rx="12" fill="#fafaf9" stroke="#8b5a2b" stroke-width="2"/>
  <text x="790" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#92400e">Reverse Audit</text>

  <line x1="300" y1="320" x2="350" y2="320" stroke="#8b5a2b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="610" y1="320" x2="660" y2="320" stroke="#8b5a2b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="170" y1="255" x2="170" y2="275" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170" y1="365" x2="170" y2="385" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="240" x2="790" y2="258" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="330" x2="790" y2="348" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="420" x2="790" y2="438" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="480" y="548" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#78716c">Boundary: quality explains answer correctness; safety blocks risky requests; closeout blocks weak-evidence releases.</text>
</svg>
