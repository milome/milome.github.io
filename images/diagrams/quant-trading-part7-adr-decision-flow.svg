<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">ADR decision flow</title>
  <desc id="desc">Architecture decision record flow with context, decision, consequence and review.</desc>
  <rect width="1280" height="720" rx="36" fill="#0f172a"/>
  <rect x="56" y="54" width="1168" height="612" rx="30" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="96" y="112" fill="#f8fafc" font-family="Arial" font-size="32" font-weight="700">ADR 决策流 / ADR Flow</text>
  <g fill="#1e293b" stroke="#475569" stroke-width="2" font-family="Arial">
    <rect x="110" y="250" width="210" height="100" rx="20"/>
    <rect x="370" y="250" width="210" height="100" rx="20"/>
    <rect x="630" y="250" width="210" height="100" rx="20"/>
    <rect x="890" y="250" width="210" height="100" rx="20"/>
    <text x="150" y="296" fill="#f8fafc" font-size="20" font-weight="700">Context</text>
    <text x="410" y="296" fill="#f8fafc" font-size="20" font-weight="700">Decision</text>
    <text x="670" y="296" fill="#f8fafc" font-size="20" font-weight="700">Consequence</text>
    <text x="930" y="296" fill="#f8fafc" font-size="20" font-weight="700">Review</text>
  </g>
  <g stroke="#60a5fa" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M320 300 H370"/>
    <path d="M580 300 H630"/>
    <path d="M840 300 H890"/>
  </g>
  <rect x="214" y="472" width="852" height="60" rx="20" fill="#1e293b" stroke="#334155"/>
  <text x="250" y="510" fill="#cbd5e1" font-family="Arial" font-size="18">记录为什么选这个方案、代价是什么、何时复审。</text>
</svg>
