<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">RAG retrieval implementation flow</title>
  <desc id="desc">Shows indexing-time chunking and stable ID generation, plus query-time intent routing, current-page branching, parallel Vectorize and FTS5 recall, RRF fusion, rerank, and no-answer fallback.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5a2b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="600" fill="#f8f6f3"/>
  <text x="480" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1c1917">Retrieval Implementation Flow</text>
  <text x="480" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#78716c">Chunking, intent routing, parallel recall, fusion ranking, and current-page summaries</text>

  <text x="165" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#6b21a8">Indexing Time</text>
  <rect x="40" y="128" width="170" height="72" rx="12" fill="#fafaf9" stroke="#7c3aed" stroke-width="2"/>
  <text x="125" y="157" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#6b21a8">Public HTML</text>
  <text x="125" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">body, title, URL, locale</text>

  <rect x="235" y="128" width="170" height="72" rx="12" fill="#fafaf9" stroke="#ea580c" stroke-width="2"/>
  <text x="320" y="157" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#92400e">800 / 200 Chunking</text>
  <text x="320" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">paragraph, heading, code boundaries</text>

  <rect x="430" y="128" width="190" height="72" rx="12" fill="#fafaf9" stroke="#2563eb" stroke-width="2"/>
  <text x="525" y="157" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1e40af">Stable Chunk ID / Hash</text>
  <text x="525" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">diffs, upserts, metadata-only path</text>

  <line x1="210" y1="164" x2="235" y2="164" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="405" y1="164" x2="430" y2="164" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="122" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#44403c">Query Time</text>
  <rect x="40" y="284" width="165" height="78" rx="12" fill="#fafaf9" stroke="#8b5a2b" stroke-width="2"/>
  <text x="122.5" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#92400e">User Question</text>
  <text x="122.5" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">site search / page summary</text>

  <rect x="240" y="284" width="170" height="78" rx="12" fill="#fafaf9" stroke="#2563eb" stroke-width="2"/>
  <text x="325" y="314" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1e40af">Intent Routing</text>
  <text x="325" y="336" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">site topics / contact / current page</text>

  <rect x="260" y="402" width="180" height="74" rx="12" fill="#fafaf9" stroke="#dc2626" stroke-width="2"/>
  <text x="350" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#991b1b">Current-Page Branch</text>
  <text x="350" y="454" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">URL match / pageContext fallback</text>

  <rect x="470" y="256" width="180" height="74" rx="12" fill="#fafaf9" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#166534">Vectorize topK=30</text>
  <text x="560" y="308" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">semantic recall</text>

  <rect x="470" y="356" width="180" height="74" rx="12" fill="#fafaf9" stroke="#1e40af" stroke-width="2"/>
  <text x="560" y="386" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1e40af">D1 FTS5 topK=30</text>
  <text x="560" y="408" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">error codes / model names / numbers</text>

  <rect x="695" y="286" width="200" height="86" rx="12" fill="#fafaf9" stroke="#7c3aed" stroke-width="2"/>
  <text x="795" y="317" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#6b21a8">RRF + Document Cap</text>
  <text x="795" y="339" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">topK=24</text>
  <text x="795" y="357" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">maxChunksPerDocument=2</text>

  <rect x="695" y="398" width="200" height="86" rx="12" fill="#fafaf9" stroke="#ea580c" stroke-width="2"/>
  <text x="795" y="429" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#92400e">qwen3-rerank</text>
  <text x="795" y="451" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">topN=6; fallback to RRF</text>

  <rect x="470" y="486" width="180" height="74" rx="12" fill="#fafaf9" stroke="#22c55e" stroke-width="2"/>
  <text x="560" y="516" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#166534">Citation Prompt</text>
  <text x="560" y="538" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">scope locked for page summary</text>

  <rect x="695" y="500" width="200" height="60" rx="12" fill="#fafaf9" stroke="#16a34a" stroke-width="2"/>
  <text x="795" y="526" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#166534">Answer / No Answer</text>
  <text x="795" y="546" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">explicit fallback on weak evidence</text>

  <line x1="205" y1="323" x2="240" y2="323" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="308" x2="470" y2="293" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="338" x2="470" y2="393" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="325" y1="362" x2="325" y2="402" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="319" x2="695" y2="319" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="393" x2="695" y2="339" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="439" x2="470" y2="523" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="795" y1="372" x2="795" y2="398" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="695" y1="441" x2="650" y2="523" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="523" x2="695" y2="530" stroke="#8b5a2b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="480" y="586" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle" fill="#78716c">Boundary: page summaries route separately; Vectorize and FTS5 run in parallel; rerank failure must not break answers.</text>
</svg>
