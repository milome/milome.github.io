<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-feedback" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#0f172a"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#f1f5f9">BMAD 多 Agent 协作流程</text>
  <text x="450" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">Brainstorming Multi-Agent Development</text>

  <!-- Main Container -->
  <rect x="50" y="80" width="800" height="340" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>

  <!-- Architect -->
  <g>
    <rect x="80" y="110" width="140" height="100" rx="8" fill="#1e40af" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="150" cy="140" r="20" fill="#3b82f6"/>
    <text x="150" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#fff">🏗️</text>
    <text x="150" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#93c5fd">Architect</text>
    <text x="150" y="198" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">架构师</text>
  </g>

  <!-- Implementer -->
  <g>
    <rect x="260" y="110" width="140" height="100" rx="8" fill="#166534" stroke="#22c55e" stroke-width="2"/>
    <circle cx="330" cy="140" r="20" fill="#22c55e"/>
    <text x="330" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#fff">💻</text>
    <text x="330" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#86efac">Implementer</text>
    <text x="330" y="198" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">实现者</text>
  </g>

  <!-- Reviewer -->
  <g>
    <rect x="440" y="110" width="140" height="100" rx="8" fill="#92400e" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="510" cy="140" r="20" fill="#f59e0b"/>
    <text x="510" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#fff">🔍</text>
    <text x="510" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#fde047">Reviewer</text>
    <text x="510" y="198" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">审查者</text>
  </g>

  <!-- Tester -->
  <g>
    <rect x="620" y="110" width="140" height="100" rx="8" fill="#9f1239" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="690" cy="140" r="20" fill="#f43f5e"/>
    <text x="690" y="146" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#fff">🧪</text>
    <text x="690" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#fda4af">Tester</text>
    <text x="690" y="198" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">测试者</text>
  </g>

  <!-- Documenter -->
  <g>
    <rect x="350" y="280" width="140" height="100" rx="8" fill="#6b21a8" stroke="#a855f7" stroke-width="2"/>
    <circle cx="420" cy="310" r="20" fill="#a855f7"/>
    <text x="420" y="316" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#fff">📝</text>
    <text x="420" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#d8b4fe">Documenter</text>
    <text x="420" y="368" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">文档员</text>
  </g>

  <!-- Arrows -->
  <!-- Architect -> Implementer -->
  <line x1="220" y1="160" x2="255" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Implementer -> Reviewer -->
  <line x1="400" y1="160" x2="435" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Reviewer -> Tester -->
  <line x1="580" y1="160" x2="615" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tester -> Documenter -->
  <line x1="650" y1="210" x2="650" y2="250" stroke="#64748b" stroke-width="2"/>
  <line x1="650" y1="250" x2="495" y2="250" stroke="#64748b" stroke-width="2"/>
  <line x1="495" y1="250" x2="495" y2="280" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Feedback arrow (Documenter -> Architect) -->
  <path d="M 350 330 Q 150 330 150 210" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-feedback)"/>
  <text x="240" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fbbf24">反馈迭代</text>

  <!-- Role descriptions -->
  <rect x="540" y="280" width="280" height="120" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="555" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">各角色职责：</text>
  <text x="555" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#93c5fd">🏗️ 架构师</text>
  <text x="640" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#cbd5e1">设计系统架构和接口</text>
  <text x="555" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#86efac">💻 实现者</text>
  <text x="640" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#cbd5e1">编写核心功能代码</text>
  <text x="555" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fde047">🔍 审查者</text>
  <text x="640" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#cbd5e1">代码审查和质量把关</text>
  <text x="555" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fda4af">🧪 测试者</text>
  <text x="640" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#cbd5e1">编写测试用例和验证</text>
  <text x="555" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#d8b4fe">📝 文档员</text>
  <text x="640" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#cbd5e1">撰写文档和示例</text>

  <!-- Bottom note -->
  <text x="450" y="465" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">💡 每个 Agent 都是 AI 驱动的自动化角色，通过上下文共享实现协作</text>
</svg>