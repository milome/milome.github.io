<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <!-- Background -->
  <rect width="700" height="500" fill="#0f172a"/>

  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#f1f5f9">测试金字塔</text>

  <!-- Pyramid levels -->
  <!-- E2E Tests (Top) -->
  <path d="M 350 80 L 500 180 L 200 180 Z" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
  <text x="350" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#fff">E2E 测试</text>
  <text x="350" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fca5a5">关键路径验证</text>

  <!-- Integration Tests (Middle) -->
  <path d="M 200 180 L 500 180 L 550 280 L 150 280 Z" fill="#92400e" stroke="#f59e0b" stroke-width="2"/>
  <text x="350" y="230" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#fff">集成测试</text>
  <text x="350" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#fde047">模块交互验证</text>

  <!-- Unit Tests (Bottom) -->
  <path d="M 150 280 L 550 280 L 620 420 L 80 420 Z" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="350" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#fff">单元测试</text>
  <text x="350" y="370" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#86efac">核心逻辑验证</text>

  <!-- Percentages -->
  <text x="580" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#ef4444">5%</text>
  <text x="580" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#f59e0b">15%</text>
  <text x="580" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#22c55e">80%</text>

  <!-- Characteristics -->
  <rect x="80" y="440" width="540" height="45" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="100" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">
    <tspan fill="#ef4444">▲ 成本高、速度慢、覆盖少</tspan>
    <tspan x="280" fill="#cbd5e1"> ← 运行速度 → </tspan>
    <tspan x="430" fill="#22c55e">▼ 成本低、速度快、覆盖广</tspan>
  </text>
</svg>