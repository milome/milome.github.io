<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#F8F6F1"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#1A2B4A">
    HKFE 交易时间结构
  </text>

  <!-- Main Timeline -->
  <g transform="translate(50, 100)">
    <!-- Timeline base -->
    <line x1="0" y1="150" x2="700" y2="150" stroke="#1A2B4A" stroke-width="3"/>

    <!-- Night Session (T Day) -->
    <rect x="0" y="80" width="280" height="70" fill="#2A4A7A" opacity="0.8" rx="5"/>
    <text x="140" y="105" text-anchor="middle" font-family="Georgia" font-size="14" fill="#FFFFFF">夜盘 (T日)</text>
    <text x="140" y="125" text-anchor="middle" font-family="Georgia" font-size="12" fill="#E8E4DC">17:15 - 03:00</text>

    <!-- Cross-session gap -->
    <rect x="280" y="80" width="140" height="70" fill="#C4786A" opacity="0.3" rx="5" stroke="#C4786A" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="350" y="105" text-anchor="middle" font-family="Georgia" font-size="12" fill="#C4786A">跨市场</text>
    <text x="350" y="125" text-anchor="middle" font-family="Georgia" font-size="11" fill="#8B5A52">等待期</text>

    <!-- Day Session (T+1 Day) -->
    <rect x="420" y="80" width="280" height="70" fill="#5A8A6E" opacity="0.8" rx="5"/>
    <text x="560" y="105" text-anchor="middle" font-family="Georgia" font-size="14" fill="#FFFFFF">日盘 (T+1日)</text>
    <text x="560" y="125" text-anchor="middle" font-family="Georgia" font-size="12" fill="#E8E4DC">09:15 - 16:30</text>

    <!-- Time markers -->
    <line x1="0" y1="150" x2="0" y2="165" stroke="#1A2B4A" stroke-width="2"/>
    <text x="0" y="185" text-anchor="middle" font-family="Georgia" font-size="11" fill="#1A2B4A">17:15</text>

    <line x1="140" y1="150" x2="140" y2="165" stroke="#1A2B4A" stroke-width="1"/>
    <text x="140" y="185" text-anchor="middle" font-family="Georgia" font-size="10" fill="#6B7B8C">21:15</text>

    <line x1="280" y1="150" x2="280" y2="165" stroke="#C4786A" stroke-width="2"/>
    <text x="280" y="185" text-anchor="middle" font-family="Georgia" font-size="11" fill="#C4786A">03:00</text>

    <line x1="420" y1="150" x2="420" y2="165" stroke="#5A8A6E" stroke-width="2"/>
    <text x="420" y="185" text-anchor="middle" font-family="Georgia" font-size="11" fill="#5A8A6E">09:15</text>

    <line x1="560" y1="150" x2="560" y2="165" stroke="#1A2B4A" stroke-width="1"/>
    <text x="560" y="185" text-anchor="middle" font-family="Georgia" font-size="10" fill="#6B7B8C">12:30</text>

    <line x1="700" y1="150" x2="700" y2="165" stroke="#1A2B4A" stroke-width="2"/>
    <text x="700" y="185" text-anchor="middle" font-family="Georgia" font-size="11" fill="#1A2B4A">16:30</text>

    <!-- Special markers -->
    <line x1="350" y1="80" x2="350" y2="40" stroke="#C4786A" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="350" y="30" text-anchor="middle" font-family="Georgia" font-size="12" fill="#C4786A" font-weight="bold">03:00</text>

    <line x1="420" y1="80" x2="420" y2="40" stroke="#5A8A6E" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="420" y="30" text-anchor="middle" font-family="Georgia" font-size="12" fill="#5A8A6E" font-weight="bold">09:15</text>
  </g>

  <!-- Key Issues Box -->
  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="700" height="180" fill="#FFFFFF" stroke="#E8E4DC" stroke-width="2" rx="10"/>
    <text x="20" y="30" font-family="Georgia" font-size="16" font-weight="bold" fill="#1A2B4A">⚠️ 关键难点</text>

    <g transform="translate(30, 50)">
      <!-- Issue 1 -->
      <circle cx="10" cy="10" r="8" fill="#C4786A" opacity="0.2"/>
      <text x="10" y="14" text-anchor="middle" font-family="Georgia" font-size="12" fill="#C4786A" font-weight="bold">1</text>
      <text x="30" y="14" font-family="Georgia" font-size="13" fill="#1A2B4A">夜盘跨越自然日（17:15到次日03:00）</text>

      <!-- Issue 2 -->
      <circle cx="10" cy="45" r="8" fill="#C4786A" opacity="0.2"/>
      <text x="10" y="49" text-anchor="middle" font-family="Georgia" font-size="12" fill="#C4786A" font-weight="bold">2</text>
      <text x="30" y="49" font-family="Georgia" font-size="13" fill="#1A2B4A">跨市场周期 03:00-09:15 无交易</text>

      <!-- Issue 3 -->
      <circle cx="10" cy="80" r="8" fill="#C4786A" opacity="0.2"/>
      <text x="10" y="84" text-anchor="middle" font-family="Georgia" font-size="12" fill="#C4786A" font-weight="bold">3</text>
      <text x="30" y="84" font-family="Georgia" font-size="13" fill="#1A2B4A">周一第一根K线要"回退"到上周六</text>

      <!-- Issue 4 -->
      <circle cx="360" cy="10" r="8" fill="#C4786A" opacity="0.2"/>
      <text x="360" y="14" text-anchor="middle" font-family="Georgia" font-size="12" fill="#C4786A" font-weight="bold">4</text>
      <text x="380" y="14" font-family="Georgia" font-size="13" fill="#1A2B4A">节假日前强制收盘</text>

      <!-- Issue 5 -->
      <circle cx="360" cy="45" r="8" fill="#C4786A" opacity="0.2"/>
      <text x="360" y="49" text-anchor="middle" font-family="Georgia" font-size="12" fill="#C4786A" font-weight="bold">5</text>
      <text x="380" y="49" font-family="Georgia" font-size="13" fill="#1A2B4A">半日市（除夕、圣诞前）</text>

      <!-- Issue 6 -->
      <circle cx="360" cy="80" r="8" fill="#C4786A" opacity="0.2"/>
      <text x="360" y="84" text-anchor="middle" font-family="Georgia" font-size="12" fill="#C4786A" font-weight="bold">6</text>
      <text x="380" y="84" font-family="Georgia" font-size="13" fill="#1A2B4A">时区混用问题（aware vs naive）</text>
    </g>

    <!-- Visual representation of cross-session problem -->
    <g transform="translate(500, 40)">
      <rect x="0" y="0" width="160" height="110" fill="#F8F6F1" stroke="#C4786A" stroke-width="1" rx="5"/>
      <text x="80" y="25" text-anchor="middle" font-family="Georgia" font-size="11" fill="#1A2B4A">跨市场周期示意</text>
      <line x1="20" y1="45" x2="140" y2="45" stroke="#C4786A" stroke-width="8" opacity="0.3"/>
      <text x="30" y="55" font-family="Georgia" font-size="9" fill="#C4786A">03:00</text>
      <text x="105" y="55" font-family="Georgia" font-size="9" fill="#C4786A">09:15</text>
      <text x="80" y="85" text-anchor="middle" font-family="Georgia" font-size="10" fill="#8B5A52">无交易</text>
      <text x="80" y="100" text-anchor="middle" font-family="Georgia" font-size="10" fill="#8B5A52">但属于同一周期</text>
    </g>
  </g>

  <!-- Decorative elements -->
  <circle cx="30" cy="30" r="15" fill="none" stroke="#E8E4DC" stroke-width="1"/>
  <circle cx="770" cy="470" r="20" fill="none" stroke="#E8E4DC" stroke-width="1"/>
</svg>
